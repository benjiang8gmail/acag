<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="design_doc_mode" content="canvas"><style>body{margin:0;background:#e6e6e6;font-family:'Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif;color:#242424}a{color:#0f6cbd}a:hover{color:#115ea3}:focus-visible{outline:2px solid #0f6cbd;outline-offset:2px}</style></helmet>
<div style="padding:28px 40px 60px;display:flex;flex-direction:column;gap:20px;width:max-content">
<div style="display:flex;align-items:center;gap:16px">
<div style="display:flex;flex-direction:column;gap:2px"><div style="font-size:20px;font-weight:600">Hansard Watch — interactive prototype</div><div style="font-size:13px;color:#616161">Spec v1.2 · opens without sign-in · sign in (acag, any password) only to refresh data · the address bar shows the shareable link</div></div>
<div style="flex:1;min-width:40px"></div>
<div role="tablist" style="display:flex;border:1px solid #d1d1d1;border-radius:4px;overflow:hidden;background:#fff">
<sc-for list="{{ views }}" as="v" hint-placeholder-count="3"><button onClick="{{ v.pick }}" role="tab" style="height:32px;padding:0 14px;border:none;background:{{ v.bg }};color:{{ v.fg }};font:inherit;font-size:13px;font-weight:{{ v.fw }};cursor:pointer">{{ v.label }}</button></sc-for>
</div>
<button onClick="{{ restart }}" style="height:32px;padding:0 14px;border:1px solid #d1d1d1;border-radius:4px;background:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer" style-hover="background:#f5f5f5">Restart first run</button>
</div>
<div style="display:flex;gap:48px;align-items:flex-start">
<sc-if value="{{ showDesk }}">
<div style="display:flex;flex-direction:column;gap:8px">
<div style="font-size:12px;color:#616161">Desktop · 1280 × 800</div>
<div style="width:1280px;height:800px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column">
<div style="height:32px;flex:none;background:#f0f0f0;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:6px;padding:0 12px"><span style="width:10px;height:10px;border-radius:50%;background:#d1d1d1"></span><span style="width:10px;height:10px;border-radius:50%;background:#d1d1d1"></span><span style="width:10px;height:10px;border-radius:50%;background:#d1d1d1"></span><div title="This is the shareable link — it updates as you click" style="margin-left:12px;height:22px;flex:1;min-width:0;max-width:900px;border-radius:4px;background:#fff;display:flex;align-items:center;padding:0 10px;font-size:12px;color:#424242"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ url }}</span></div></div>
<dc-import name="Hansard Watch App" mobile="{{ false }}" hint-size="1280px,768px" style="display:block;width:1280px;height:768px"></dc-import>
</div>
</div>
</sc-if>
<sc-if value="{{ showMob }}">
<div style="display:flex;flex-direction:column;gap:8px">
<div style="font-size:12px;color:#616161">Mobile · 390 × 844</div>
<div style="width:414px;height:868px;box-sizing:border-box;padding:12px;border-radius:52px;background:#1b1b1b;box-shadow:0 8px 24px rgba(0,0,0,.25)">
<div style="width:390px;height:844px;border-radius:40px;overflow:hidden;background:#fff;display:flex;flex-direction:column">
<div style="height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600;background:#fff"><span>9:41</span><span style="width:110px;height:28px;border-radius:14px;background:#1b1b1b"></span><span style="font-size:12px">5G ▮</span></div>
<dc-import name="Hansard Watch App" mobile="{{ true }}" hint-size="390px,780px" style="display:block;width:390px;height:780px"></dc-import>
<div style="height:20px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff"><span style="width:130px;height:5px;border-radius:3px;background:#1b1b1b"></span></div>
</div>
</div>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { view: 'both', url: 'https://hansardwatch.acag.org.au/' };
  componentDidMount() { this.onUrl = e => this.setState({ url: e.detail }); window.addEventListener('hw-url', this.onUrl); if (window.__hwUrl) this.setState({ url: window.__hwUrl }); }
  componentWillUnmount() { window.removeEventListener('hw-url', this.onUrl); }
  renderVals() {
    const v = this.state.view;
    return {
      views: [['both', 'Desktop + mobile'], ['desk', 'Desktop'], ['mob', 'Mobile']].map(([k, l]) => ({ label: l, bg: v === k ? '#0f6cbd' : '#fff', fg: v === k ? '#fff' : '#424242', fw: v === k ? '600' : '400', pick: () => this.setState({ view: k }) })),
      url: this.state.url, showDesk: v !== 'mob', showMob: v !== 'desk',
      restart: () => { try { localStorage.removeItem('hw-proto-v2'); } catch (e) {} location.reload(); }
    };
  }
}
</script>
</body>
</html>
