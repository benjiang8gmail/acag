-09-17","chamber":"QLD-LA","house":"Legislative Assembly","speaker":"Mr STEVENS","party":"LNP","side":"government","debate":"Report, Motion to Take Note","kind":"speech","page":"2982","text":"I rise to speak to this excellent report by the Auditor-General in relation to ecotourism, and the disappointing fact that over the last 10 years under the Labor government, we have had only three ecotourism projects go ahead in Queensland. There is only one reason this has happened over the…","url":"https://documents.parliament.qld.gov.au/events/han/2026/2026_09_17_DAILY.pdf#page=66","report":null,"reportHow":null,"sectors":[]},{"id":"s21241","src":"scan","jur":"QLD","date":"2026-09-17","chamber":"QLD-LA","house":"Legislative Assembly","speaker":"Mr DALTON","party":"LNP","side":"government","debate":"Report, Motion to Take Note","kind":"speech","page":"2980","text":"I rise to make a contribution to debate on Consideration of Auditor-General Report 12: 2022-23—Growing ecotourism in Queensland. From some of the largest electorates—such as those of my colleagues in Gregory and Mirani—to one of the smaller regional electorates of Mackay, there is an opportunity sitting…","url":"https://documents.parliament.qld.gov.au/events/han/2026/2026_09_17_DAILY.pdf#page=64","report":"Growing ecotourism in Queensland (Report 12: 2022-23)","reportHow":"pattern","sectors":[]},{"id":"s21239","src":"scan","jur":"QLD","date":"2026-09-17","chamber":"QLD-LA","house":"Legislative Assembly","speaker":"Mr DILLON","party":"LNP","side":"government","debate":"Report, Motion to Take Note","kind":"speech","page":"2979","text":"I rise to make a short contribution to the Health, Environment and Innovation Committee’s report titled Consideration of Auditor-General Report 12: 2022-23—Growing ecotourism in regional Queensland. Obviously, it was a report commissioned and delivered by the Auditor-General for a period quite some time ago, but due to machinery-of-government changes and then, for…","url":"https://documents.parliament.qld.gov.au/events/han/2026/2026_09_17_DAILY.pdf#page=63","report":"Growing ecotourism in Queensland (Report 12: 2022-23)","reportHow":"pattern","sectors":[]},{"id":"s21238","src":"scan","jur":"QLD","date":"2026-09-17","chamber":"QLD-LA","house":"Legislative Assembly","speaker":"Mr G KELLY","party":"LNP","side":"government","debate":"Report, Motion to Take Note","kind":"speech","page":"2978","text":"I rise to speak on the Health, Environment and Innovation Committee’s consideration of the Queensland Audit Office report Growing ecotourism in Queensland. I want to acknowledge the Minister for the Environment and Tourism, the Hon. Andrew Powell, and his team for the direction they are taking Queensland’s tourism in. There is a buzz around Q…","url":"https://documents.parliament.qld.gov.au/events/han/2026/2026_09_17_DAILY.pdf#page=62","report":null,"reportHow":null,"sectors":[]},{"id":"s21237","src":"scan","jur":"QLD","date":"2026-09-17","chamber":"QLD-LA","house":"Legislative Assembly","speaker":"Mr BAILLIE","party":"LNP","side":"government","debate":"Report, Motion to Take Note","kind":"speech","page":"2978","text":"I rise to speak on the Health, Environment and Innovation Committee’s report titled Consideration of Auditor-General report 12: 2022-23—Growing ecotourism in Queensland. The Auditor-General’s report identified a number of important shortcomings of the former Labor government’s approach, or lack thereof, when it comes to ecotourism. Most signifi…","url":"https://documents.parliament.qld.gov.au/events/han/2026/2026_09_17_DAILY.pdf#page=62","report":"Growing ecotourism in Queensland (Report 12: 2022-23)","reportHow":"pattern","sectors":[]},{"id":"s21235","src":"scan","jur":"QLD","date":"2026-09-17","chamber":"QLD-LA","house":"Legislative Assembly","speaker":"Mr BOOTHMAN","party":"LNP","side":"government","debate":"Report, Motion to Take Note","kind":"speech","page":"2977","text":"It is a pleasure to rise to make a contribution to what the Auditor-General said in Report 12: 2022-23—Growing ecotourism in Queensland. Being a member on the Gold Coast, I can say that ecotourism in Australia’s tourism capital is critically important. Ecotourism on the Gold Coast is something that our r…","url":"https://documents.parliament.qld.gov.au/events/han/2026/2026_09_17_DAILY.pdf#page=61","report":null,"reportHow":null,"sectors":[]},{"id":"s21234","src":"scan","jur":"QLD","date":"2026-09-17","chamber":"QLD-LA","house":"Legislative Assembly","speaker":"Ms JAMES","party":"LNP","side":"government","debate":"Report, Motion to Take Note","kind":"speech","page":"2976","text":"…right across our region. So when a government gets ecotourism wrong, Far North Queensland pays the price. This report lays bare what happened under Labor. The Queensland Audit Office found the state’s success in developing ecotourism had been limited. It found lengthy, complex and costly approval processes. It found vague and poorly defined processes for identifying and planning opportunities. Despite all of…","url":"https://documents.parliament.qld.gov.au/events/han/2026/2026_09_17_DAILY.pdf#page=60","report":null,"reportHow":null,"sectors":[]},{"id":"s21233","src":"scan","jur":"QLD","date":"2026-09-17","chamber":"QLD-LA","house":"Legislative Assembly","speaker":"Ms BOLTON","party":"Ind","side":"crossbench","debate":"Report, Motion to Take Note","kind":"speech","page":"2975","text":"As all in the chamber are aware, the QAO report on growing ecotourism is important and relevant to communities throughout Queensland. For Noosa, where 42 per cent of our shire is protected land, including national parks and a UNESCO listed biosphere reserve, it is espec…","url":"https://documents.parliament.qld.gov.au/events/han/2026/2026_09_17_DAILY.pdf#page=59","report":null,"reportHow":null,"sectors":["local-government"]},{"id":"s21232","src":"scan","jur":"QLD","date":"2026-09-17","chamber":"QLD-LA","house":"Legislative Assembly","speaker":"Mr JAMES","party":"LNP","side" r process; a Treasurer's advance was picked as a funding source after the decision was made.","note":"VAGO's Treasurer's Advance audit dates from November 2020 and has never been refreshed.","url":"https://www.parliament.vic.gov.au/parliamentary-activity/hansard/hansard-details/HANSARD-974425065-35406","report":"VAGO audit of Treasurer's Advances","reportHow":"scan","topic":null,"stance":"attack","verified":"Verified","vsector":"Public administration","sectors":["finance"]},{"id":"v21","src":"cowork","jur":"VIC","date":"2026-05-22","chamber":"VIC-PAEC","house":"Public Accounts and Estimates Committee","speaker":"Chris Barrett","party":"DTF Secretary","side":"witness","seat":"Finance estimates hearing","debate":"Budget estimates","kind":"committee","page":null,"text":"We did have an exchange actually, you and I, around net cash and the Auditor-General, but I would just refer you back to the government's fiscal strategy, which is the operative policy here.","note":"Confirming a running dispute over how VAGO's fiscal-sustainability commentary should be read.","url":"https://www.parliament.vic.gov.au/49da73/contentassets/9bb4549e540f4f2696045ee0a2041574/paec-2026-27-budget-estimates-22-may-finance.pdf","report":null,"reportHow":null,"topic":"A-G commentary on net cash and debt","stance":"neutral","verified":"Verified","vsector":"Public administration","sectors":["finance"]},{"id":"v20","src":"cowork","jur":"VIC","date":"2026-05-20","chamber":"VIC-PAEC","house":"Public Accounts and Estimates Committee","speaker":"Aiv Puglielli / Beth Jones","party":"Greens / Agriculture Victoria CEO","side":"crossbench","seat":"Agriculture estimates hearing","debate":"Budget estimates","kind":"committee","page":null,"text":"The department spent $1.35 million on 10 site rehabilitation grants, but the Auditor-General found no evidence that work had been carried out.","note":"The department said it had since provided evidence for every payment. No over- or under-payment was found.","url":"h rified","vsector":"Public administration","sectors":[]},{"id":"v8","src":"cowork","jur":"VIC","date":"2026-03-05","chamber":"VIC-LC","house":"Legislative Council","speaker":"Gaelle Broad","party":"Nationals","side":"opposition","seat":"Northern Victoria","debate":"Committee stage, Energy Bill","kind":"speech","page":null,"text":"Auditor-General's report in December last year about the transition to renewables says it will be harder for the government to reach targets and it risks electricity shortfalls to meet peak demand and load shedding.","note":"Citing VAGO's December 2025 report during the Energy Bill committee stage.","url":"https://www.parliament.vic.gov.au/493558/globalassets/hansard-daily-pdfs/hansard-974425065-34645/hansard-974425065-34645.pdf","report":"Managing the Transition to Renewable Energy (Dec 2025)","reportHow":"scan","topic":null,"stance":"attack","verified":"Verified","vsector":"Environment & planning","sectors":["environment"]},{"id":"v7","src":"cowork","jur":"VIC","date":"2026-03-05","chamber":"VIC-LC","house":"Legislative Council","speaker":"Melina Bath","party":"Nationals","side":"opposition","seat":"Eastern Victoria","debate":"Members statement","kind":"speech","page":null,"text":"The report identified a total net cost increase of $11.3 billion - billion dollars - across 89 projects and combined project delays equivalent to more than 92 years.","note":"Figures confirmed: $11.31bn increase across 89 projects; 369 quarters of delay across 81 projects.","url":"https://www.parliament.vic.gov.au/493558/globalassets/hansard-daily-pdfs/hansard-974425065-34645/hansard-974425065-34645.pdf","report":"Major Projects Performance Reporting 2025","reportHow":"scan","topic":null,"stance":"attack","verified":"Verified against VAGO report","vsector":"Transport & infrastructure","sectors":["transport"]},{"id":"v6","src":"cowork","jur":"VIC","date":"2026-03-04","chamber":"VIC-LA","house":"Legislative Assembly","speaker":"John Pesutto","party":"Liberal","side":"opposition","seat":"Hawthorn","debate":"Second reading, Construction Enforcement Victoria Bill","kind":"speech","page":null,"text":"Even the Auditor-General has said you cannot rely on the budget papers anymore, and in particular budget paper 4, which deals with all of these capital projects.","note":"Using the Auditor-General's authority to attack the credibility of state capital reporting.","url":"https://www.parliament.vic.gov.au/4a10c1/globalassets/hansard-daily-pdfs/hansard-2145855009-34690/hansard-2145855009-34690.pdf","report":null,"reportHow":null,"topic":"A-G on budget paper reliability","stance":"attack","verified":"Verified (2 fetches)","vsector":"Public administration","sectors":["finance"]},{"id":"v5","src":"cowork","jur":"VIC","date":"2026-03-03","chamber":"VIC-LC","house":"Legislative Council","speaker":"David Davis","party":"Liberal","side":"opposition","seat":"Southern Metro","debate":"Question without notice","kind":"speech","page":null,"text":"Transparency in budget processes is a democratic safeguard. At a time when trust in institutions is under pressure, ensuring integrity agencies are transparently and, by extension, appropriately funded is essential to maintaining public confidence in the system.","note":"Reading the February tri-agency joint paper verbatim into Hansard. The paper is signed by Andrew Greaves, Marlo Baragwanath and Victoria Elliott.","url":"https://www.parliament.vic.gov.au/4a1bc4/globalassets/hansard-daily-pdfs/hansard-974425065-34474/hansard-974425065-34474.pdf","report":null,"reportHow":null,"topic":"Joint integrity agency paper, February 2026","stance":"institutional","verified":"Verified","vsector":"Public administration","sectors":["finance","integrity"]},{"id":"v4","src":"cowork","jur":"VIC","date":"2026-03-03","chamber":"VIC-LC","house":"Legislative Council","speaker":"Aiv Puglielli","party":"Greens","side":"crossbench","seat":"North-Eastern Metro","debate":"Question without notice","kind":"speech","page":null,"text  and infrastructure"},{"id":"housing","label":"Housing and homelessness"},{"id":"justice","label":"Justice, police and corrections"},{"id":"child-protection","label":"Child protection and social services"},{"id":"disability","label":"Disability and NDIS"},{"id":"local-government","label":"Local government"},{"id":"environment","label":"Environment, water and energy"},{"id":"digital","label":"Digital, data and cyber"},{"id":"finance","label":"Public finance and budget"},{"id":"procurement","label":"Procurement and grants"},{"id":"integrity","label":"Integrity and governance"},{"id":"workforce","label":"Public sector workforce"},{"id":"emergency","label":"Emergency management"},{"id":"first-nations","label":"First Nations outcomes"}],"developments":[{"id":"d34","jur":"VIC","date":"2026-10-30","type":"New reports","source":"Office website","headline":"Auditor-General's Report on the Annual Financial Report of the State of Victoria: 2025-26","body":"Clear opinion on the AFR. First general government operating surplus in seven years at $2.4bn, helped by $5.1bn of non-recurrent Commonwealth capital grants, after $50.7bn of operating losses over six years. Gross debt $203.3bn at 30 June 2026, forecast to $244.9bn by 2030. The current fiscal strategy remains focused on short-term outcomes.","why":"Tabled after Parliament rose, so this Parliament cannot debate it.","url":"https://www.audit.vic.gov.au/report/auditor-generals-report-annual-financial-report-state-victoria-2025-26"},{"id":"d33","jur":"VIC","date":"2026-10-22","type":"New reports","source":"Office website","headline":"Follow-up: Management of Spending in Response to COVID-19","body":"Departments have spent at least $39.8bn on COVID-19 but there is no transparent whole-of-government picture. DJSIR estimated $397.0m of $6.2bn paid under three main programs went to high-risk recipients, with $72.5m written off as unrecoverable.","why":"Tabled after Parliament rose, so this Parliament cannot debate it.","url":"https://www.audit.vic.gov.au/report/follow-management-spending-response-covid-19"},{"id":"d32","jur":"VIC","date":"2026-10-20","type":"New reports","source":"Office website","headline":"Government Advertising and Communications","body":"Communications do not always meet legislative requirements to be apolitical, including party-political content on the Premier's media centre website. The governing Act, last amended 2017, has not kept pace with digital channels. 7 of 9 campaigns complied.","why":"Tabled after Parliament rose, so this Parliament cannot debate it.","url":"https://www.audit.vic.gov.au/report/government-advertising-and-communications-0"},{"id":"d31","jur":"VIC","date":"2026-10-14","type":"New reports","source":"Office website","headline":"Managing Victoria's Firefighting Fleet","body":"Fire authorities need an estimated $1.5bn over 2024-25 to 2033-34 but received 12.1% of it from three budgets. No authority completes all scheduled maintenance. DEECA removed 54.4% of its fleet from service because of cracking.","why":"Tabled after Parliament rose, so this Parliament cannot debate it.","url":"https://www.audit.vic.gov.au/report/managing-victorias-firefighting-fleet"},{"id":"d6","jur":"VIC","date":"2026-10-01","type":"Mandate","source":"Public record","headline":"IBAC gains 'follow the money' powers over subcontractors","body":"The IBAC Amendment Act and the Inquiries Amendment (Special Prosecutor) Act both received assent on 1 October 2026, giving IBAC 'follow the money' powers over subcontractors.","why":"Changes the integrity landscape around the bodies VAGO audits; no equivalent change applies to VAGO.","url":null},{"id":"d5","jur":"VIC","date":"2026-09-24","type":"Governance","source":"Hansard","headline":"Final sitting day of the 60th Parliament","body":"The 60th Parliament's final sitting day was Thursday 24 September 2026. An unscheduled sitting week (22-24 September) was added beyond the published calendar, as were Friday 14 August and Friday 28 August in the Council. Parliament expires 3 November 2026 and caretaker begins 6pm that day. The state election is Saturday 28 November 2026 - not yet held as at this scan.","why":"Reports tabled after the House rose cannot be debated by this Parliament.","url":"https://www.parliament.vic.gov.au/4aa28a/globalassets/hansard-daily-pdfs/hansard-974425065-37279/hansard-974425065-37279.pdf"},{"id":"d30","jur":"VIC","date":"2026-09-23","type":"New reports","source":"Office website","headline":"Preventing youth crime","body":"No evidence the Youth Crime Prevention Program reduces offending. Over two-thirds of participants matched to police records offended within 6 months of starting. More than $40m spent since 2016.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/preventing-youth-crime"},{"id":"d29","jur":"VIC","date":"2026-09-16","type":"New reports","source":"Office website","headline":"Public Lottery Licence Extension","body":"Found nothing to suggest the government's licence approach did not seek to optimise value for the state. The $1.145bn upfront premium exceeded the reserve price and no significant probity issues were found, but cost assumptions were not fully cross-checked and public transparency was limited.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/public-lottery-licence-extension"},{"id":"d28","jur":"VIC","date":"2026-09-09","type":"New reports","source":"Office website","headline":"Maintaining State Roads","body":"About 48% of the state road network was in poor or very poor condition in 2024, up from about 39% in 2021. The defects backlog rose from about 80,000 to more than 225,000. DTP has advised government that funding is insufficient.","why":"Raised in Parliament: Annabelle Cleeland, 9 Sep (LA).","url":"https://www.audit.vic.gov.au/report/maintaining-state-roads"},{"id":"d27","jur":"VIC","date":"2026-09-08","type":"New reports","source":"Office website","headline":"Annual Report 2025-26 (VAGO)","body":"VAGO tabled 29 reports against a plan of 23. It reports 66.7% of recommendations implemented against an 80% target, and says costs have risen above indexation, creating a growing gap between revenue and cost of delivery.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/annual-report-2025-26"},{"id":"d4","jur":"VIC","date":"2026-08-26","type":"Responses","source":"Hansard","headline":"Government cuts Suburban Rail Loop estimate after VAGO audit","body":"VAGO's audit of the Suburban Rail Loop (26 August) found the project more likely than not to exceed its disclosed $34.5bn cost. The government responded by cutting its own estimate to $33.3bn, pausing contracts, and announcing the Suburban Rail Loop Authority will merge into VIDA.","why":"The Authority had accepted none of the five recommendations directed to it; the government acted within two days.","url":"https://www.audit.vic.gov.au/report/delivering-suburban-rail-loop"},{"id":"d26","jur":"VIC","date":"2026-08-26","type":"New reports","source":"Office website","headline":"Delivering the Suburban Rail Loop","body":"SRL East is more likely than not to exceed its disclosed cost of up to $34.5bn, with a potential outturn above $36bn and a $5.5bn funding gap at June 2026. The funding strategy is not transparent, including an undisclosed 1% annual fare levy. SRLA accepted none of the five recommendations directed to it.","why":"Raised in Parliament: Gaelle Broad and Richard Welch, 26 Aug (LC); Renee Heath, 24 Sep (LC).","url":"https://www.audit.vic.gov.au/report/delivering-suburban-rail-loop"},{"id":"d3","jur":"VIC","date":"2026-08-25","type":"Audit requests","source":"Hansard","headline":"Committee recommends an Auditor-General review of the waste-to-energy framework","body":"FLAG - SIGNIFICANT: the first and only call for new Auditor-General work in the entire scan. The Economy and Infrastructure Committee recommended VAGO review the waste-to-energy regulatory framework. Ettershank adds that a proposal for a moratorium pending an Auditor-General finding was rejected.","why":"The only request for new VAGO work in eight months, and it comes from a standing committee of the Parliament.","url":"https://www.parliament.vic.gov.au/4a7794/globalassets/hansard-daily-pdfs/hansard-974425065-36500/hansard-974425065-36500.pdf"},{"id":"d2","jur":"VIC","date":"2026-08-20","type":"Governance","source":"Public record","headline":"Royal Commission into major project integrity established","body":"The Royal Commission into the Integrity of Major Public and Civil Infrastructure Construction Projects in Victoria was formally established by Letters Patent on 20 August 2026. Commissioner: the Hon Christopher Kourakis AC. Budget up to $50 million, reporting by 20 August 2027. Public hearings begin 9 November 2026.","why":"The Royal Commission was formally established on 20 August with Letters Patent naming the Suburban Rail Loop Authority, VIDA, the Victorian School Building Authority and Development Victoria as delivery authorities in scope. It has compulsory powers, a $50m budget and reports by 20 August 2027. This topic has moved from an open field to heavily occupied ground.","url":null},{"id":"d40","jur":"NSW","date":"2026-07-31","type":"Program","source":"Office website","headline":"Audit Office NSW publishes its Audit Work Plan 2026–2029","body":"Web page and PDF, \"As at July 2026\".","why":null,"url":"https://www.audit.nsw.gov.au/audit-work-plan-2026-2029"},{"id":"d41","jur":"CTH","date":"2026-07-31","type":"Program","source":"Office website","headline":"ANAO Annual Audit Work Program 2026–27 finalised","body":"The draft was open for comment from 17 Mar to 10 Apr 2026; the final was published about July 2026.","why":null,"url":"https://www.anao.gov.au/work-program/overview"},{"id":"d1","jur":"VIC","date":"2026-07-28","type":"Governance","source":"Public record","headline":"Ben Carroll sworn in as Premier after Jacinta Allan resigns","body":"Premier Jacinta Allan resigned 28 July 2026; Ben Carroll was sworn in the same day and remains Premier. Jess Wilson leads the Opposition.","why":"Allegations of CFMEU-linked corruption inflating Victorian infrastructure costs brought down a Premier on 28 July 2026. The Royal Commission that followed now covers the same delivery agencies VAGO audits, with terms of reference expressly including whether government and delivery authorities adequately discharged their oversight and governance roles.","url":null},{"id":"d25","jur":"VIC","date":"2026-06-30","type":"New reports","source":"Office website","headline":"Investing in Early Intervention Initiatives","body":"Departments do not consistently collect evidence on whether early intervention reduces service demand, and do not calculate whether expected savings are achieved.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/investing-early-intervention-initiatives"},{"id":"d39","jur":"QLD","date":"2026-06-30","type":"Program","source":"Office website","headline":"QAO publishes its Forward work plan 2026–29","body":"Published with an acquittal of the office's prior work plans (June 2026).","why":null,"url":"https://www.qao.qld.gov.au/sites/default/files/2026-06/Forward%20work%20plan%202026%E2%80%9329_0.pdf"},{"id":"d7","jur":"VIC","date":"2026-06-24","type":"Program","source":"Office website","headline":"VAGO Annual Plan 2026–27 tabled","body":"19 of 25 planned audits are still outstanding at 30 Oct 2026.","why":null,"url":"https://www.audit.vic.gov.au/node/35573"},{"id":"d22","jur":"VIC","date":"2026-06-24","type":"New reports","source":"Office website","headline":"Follow-up of Service Victoria: Digital Delivery of Government Services","body":"DGS completed only 1 of 5 recommendations from the 2021 audit and cannot demonstrate whether Service Victoria reduced transaction costs.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/follow-service-victoria-digital-delivery-government-services"},{"id":"d23","jur":"VIC","date":"2026-06-24","type":"New reports","source":"Office website","headline":"Planning and Managing Drainage Schemes in Melbourne's Growth Areas","body":"Melbourne Water has improved approval processing times but still struggles with design and construction review.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/planning-and-managing-drainage-schemes-melbournes-growth-areas"},{"id":"d24","jur":"VIC","date":"2026-06-24","type":"New reports","source":"Office website","headline":"Annual Plan 2026-27","body":"Sets out 3 financial audit reports and 22 performance engagements for 2026-27.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/annual-plan-2026-27"},{"id":"d38","jur":"TAS","date":"2026-06-22","type":"Program","source":"Office website","headline":"Auditor-General's Annual Plan 2026–27 signed","body":"Published under s11 of the Audit Act 2008.","why":null,"url":"https://audit.tas.gov.au/publication/auditor-generals-annual-plan-2026-27/"},{"id":"d20","jur":"VIC","date":"2026-06-17","type":"New reports","source":"Office website","headline":"Delivering School Upgrade Projects","body":"29% of completed projects exceeded cost estimates, 25% exceeded expected completion time; the 'no school in poor condition' target moved from 2030 to June 2034.","why":"Raised in Parliament: Gaelle Broad, 30 Jul (LC).","url":"https://www.audit.vic.gov.au/report/delivering-school-upgrade-projects"},{"id":"d21","jur":"VIC","date":"2026-06-17","type":"New reports","source":"Office website","headline":"Improving Bus Services","body":"Melbourne's bus network is not meeting performance targets and the Bus Plan's 2031 mass-transit ambition is unreachable without substantial extra investment.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/improving-bus-services"},{"id":"d18","jur":"VIC","date":"2026-06-10","type":"New reports","source":"Office website","headline":"Follow-up: Reducing Bushfire Risks","body":"DEECA and CFA kept statewide bushfire risk below the 70% target but did not deliver all planned strategic fuel breaks around Grampians National Park.","why":"Raised in Parliament: Will Fowles, 17 Jun (LA).","url":"https://www.audit.vic.gov.au/report/follow-reducing-bushfire-risks"},{"id":"d19","jur":"VIC","date":"2026-06-10","type":"New reports","source":"Office website","headline":"Reducing the Harm Caused by Distracted Drivers","body":"DJCS does not know if or how its distracted-driver and seatbelt camera program is reducing road accidents, injuries or deaths.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/reducing-harm-caused-distracted-drivers"},{"id":"d37","jur":"ACT","date":"2026-06-09","type":"Program","source":"Office website","headline":"ACT Audit Office releases its Performance Audit Program 2026–27","body":"Covers 2026–27 and 2027–28.","why":null,"url":"https://www.audit.act.gov.au/__data/assets/pdf_file/0003/3080730/ACT-Audit-Office-Performance-Audit-Program-2026-27.pdf"},{"id":"d17","jur":"VIC","date":"2026-06-04","type":"New reports","source":"Office website","headline":"Results of 2025 Audits: TAFEs and Universities","body":"The TAFE sector reported a $94.5m surplus that relied heavily on advance and capital funding.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/results-2025-audits-tafes-and-universities"},{"id":"d16","jur":"VIC","date":"2026-06-03","type":"New reports","source":"Office website","headline":"Out-of-Home Care Services","body":"DFFH is not fully meeting Victorian children's needs. Declining foster carer numbers reduce placement flexibility; Aboriginal children face higher sibling separation rates.","why":"Raised in Parliament: Gaelle Broad and Melina Bath, 3 Jun (LC).","url":"https://www.audit.vic.gov.au/report/out-home-care-services"},{"id":"d36","jur":"NT","date":"2026-06-01","type":"Governance","source":"Public record","headline":"NT ICAC and Ombudsman merge into the Integrity and Ethics Commissioner","body":"Since 1 Jun 2026 the two bodies are one office, the Office of the Integrity and Ethics Commissioner.","why":null,"url":"https://github.com/benjiang8gmail/acag/blob/claude/hansard-watch-app/docs/sources.md"},{"id":"d14","jur":"VIC","date":"2026-05-13","type":"New reports","source":"Office website","headline":"Free TAFE","body":"Free TAFE delivers participation and fee-saving benefits, but costs government 33-94% more per enrolment than comparable subsidised training. 190,653 students started to end 2024; $718.3m in tuition fees as at August 2025.","why":"Raised in Parliament: Sonja Terpstra, 17 Jun (LC).","url":"https://www.audit.vic.gov.au/report/free-tafe"},{"id":"d15","jur":"VIC","date":"2026-05-13","type":"New reports","source":"Office website","headline":"Responses to Performance Engagement Recommendations: Annual Status Update 2026","body":"95% of recommendations accepted and 85% of accepted ones completed, but only 35% by the initial target date. 334 recommendations remain unresolved across 55 agencies.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/responses-performance-engagement-recommendations-annual-status-update-2026"},{"id":"d13","jur":"VIC","date":"2026-04-01","type":"New reports","source":"Office website","headline":"Supporting the Transition from Native Timber Harvesting","body":"87% of redundant workers found new work or retired, but the full-time share fell from 80% to 60%. Record-keeping for payment verification was inadequate.","why":"Raised in Parliament: Raised at PAEC Agriculture, 20 May.","url":"https://www.audit.vic.gov.au/report/supporting-transition-native-timber-harvesting"},{"id":"d12","jur":"VIC","date":"2026-03-30","type":"New reports","source":"Office website","headline":"Results of 2024-25 Audits: Local Government","body":"Councils' financial reports are reliable overall, but over half missed draft report deadlines and 14 missed annual reporting obligations.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/results-2024-25-audits-local-government"},{"id":"d10","jur":"VIC","date":"2026-03-18","type":"New reports","source":"Office website","headline":"Modernising Myki","body":"On track to meet the reset timeline, but overall value for money is uncertain. The reset added 18 months and $136.8 million.","why":"Raised in Parliament: Melina Bath, 18 Mar (LC).","url":"https://www.audit.vic.gov.au/report/modernising-myki"},{"id":"d11","jur":"VIC","date":"2026-03-18","type":"New reports","source":"Office website","headline":"Timely Payments Performance","body":"Agencies reported paying 81.5% of invoices on time in 2024-25, but publicly reported payment timeliness data is not complete or accurate.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/timely-payments-performance"},{"id":"d9","jur":"VIC","date":"2026-03-04","type":"New reports","source":"Office website","headline":"Major Projects Performance Reporting 2025","body":"Public information on major projects does not always give Parliament and the community what they need. $11.31bn total increase in estimated investment across 89 projects; 369 quarters of delay across 81 projects.","why":"Raised in Parliament: Melina Bath, 5 Mar (LC).","url":"https://www.audit.vic.gov.au/report/major-projects-performance-reporting-2025"},{"id":"d8","jur":"VIC","date":"2026-02-18","type":"New reports","source":"Office website","headline":"Ravenhall Correctional Centre: Rehabilitating and Reintegrating Prisoners - Part 2","body":"Reoffending results fall short of performance targets and are similar to other adult male prisons. Long program waitlists persist.","why":"Not raised in Parliament.","url":"https://www.audit.vic.gov.au/report/ravenhall-correctional-centre-rehabilitating-and-reintegrating-prisoners-part-2"},{"id":"d35","jur":"ACT","date":"2026-02-08","type":"Governance","source":"Public record","headline":"Ajay Sharma PSM becomes ACT Auditor-General","body":"Appointed to 7 Feb 2033 (DI2025-305), replacing Michael Harris.","why":null,"url":"https://github.com/benjiang8gmail/acag/blob/claude/hansard-watch-app/docs/sources.md"}],"events":[{"date":"2026-11-03","jur":"VIC","text":"Parliament expires; caretaker period starts at 6 pm"},{"date":"2026-11-09","jur":"VIC","text":"Royal Commission public hearings begin (to 20 Nov)"},{"date":"2026-11-28","jur":"VIC","text":"Victorian state election"},{"date":"2027-03-13","jur":"NSW","text":"NSW state election"}],"vic":{"meta":{"period_start":"3 February 2026","period_end":"24 September 2026","reports_to":"30 October 2026","prepared":"1 November 2026","auditor_general":"Andrew Greaves (Auditor-General since 2016; reappointed 1 September 2023)","coverage":{"lc_days_checked":33,"lc_days_total":41,"la_days_checked":27,"la_days_total":34,"paec_checked":38,"paec_total":44},"context":["The 60th Parliament's final sitting day was Thursday 24 September 2026. An unscheduled sitting week (22-24 September) was added beyond the published calendar, as were Friday 14 August and Friday 28 August in the Council.","Parliament expires 3 November 2026 and caretaker begins 6pm that day. The state election is Saturday 28 November 2026 - not yet held as at this scan.","Premier Jacinta Allan resigned 28 July 2026; Ben Carroll was sworn in the same day and remains Premier. Jess Wilson leads the Opposition.","The Royal Commission into the Integrity of Major Public and Civil Infrastructure Construction Projects in Victoria was formally established by Letters Patent on 20 August 2026. Commissioner: the Hon Christopher Kourakis AC. Budget up to $50 million, reporting by 20 August 2027. Public hearings begin 9 November 2026.","The IBAC Amendment Act and the Inquiries Amendment (Special Prosecutor) Act both received assent on 1 October 2026, giving IBAC 'follow the money' powers over subcontractors.","VAGO's audit of the Suburban Rail Loop (26 August) found the project more likely than not to exceed its disclosed $34.5bn cost. The government responded by cutting its own estimate to $33.3bn, pausing contracts, and announcing the Suburban Rail Loop Authority will merge into VIDA."]},"tabled":[{"title":"Ravenhall Correctional Centre: Rehabilitating and Reintegrating Prisoners - Part 2","date":"2026-02-18","sector":"Justice & regulation","debated":"No statement located","raised":"No","finding":"Reoffending results fall short of performance targets and are similar to other adult male prisons. Long program waitlists persist.","url":"https://www.audit.vic.gov.au/report/ravenhall-correctional-centre-rehabilitating-and-reintegrating-prisoners-part-2"},{"title":"Major Projects Performance Reporting 2025","date":"2026-03-04","sector":"Transport & infrastructure","debated":"Melina Bath, 5 Mar (LC)","raised":"Yes","finding":"Public information on major projects does not always give Parliament and the community what they need. $11.31bn total increase in estimated investment across 89 projects; 369 quarters of delay across 81 projects.","url":"https://www.audit.vic.gov.au/report/major-projects-performance-reporting-2025"},{"title":"Modernising Myki","date":"2026-03-18","sector":"Transport & infrastructure","debated":"Melina Bath, 18 Mar (LC)","raised":"Yes","finding":"On track to meet the reset timeline, but overall value for money is uncertain. The reset added 18 months and $136.8 million.","url":"https://www.audit.vic.gov.au/report/modernising-myki"},{"title":"Timely Payments Performance","date":"2026-03-18","sector":"Public administration","debated":"No statement located","raised":"No","finding":"Agencies reported paying 81.5% of invoices on time in 2024-25, but publicly reported payment timeliness data is not complete or accurate.","url":"https://www.audit.vic.gov.au/report/timely-payments-performance"},{"title":"Results of 2024-25 Audits: Local Government","date":"2026-03-30","sector":"Public administration","debated":"No statement located","raised":"No","finding":"Councils' financial reports are reliable overall, but over half missed draft report deadlines and 14 missed annual reporting obligations.","url":"https://www.audit.vic.gov.au/report/results-2024-25-audits-local-government"},{"title":"Supporting the Transition from Native Timber Harvesting","date":"2026-04-01","sector":"Environment & planning","debated":"Raised at PAEC Agriculture, 20 May","raised":"Yes","finding":"87% of redundant workers found new work or retired, but the full-time share fell from 80% to 60%. Record-keeping for payment verification was inadequate.","url":"https://www.audit.vic.gov.au/report/supporting-transition-native-timber-harvesting"},{"title":"Free TAFE","date":"2026-05-13","sector":"Communities & families","debated":"Sonja Terpstra, 17 Jun (LC)","raised":"Yes","finding":"Free TAFE delivers participation and fee-saving benefits, but costs government 33-94% more per enrolment than comparable subsidised training. 190,653 students started to end 2024; $718.3m in tuition fees as at August 2025.","url":"https://www.audit.vic.gov.au/report/free-tafe"},{"title":"Responses to Performance Engagement Recommendations: Annual Status Update 2026","date":"2026-05-13","sector":"Public administration","debated":"No statement located","raised":"No","finding":"95% of recommendations accepted and 85% of accepted ones completed, but only 35% by the initial target date. 334 recommendations remain unresolved across 55 agencies.","url":"https://www.audit.vic.gov.au/report/responses-performance-engagement-recommendations-annual-status-update-2026"},{"title":"Out-of-Home Care Services","date":"2026-06-03","sector":"Communities & families","debated":"Gaelle Broad and Melina Bath, 3 Jun (LC)","raised":"Yes","finding":"DFFH is not fully meeting Victorian children's needs. Declining foster carer numbers reduce placement flexibility; Aboriginal children face higher sibling separation rates.","url":"https://www.audit.vic.gov.au/report/out-home-care-services"},{"title":"Results of 2025 Audits: TAFEs and Universities","date":"2026-06-04","sector":"Communities & families","debated":"No statement located","raised":"No","finding":"The TAFE sector reported a $94.5m surplus that relied heavily on advance and capital funding.","url":"https://www.audit.vic.gov.au/report/results-2025-audits-tafes-and-universities"},{"title":"Follow-up: Reducing Bushfire Risks","date":"2026-06-10","sector":"Environment & planning","debated":"Will Fowles, 17 Jun (LA)","raised":"Yes","finding":"DEECA and CFA kept statewide bushfire risk below the 70% target but did not deliver all planned strategic fuel breaks around Grampians National Park.","url":"https://www.audit.vic.gov.au/report/follow-reducing-bushfire-risks"},{"title":"Reducing the Harm Caused by Distracted Drivers","date":"2026-06-10","sector":"Transport & infrastructure","debated":"No statement located","raised":"No","finding":"DJCS does not know if or how its distracted-driver and seatbelt camera program is reducing road accidents, injuries or deaths.","url":"https://www.audit.vic.gov.au/report/reducing-harm-caused-distracted-drivers"},{"title":"Delivering School Upgrade Projects","date":"2026-06-17","sector":"Communities & families","debated":"Gaelle Broad, 30 Jul (LC)","raised":"Yes","finding":"29% of completed projects exceeded cost estimates, 25% exceeded expected completion time; the 'no school in poor condition' target moved from 2030 to June 2034.","url":"https://www.audit.vic.gov.au/report/delivering-school-upgrade-projects"},{"title":"Improving Bus Services","date":"2026-06-17","sector":"Transport & infrastructure","debated":"No statement located","raised":"No","finding":"Melbourne's bus network is not meeting performance targets and the Bus Plan's 2031 mass-transit ambition is unreachable without substantial extra investment.","url":"https://www.audit.vic.gov.au/report/improving-bus-services"},{"title":"Follow-up of Service Victoria: Digital Delivery of Government Services","date":"2026-06-24","sector":"Public administration","debated":"No statement located","raised":"No","finding":"DGS completed only 1 of 5 recommendations from the 2021 audit and cannot demonstrate whether Service Victoria reduced transaction costs.","url":"https://www.audit.vic.gov.au/report/follow-service-victoria-digital-delivery-government-services"},{"title":"Planning and Managing Drainage Schemes in Melbourne's Growth Areas","date":"2026-06-24","sector":"Environment & planning","debated":"No statement located","raised":"No","finding":"Melbourne Water has improved approval processing times but still struggles with design and construction review.","url":"https://www.audit.vic.gov.au/report/planning-and-managing-drainage-schemes-melbournes-growth-areas"},{"title":"Annual Plan 2026-27","date":"2026-06-24","sector":"Public administration","debated":"No statement located","raised":"No","finding":"Sets out 3 financial audit reports and 22 performance engagements for 2026-27.","url":"https://www.audit.vic.gov.au/report/annual-plan-2026-27"},{"title":"Investing in Early Intervention Initiatives","date":"2026-06-30","sector":"Communities & families","debated":"No statement located","raised":"No","finding":"Departments do not consistently collect evidence on whether early intervention reduces service demand, and do not calculate whether expected savings are achieved.","url":"https://www.audit.vic.gov.au/report/investing-early-intervention-initiatives"},{"title":"Delivering the Suburban Rail Loop","date":"2026-08-26","sector":"Transport & infrastructure","debated":"Gaelle Broad and Richard Welch, 26 Aug (LC); Renee Heath, 24 Sep (LC)","raised":"Yes","finding":"SRL East is more likely than not to exceed its disclosed cost of up to $34.5bn, with a potential outturn above $36bn and a $5.5bn funding gap at June 2026. The funding strategy is not transparent, including an undisclosed 1% annual fare levy. SRLA accepted none of the five recommendations directed to it.","url":"https://www.audit.vic.gov.au/report/delivering-suburban-rail-loop"},{"title":"Annual Report 2025-26 (VAGO)","date":"2026-09-08","sector":"Public administration","debated":"No statement located","raised":"No","finding":"VAGO tabled 29 reports against a plan of 23. It reports 66.7% of recommendations implemented against an 80% target, and says costs have risen above indexation, creating a growing gap between revenue and cost of delivery.","url":"https://www.audit.vic.gov.au/report/annual-report-2025-26"},{"title":"Maintaining State Roads","date":"2026-09-09","sector":"Transport & infrastructure","debated":"Annabelle Cleeland, 9 Sep (LA)","raised":"Yes","finding":"About 48% of the state road network was in poor or very poor condition in 2024, up from about 39% in 2021. The defects backlog rose from about 80,000 to more than 225,000. DTP has advised government that funding is insufficient.","url":"https://www.audit.vic.gov.au/report/maintaining-state-roads"},{"title":"Public Lottery Licence Extension","date":"2026-09-16","sector":"Public administration","debated":"Parliament not sitting that day; no statement located","raised":"No","finding":"Found nothing to suggest the government's licence approach did not seek to optimise value for the state. The $1.145bn upfront premium exceeded the reserve price and no significant probity issues were found, but cost assumptions were not fully cross-checked and public transparency was limited.","url":"https://www.audit.vic.gov.au/report/public-lottery-licence-extension"},{"title":"Preventing youth crime","date":"2026-09-23","sector":"Justice & regulation","debated":"No statement located","raised":"No","finding":"No evidence the Youth Crime Prevention Program reduces offending. Over two-thirds of participants matched to police records offended within 6 months of starting. More than $40m spent since 2016.","url":"https://www.audit.vic.gov.au/report/preventing-youth-crime"},{"title":"Managing Victoria's Firefighting Fleet","date":"2026-10-14","sector":"Justice & regulation","debated":"Tabled after Parliament rose","raised":"Post-rising","finding":"Fire authorities need an estimated $1.5bn over 2024-25 to 2033-34 but received 12.1% of it from three budgets. No authority completes all scheduled maintenance. DEECA removed 54.4% of its fleet from service because of cracking.","url":"https://www.audit.vic.gov.au/report/managing-victorias-firefighting-fleet"},{"title":"Government Advertising and Communications","date":"2026-10-20","sector":"Public administration","debated":"Tabled after Parliament rose","raised":"Post-rising","finding":"Communications do not always meet legislative requirements to be apolitical, including party-political content on the Premier's media centre website. The governing Act, last amended 2017, has not kept pace with digital channels. 7 of 9 campaigns complied.","url":"https://www.audit.vic.gov.au/report/government-advertising-and-communications-0"},{"title":"Follow-up: Management of Spending in Response to COVID-19","date":"2026-10-22","sector":"Public administration","debated":"Tabled after Parliament rose","raised":"Post-rising","finding":"Departments have spent at least $39.8bn on COVID-19 but there is no transparent whole-of-government picture. DJSIR estimated $397.0m of $6.2bn paid under three main programs went to high-risk recipients, with $72.5m written off as unrecoverable.","url":"https://www.audit.vic.gov.au/report/follow-management-spending-response-covid-19"},{"title":"Auditor-General's Report on the Annual Financial Report of the State of Victoria: 2025-26","date":"2026-10-30","sector":"Public administration","debated":"Tabled after Parliament rose","raised":"Post-rising","finding":"Clear opinion on the AFR. First general government operating surplus in seven years at $2.4bn, helped by $5.1bn of non-recurrent Commonwealth capital grants, after $50.7bn of operating losses over six years. Gross debt $203.3bn at 30 June 2026, forecast to $244.9bn by 2030. The current fiscal strategy remains focused on short-term outcomes.","url":"https://www.audit.vic.gov.au/report/auditor-generals-report-annual-financial-report-state-victoria-2025-26"}],"topics":[{"rank":1,"topic":"Probity and integrity controls over Big Build major project delivery","sector":"Transport & infrastructure","agencies":"DTP; VIDA; SRLA; head contractors","lanes":["Money","Oversight","Parliament","Media","Reform"],"gap":"Not covered","changed":"The Royal Commission was formally established on 20 August with Letters Patent naming the Suburban Rail Loop Authority, VIDA, the Victorian School Building Authority and Development Victoria as delivery authorities in scope. It has compulsory powers, a $50m budget and reports by 20 August 2027. This topic has moved from an open field to heavily occupied ground.","vago":"Still no VAGO probity audit of major project delivery. Delivering the Suburban Rail Loop (26 Aug) covers cost, funding transparency and one sole-source adviser engagement, but not construction-sector integrity.","why":"Allegations of CFMEU-linked corruption inflating Victorian infrastructure costs brought down a Premier on 28 July 2026. The Royal Commission that followed now covers the same delivery agencies VAGO audits, with terms of reference expressly including whether government and delivery authorities adequately discharged their oversight and governance roles.","severity":"A Premier resigned over it and a Royal Commission is sitting. As severe as governance failures get in this state.","scale":"A Big Build program of roughly $100bn; the Royal Commission alone is budgeted at up to $50m.","breadth":"DTP, VIDA, SRLA, VSBA, Development Victoria and every major head-contractor consortium.","urgency":"The window has narrowed sharply. Public hearings start 9 November and run to 20 November, with a final report due August 2027.","question":"Do departments and delivery authorities have effective controls to detect and prevent cost inflation through industrial and subcontracting arrangements on major projects?","caution":"Scope is now largely occupied. Term of reference 2 covers exactly the agency-side oversight question VAGO would otherwise ask. Recommend deferring until the Commission reports, or confining any engagement to a slice the Letters Patent plainly exclude."},{"rank":2,"topic":"Management of remand growth and prison capacity expansion","sector":"Justice & regulation","agencies":"Corrections Victoria (DJCS); Community Safety Building Authority; DTF","lanes":["Money","Oversight","Parliament","Reform"],"gap":"Not covered","changed":"","vago":"Prison Capacity Planning (2012) is 14 years old. Nothing addresses the post-2023 bail-law-driven remand surge, and nothing was added in the final sittings.","why":"Adult remand rose 22% and youth remand 71% between April 2024 and May 2025. At least $956m is committed across two budgets for roughly 1,000 adult beds, 88 youth beds and 720 custodial staff positions. VAGO's Preventing youth crime report (23 Sep) found no evidence the diversion program reduces offending, which strengthens rather than answers the capacity question.","severity":"High. Capacity is being built at speed into a system already carrying substantiated Ombudsman findings on use of force and healthcare access.","scale":"At least $956m committed; 1,000+ new adult beds; 720 new custodial staff roles.","breadth":"Corrections Victoria, Youth Justice, the Community Safety Building Authority, the courts and DTF.","urgency":"High. A July retrospective validation bill covering clinical staff authorisation back to April 2024 suggests a live governance control defect.","question":"Is capacity expansion sequenced against credible remand forecasts, and is custodial recruitment keeping pace so beds do not open understaffed?","caution":""},{"rank":3,"topic":"Cyber security and data breach response across departments","sector":"Public administration","agencies":"Department of Education; OVIC as regulator; whole of government","lanes":["Oversight","Media"],"gap":"Not covered","changed":"","vago":"Cybersecurity: Cloud Computing Products (August 2023) remains the most recent cyber-specific report. Nothing in the 2026-27 plan and nothing tabled in the extended window.","why":"A breach of a Department of Education database exposed personal data for a very large number of Victorian government school students, disclosed mid-January 2026, with OVIC opening a formal investigation on 22 January. This follows the 2024 ZircoDATA breach affecting an unquantified number of Victorian agencies through a shared third-party records manager.","severity":"High. Children's personal data with long-tail identity risk, and a regulator investigation open.","scale":"Reported at 665,000+ students across 1,575 schools by one outlet, though others report 1,700 schools - the precise figure is not corroborated and should be verified before publication.","breadth":"Two distinct incidents in two years spanning a core department and a shared third-party provider.","urgency":"High. Parliament never raised it once in eight months, so it will not arrive via political pressure.","question":"Are departments' cyber controls, including for outsourced data processors, adequate to prevent and detect breaches of this scale?","caution":"Verify the breach scale figures against a departmental statement before citing."},{"rank":4,"topic":"Implementation of the Silver Review public sector efficiency reform","sector":"Public administration","agencies":"DPC; DTF; all VPS departments and portfolio agencies","lanes":["Money","Reform","Media"],"gap":"Not covered","changed":"The reform is now being overtaken by events. The government announced in August it would close Infrastructure Victoria and Economic Growth Victoria, and that SRLA will merge into VIDA - further machinery change on top of the 29 entities already in scope.","vago":"No VAGO report and nothing across the 2026-27, 2027-28 or 2028-29 plan lists.","why":"The government committed to over $4 billion in savings: 332 executive roles removed, consultant and labour hire reductions, and 29 public entities merged, transferred or abolished. Sixteen of the 83 recommendations were rejected.","severity":"High. A whole-of-government restructure of this size carries real service continuity risk if poorly sequenced.","scale":"$4 billion savings target; roughly 1,000 VPS positions plus 332 executive roles; 29 entities restructured, now more.","breadth":"The broadest topic on this list - every department and dozens of statutory agencies.","urgency":"Very high. Implementation is in year one and now spans a change of Premier, a change of DPC Secretary and an election.","question":"Is the government on track to realise the claimed $4 billion, how is progress measured, and are entity consolidations proceeding without weakening service delivery or corporate oversight?","caution":"An incoming government of either colour may restructure this program again. Confirm the policy still stands before scoping."},{"rank":5,"topic":"Ambulance response times and hospital handover delays","sector":"Communities & families","agencies":"Ambulance Victoria; Department of Health","lanes":["Targets","Money","Parliament"],"gap":"Partially covered","changed":"","vago":"Access to Emergency Healthcare (2024) covers handover. Ambulance response time performance has not been dedicated-audited since 2010. Performance of Victoria's Health Services remains an uncommenced 2026-27 plan item.","why":"Statewide Code 1 responses met the 15-minute benchmark in only 65.1% of cases in the December 2025 quarter against an 85% target, flat across five quarters. Handover within 40 minutes ran at 73.3% against a 90% target. In the final sittings the Council heard of a category 1 patient waiting 70 days for a consult and of referrals left unprocessed for 16 months at Mildura.","severity":"High. A 20-point gap on the most urgent response category, sustained.","scale":"Statewide emergency response.","breadth":"Ambulance Victoria plus every hospital emergency department receiving handovers.","urgency":"High, and conspicuously under-debated relative to the data.","question":"Why has Code 1 response performance plateaued 20 points below target, and are the handover and demand-management measures actually shifting it?","caution":"Scope against the planned Performance of Victoria's Health Services audit so the two do not collide."},{"rank":6,"topic":"State oversight of local government governance failures","sector":"Public administration","agencies":"Local Government Victoria; Minister for Local Government","lanes":["Oversight","Parliament","Reform","Media"],"gap":"Not covered","changed":"","vago":"Financial Management of Local Councils (2025) and Results of 2024-25 Audits: Local Government (March 2026) are both financial. Neither examines the monitor-intervention model. The March report drew no statement in either house.","why":"Five councils are under simultaneous state-appointed monitors. The Whittlesea Commission of Inquiry found systemic governance issues at a council already dismissed in March 2020. In the final sittings a Local Government Amendment (Stability of Councils) Bill was debated, with members citing IBAC's Operation Sandon and the Whittlesea inquiry.","severity":"High. A mayor suspended over conduct creating health and safety risks; a second standing aside over a character reference for a convicted child sex offender.","scale":"Five councils under active intervention at once.","breadth":"Five separate unrelated councils - a pattern, not an isolated case.","urgency":"High. Legislation was still moving through Parliament in the final sittings, which means a live reform to audit the implementation of.","question":"Does the state detect council governance failure before ministerial intervention becomes necessary, and do monitor appointments fix the underlying problems?","caution":""},{"rank":7,"topic":"Implementation of Mental Health Royal Commission reforms","sector":"Communities & families","agencies":"Department of Health; Mental Health and Wellbeing Commission","lanes":["Targets","Oversight","Reform"],"gap":"Not covered","changed":"","vago":"The most recent relevant reports date from 2019, two years before the Royal Commission's final report. Emergency Mental Health Services remains an uncommenced plan item scoped narrowly to emergency department access.","why":"No VAGO report has assessed implementation of the largest social policy reform in the state, funded by a dedicated levy. VAGO's own plan rationale notes only 40% of metropolitan emergency department inpatients access a mental health bed within 8 hours. An allegation was raised in the Council in August that status ratings in a Mental Health and Wellbeing Commission report had been altered - unverified, and rejected by the minister.","severity":"High. A generational reform with a hypothecated revenue stream and no independent implementation assessment.","scale":"A dedicated Mental Health and Wellbeing Levy funds the program.","breadth":"Department of Health, area mental health services, the new Commission, and levy administration.","urgency":"Moderate to high. The ten-year implementation window is roughly half elapsed.","question":"Is the reform program delivering the service capacity it promised, and is levy revenue being applied as intended?","caution":"The planned Emergency Mental Health Services audit covers one slice - scope around it."},{"rank":8,"topic":"Emergency Services and Volunteers Fund allocation","sector":"Justice & regulation","agencies":"CFA; FRV; VicSES; Emergency Management Victoria; DTF","lanes":["Money","Parliament","Reform"],"gap":"Partially covered","changed":"VAGO's Managing Victoria's Firefighting Fleet (14 October) now covers fleet condition comprehensively - and vindicates the parliamentary signal. Fund allocation itself remains uncovered, so this topic narrows rather than closes.","vago":"Managing Victoria's Firefighting Fleet (14 Oct 2026) found authorities need an estimated $1.5bn over ten years but received 12.1% of it from three budgets, that no authority completes all scheduled maintenance, and that DEECA removed 54.4% of its fleet from service because of cracking. The fund that pays for it all has never been audited.","why":"The Emergency Services and Volunteers Fund replaced the Fire Services Property Levy and raises substantially more revenue, with FRV taking the large majority. The farm levy component is frozen to mid-2030 at roughly $86m a year in forgone revenue. In September the Council heard a record 62 FRV trucks were offline at the end of August.","severity":"Moderate to high. VAGO has now evidenced the consequence; the allocation mechanism behind it remains unexamined.","scale":"A levy touching every rateable property; the responsible minister has cited more than $1.6bn a year.","breadth":"Three operational agencies plus every Victorian property owner.","urgency":"Moderate. The levy structure has been amended twice already.","question":"How is fund revenue allocated across CFA, FRV and VicSES, does it match operational risk and asset renewal need, and what is the net fiscal effect of repeated farm levy freezes?","caution":"The fleet question is now answered. Confine scope to revenue allocation and the levy's fiscal design."},{"rank":9,"topic":"Victoria Police frontline workforce capacity and resourcing","sector":"Justice & regulation","agencies":"Victoria Police","lanes":["Targets","Parliament","Reform"],"gap":"Partially covered","changed":"Reinforced rather than resolved. In the final sittings members cited 1,400 roster vacancies, station front counters closing from 4 October, and more than 40 stations on reduced hours.","vago":"Two workforce and staff-allocation audits exist but neither date could be confirmed and no refresh was found. Using Police Cells to Detain Prisoners remains an uncommenced plan item touching Victoria Police on a different question.","why":"Victoria Police missed almost every published target in 2024-25: community satisfaction 52.3% against 80%, confidence 58.8% against 82%, crimes against the person resolved within 30 days 35.9% against 45%. Total output cost overran its $4,499.3m target by $110.1m.","severity":"High. Confidence and satisfaction missed target by 25-35 percentage points alongside a falling clearance rate.","scale":"A $4.6 billion annual output, overrunning budget by $110m while missing most delivery targets.","breadth":"Statewide.","urgency":"High. Raised across at least five separate sitting weeks, with the government legislating a 200-strong reservist workaround at $62m rather than resolving recruitment.","question":"Does the workforce and rostering model match demonstrated demand, and what is the economy and efficiency case for the reservist scheme against alternatives?","caution":"A Hansard claim that Victoria is the only mainland state with decreased real police funding could not be verified against primary Productivity Commission data."},{"rank":10,"topic":"Implementation of mandatory carded play and gambling harm reforms","sector":"Justice & regulation","agencies":"Victorian Gambling and Casino Control Commission","lanes":["Reform","Media","Parliament"],"gap":"Not covered","changed":"Strengthened. In August a government backbencher told the Assembly that PAEC's follow-up recommendations on the community benefit test and the pokies tax discount remain outstanding three years on - a government member pressing on unimplemented VAGO-derived recommendations.","vago":"Reducing the Harm Caused by Gambling (2021) was confirmed by direct check not to address carded play or pre-commitment. Nothing in the 2026-27 plan.","why":"Mandatory carded play on all electronic gaming machines commenced 1 December 2025, with load-up limits cut from $1,000 to $100. The scan window now covers the first ten months of live enforcement.","severity":"High in context: the government's own 2023 figures put gambling harm at $7 billion a year affecting 330,000 Victorians.","scale":"Every licensed EGM venue in Victoria and a new statewide regulatory technology framework.","breadth":"One regulator, thousands of venues.","urgency":"Very high on timing. Year one of a flagship reform, before practices harden.","question":"Is mandatory carded play being implemented, monitored and enforced effectively, and what harm-reduction outcome data is the regulator collecting?","caution":"Online gambling advertising intersects with Commonwealth jurisdiction - scope tightly to the state regulator's levers."},{"rank":11,"topic":"Victoria Police complaints handling and IBAC recommendation implementation","sector":"Justice & regulation","agencies":"Victoria Police; IBAC as oversight body","lanes":["Oversight","Reform"],"gap":"Not covered","changed":"Partly overtaken. The IBAC Amendment Act received assent on 1 October, giving IBAC 'follow the money' powers over subcontractors, a lower misconduct threshold and publication of its budget requests. The complaint-handling gap on the Victoria Police side is unaffected.","vago":"No VAGO report addressing Victoria Police complaints handling or IBAC recommendation implementation was found.","why":"IBAC recorded more than 2,300 complaints about Victoria Police in 2025 - about 65% of all complaints it received - and made 51 recommendations, triple the previous year. Victoria Police had implemented only 18 while 57 remained under implementation at 31 December.","severity":"Moderate to high. A growing unimplemented backlog points to a systemic issue.","scale":"2,300+ complaints a year concentrated in one agency.","breadth":"Single agency, statewide effect, with vulnerable complainant cohorts.","urgency":"Moderate. The new Act changes IBAC's powers but not Victoria Police's implementation record.","question":"What is Victoria Police's track record and timeliness in implementing IBAC recommendations, and what governs the growing backlog?","caution":"VAGO does not oversee IBAC's casework. The auditable unit is Victoria Police's implementation."},{"rank":12,"topic":"Water security and urban and rural water corporation performance","sector":"Environment & planning","agencies":"DEECA; Melbourne Water; water corporations; ESC","lanes":["Targets"],"gap":"Not covered","changed":"","vago":"The most relevant reports are water-entity audit snapshots from 2010-11 to 2015-16. No dedicated water security or corporation performance audit in the last four years, and none planned.","why":"A decade without a dedicated performance audit of a sector managing essential services, major capital programs and climate-driven supply risk. Drainage in growth areas was audited in June 2026 but that is a narrow slice.","severity":"Moderate. No acute failure evidenced; the coverage gap itself is the finding.","scale":"Every Victorian household and irrigator.","breadth":"Nineteen water corporations plus DEECA and the economic regulator.","urgency":"Moderate. No trigger event, but a decade of silence in a climate-exposed essential service.","question":"Are Victoria's water corporations delivering against their performance and capital commitments, and is water security planning robust to current climate projections?","caution":"Surfaced from a coverage gap rather than a strong independent signal - needs a targeted evidence sweep before scoping."},{"rank":13,"topic":"Administration of the container deposit scheme and kerbside waste reform","sector":"Environment & planning","agencies":"DEECA; Recycling Victoria; scheme operators","lanes":["Reform","Targets","Parliament"],"gap":"Not covered","changed":"A related and sharper signal emerged: on 25 August the Economy and Infrastructure Committee recommended the Auditor-General review the waste-to-energy regulatory framework - the only call for new VAGO work in the whole scan.","vago":"Waste reports from 2019 and 2021 both predate the scheme's November 2023 launch. Nothing in the 2026-27 plan on either waste stream.","why":"The container deposit scheme launched November 2023 and the four-bin kerbside reform is mid-rollout, with no VAGO coverage of either. Parliament's only treatment of the scheme in eight months was a ministerial success statement. Separately, a parliamentary committee has now formally asked for VAGO to look at waste-to-energy regulation.","severity":"Moderate. Delivery and value-for-money risk rather than evidenced failure.","scale":"Statewide, every household and all 79 councils.","breadth":"DEECA, Recycling Victoria, contracted operators and councils.","urgency":"Raised by the committee referral. A standing invitation from a parliamentary committee is the strongest form of topic lead available.","question":"Is the container deposit scheme meeting recovery targets and delivering value for money, and is the waste-to-energy regulatory framework fit for purpose?","caution":"Treat the waste-to-energy referral as a distinct engagement from the container deposit scheme - they share a department but little else."},{"rank":14,"topic":"Planning permit processing and housing supply target delivery","sector":"Environment & planning","agencies":"DTP; councils; Victorian Planning Authority","lanes":["Targets","Reform","Media"],"gap":"Partially covered","changed":"","vago":"Fishermans Bend (2025) covers one precinct; drainage in growth areas (June 2026) covers enabling infrastructure. No statewide audit of permit processing or Housing Statement progress. Managing Developer Contributions remains an uncommenced plan item.","why":"The housing target is a defining commitment with statewide delivery implications, and permit delay is a persistent theme. VAGO has examined one precinct and one infrastructure stream but not the system.","severity":"Moderate to high. Housing supply shortfalls carry broad economic and social consequences.","scale":"A statewide target in the hundreds of thousands of homes.","breadth":"DTP, the VPA and all 79 councils as responsible authorities.","urgency":"Moderate to high. An election will reset or reaffirm the target.","question":"Is the planning system processing permits within statutory timeframes, and does the state track and report housing supply progress reliably?","caution":""},{"rank":15,"topic":"Use of Treasurer's Advances and unforeseen expenditure","sector":"Public administration","agencies":"DTF; Treasurer","lanes":["Parliament","Money"],"gap":"Partially covered","changed":"Reinforced by VAGO's own October financial audit, which concluded the current fiscal strategy remains focused on short-term outcomes and recorded DTF declining to support one of its four recommendations.","vago":"Accessing Emergency Funding to Meet Urgent Claims (November 2020) is directly on topic but examined only 2019-20. Six years without a refresh.","why":"Raised directly in the Council in June, citing VAGO's finding that two-thirds of advances had not followed proper process. Gross general government debt reached $203.3bn at 30 June 2026 and is forecast to $244.9bn by 2030, so the mechanism's fiscal significance is growing.","severity":"Moderate. A budget-integrity and parliamentary-accountability issue.","scale":"Discretionary appropriation outside the normal budget process.","breadth":"DTF and every department drawing on advances.","urgency":"Moderate. VAGO's own prior findings are being used in Parliament, which raises the question whether they were ever implemented.","question":"Have the 2020 recommendations been implemented, and does current use of Treasurer's Advances follow proper process with adequate parliamentary visibility?","caution":""},{"rank":16,"topic":"Victoria Legal Aid and community legal centre funding sustainability","sector":"Justice & regulation","agencies":"Victoria Legal Aid; community legal centres funded via DJCS","lanes":["Parliament","Money","Media"],"gap":"Partially covered","changed":"","vago":"Access to Legal Aid (2014) examined demand versus funding directly, but for a 2014 snapshot. Twelve years without a refresh.","why":"VLA delivered more than 490,000 services in 2024-25 while using limited cash reserves to defer service reductions, and in May 2026 announced only two and three-year program extensions. In Parliament it was claimed two clients are turned away for every one a community legal centre helps.","severity":"Moderate. The funded agency itself says demand outstrips funding and reserves are being drawn down.","scale":"490,000+ services a year.","breadth":"VLA plus the separately funded community legal centre network.","urgency":"Moderate to high. Short extensions rather than structural funding, as bail and remand reform drives demand for the same services.","question":"Is VLA's funding model keeping pace with bail and remand-driven demand growth, and how consistently is unmet legal need measured?","caution":"Jointly funded with the Commonwealth - scope to Victorian funding decisions and VLA's own management."},{"rank":17,"topic":"EPA regulatory effectiveness under the reformed Environment Protection Act","sector":"Environment & planning","agencies":"Environment Protection Authority Victoria","lanes":["Reform"],"gap":"Partially covered","changed":"","vago":"Only domain-specific older reports were found. No holistic EPA effectiveness review since the reformed Act and general environmental duty commenced in 2021.","why":"EPA's operating model changed fundamentally in July 2021 with the shift to a preventive general environmental duty. Five years on, no independent assessment of whether the new model works.","severity":"Moderate. A regulator-effectiveness question rather than an evidenced failure.","scale":"Every duty holder in Victoria.","breadth":"Single regulator with economy-wide reach.","urgency":"Moderate. Five years is the natural point to test a reformed regulatory model.","question":"Has EPA's shift to a preventive general environmental duty changed regulatory outcomes, and is its enforcement effort risk-based?","caution":"Rests on a coverage gap plus the reform trigger; the independent evidence base is thin."},{"rank":18,"topic":"Delivery of the universal three and four-year-old kindergarten rollout","sector":"Communities & families","agencies":"Department of Education; councils; providers","lanes":["Reform","Parliament"],"gap":"Not covered","changed":"A testable government claim entered the record on 22 September: that three-year-old kinder participation has moved from a little over half of eligible children to over 90 per cent.","vago":"Only adjacent and very old material. The Best Start, Best Life rollout is absent from the 2026-27, 2027-28 and 2028-29 plan lists.","why":"A multi-billion dollar, decade-long universal early childhood commitment delivered through mixed public, council and private providers, with no VAGO coverage at all. Kindergarten funding was a recurring ministerial statement heading across the final sittings.","severity":"Moderate to high. Workforce supply is the known binding constraint on this kind of rollout.","scale":"Universal coverage of Victorian three and four-year-olds.","breadth":"Department of Education, councils and hundreds of providers.","urgency":"Moderate to high. Mid-rollout, and the government response to the Silver review paused new Early Learning and Childcare Centres.","question":"Is the rollout on track against its enrolment, workforce and infrastructure commitments, and how is delivery through third-party providers assured?","caution":""},{"rank":19,"topic":"Grant program integrity and administration","sector":"Public administration","agencies":"Whole of government; departments administering discretionary grants","lanes":["Oversight","Money"],"gap":"Partially covered","changed":"Substantially strengthened by VAGO's own COVID-19 spending follow-up (22 October), which found DJSIR estimated $397.0m of $6.2bn paid under three main programs went to high-risk recipients, with $72.5m written off as unrecoverable.","vago":"Assuring the Integrity of Procurement Activities (2024) and Contractors and Consultants: Management (2025) cover procurement. The COVID follow-up now covers pandemic-era grants. Routine discretionary grant programs remain uncovered.","why":"IBAC names conduct and mismanagement in the use of public funds in contract management as a corruption-risk priority. VAGO has now quantified the downside on one large grant cohort, which makes the routine-programs gap harder to leave open.","severity":"Moderate to high, now with a measured loss figure attached.","scale":"Whole-of-government grant spending plus council grant programs.","breadth":"Cuts across government and non-government entities.","urgency":"Moderate. A current regulator priority alongside a cost-cutting drive that pressures controls.","question":"What controls exist across departments to detect and prevent grant favouritism, and are conflict-of-interest checks applied consistently to grants to non-government entities?","caution":"Scope around the COVID follow-up, which has just covered the largest recent grant cohort."},{"rank":20,"topic":"Disability services funding and the state-NDIS interface","sector":"Communities & families","agencies":"DFFH; state-funded disability programs","lanes":["Parliament"],"gap":"Not covered","changed":"","vago":"Only a justice-system sub-population report was found. No general disability services audit for 2022-2026 and nothing planned across three forward years.","why":"The mainstream disability service system, the state-NDIS interface and current service quality have no coverage. The only parliamentary signal was an unverified crossbench claim of a 14.6% funding reduction.","severity":"Moderate. Thin parliamentary signal over a genuine coverage gap.","scale":"Not established - the Victorian-funded remainder after NDIS is not quantified in this scan.","breadth":"DFFH plus the state-Commonwealth interface.","urgency":"Low to moderate.","question":"What does Victoria still fund directly in disability services, and how well does the state manage its interface with the NDIS?","caution":"A scoping question first: much of delivery sits with the Commonwealth, so the auditable unit is the Victorian-funded remainder. Settle that boundary before scoring."}],"plan":[{"title":"Administering Property Taxes","kind":"Performance audit","sector":"Public administration","status":"Outstanding"},{"title":"Delivering Public Sector ICT Projects","kind":"Performance audit","sector":"Public administration","status":"Outstanding"},{"title":"Educating Young People in Custody","kind":"Performance audit","sector":"Justice & regulation","status":"Outstanding"},{"title":"Emergency Mental Health Services","kind":"Performance audit","sector":"Communities & families","status":"Outstanding"},{"title":"Government Advertising and Communications","kind":"Performance audit","sector":"Public administration","status":"Tabled 20 Oct 2026"},{"title":"Improving Underperforming Schools","kind":"Performance audit","sector":"Communities & families","status":"Outstanding"},{"title":"Managing Developer Contributions","kind":"Performance audit","sector":"Environment & planning","status":"Outstanding"},{"title":"Managing Victoria's Firefighting Fleet","kind":"Performance audit","sector":"Justice & regulation","status":"Tabled 14 Oct 2026"},{"title":"Performance of Victoria's Health Services","kind":"Performance audit","sector":"Communities & families","status":"Outstanding"},{"title":"Preventing Youth Crime","kind":"Performance audit","sector":"Justice & regulation","status":"Tabled 23 Sep 2026"},{"title":"Prioritising and Allocating Social Housing","kind":"Performance audit","sector":"Communities & families","status":"Outstanding"},{"title":"Regulating Victoria's Threatened Species","kind":"Performance audit","sector":"Environment & planning","status":"Outstanding"},{"title":"Reliable Service Information for Public Transport Users","kind":"Performance audit","sector":"Transport & infrastructure","status":"Outstanding"},{"title":"Resilience of the Triple Zero Service","kind":"Performance audit","sector":"Justice & regulation","status":"Outstanding"},{"title":"Sustainability Reporting (Part 2)","kind":"Performance audit","sector":"Environment & planning","status":"Outstanding"},{"title":"Using Police Cells to Detain Prisoners","kind":"Performance audit","sector":"Justice & regulation","status":"Outstanding"},{"title":"VicRoads Joint Venture","kind":"Performance audit","sector":"Transport & infrastructure","status":"Outstanding"},{"title":"Administering Trust Accounts","kind":"Limited assurance review","sector":"Public administration","status":"Outstanding"},{"title":"Fees and Charges for Government Services","kind":"Limited assurance review","sector":"Public administration","status":"Outstanding"},{"title":"Follow-up: Management of Spending in Response to COVID-19","kind":"Limited assurance review","sector":"Public administration","status":"Tabled 22 Oct 2026"},{"title":"Public Lottery Licence Extension","kind":"Limited assurance review","sector":"Public administration","status":"Tabled 16 Sep 2026"},{"title":"Responses to Performance Engagement Recommendations: Annual Status Update","kind":"Limited assurance review","sector":"Public administration","status":"Outstanding"},{"title":"Auditor-General's Report on the Annual Financial Report of the State of Victoria: 2025-26","kind":"Financial audit","sector":"Public administration","status":"Tabled 30 Oct 2026"},{"title":"Results of 2025-26 Audits: Local Government","kind":"Financial audit","sector":"Public administration","status":"Outstanding"},{"title":"Results of 2026 Audits: TAFEs and Universities","kind":"Financial audit","sector":"Communities & families","status":"Outstanding"}],"limitations":[{"title":"Coverage of the final sittings is materially thinner than February to July","text":"The February-to-July record was close to a census. The August-September extension was not. The Council scan text-searched roughly 165 o
