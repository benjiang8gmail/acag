f about 1,700 printed pages for that span, and seven of fourteen Council sitting days could not be opened at all. The Assembly scan read seven of thirteen days in part. Treat every 'nothing found' in August and September as 'nothing in the portion read', not as absence."},{"title":"The sitting calendar was wrong and had to be corrected","text":"The published 2026 calendar listed nine sitting days after 4 August. Parliament actually sat fourteen in the Council and thirteen in the Assembly, including an entire unscheduled week from 22 to 24 September and extra Fridays on 14 and 28 August. The final sitting day of the 60th Parliament was Thursday 24 September 2026."},{"title":"Page numbering changes between proof and final Hansard","text":"Proof editions restart page numbering at 1 each sitting day; final editions use continuous numbering across the year. Page references from the first half of this scan were taken from proof editions in some cases. For 24 September the confirmed offset is proof page plus 4,548."},{"title":"Two member statements were disproved on page-level checking","text":"A page-level check earlier in this scan found that two items logged as member statements do not exist: Bev McArthur did not speak to VAGO's local government audit results on 1 April, and Sonja Terpstra did not speak to Delivering School Upgrade Projects on 29 July. In both cases the report appeared only in a routine tabled-papers list. A pothole remark attributed to Terpstra on 30 July was also not in the cited transcript. All three were removed."},{"title":"One August statement is recorded as indexed only","text":"Wendy Lovell is listed in the 26 August item index as speaking to the Suburban Rail Loop report, but the item page could not be opened and the body was never read. Applying the same rule that caught the earlier errors, she is not recorded as having spoken."},{"title":"One report reference is to an unnamed 'auditor'","text":"On 11 August David Davis referred only to 'the auditor' with no body named. The December timing and content match VAGO's renewable transition report, but the attribution is an inference."},{"title":"A missed report has been added retrospectively","text":"Responses to Performance Engagement Recommendations: Annual Status Update 2026, tabled 13 May 2026, was absent from the original scan and has been added. Its finding that 334 recommendations remain unresolved across 55 agencies is directly relevant to the recommendation-implementation theme."},{"title":"VAGO's own appropriation remains unconfirmed","text":"Appendix D of the Annual Plan 2026-27 shows a parliamentary-reports output cost target of $21.4m for 2026-27 against $20.6m expected for 2025-26. These are close to but not identical with the $20.419m and $21.046m figures quoted in the Council on 16 June, and the discrepancy is unresolved."},{"title":"Some evidence remains single-sourced","text":"The Department of Education breach scale, the $15bn CFMEU cost figure, and several figures quoted in the final sittings rest on one source each and are flagged individually. Verify before external publication."},{"title":"Budget Paper 3 performance targets were never swept","text":"The Lane 1 sweep of BP3 output performance tables was not completed for most sectors. This remains the single biggest evidence gap and the priority for any follow-up."}],"themes":[{"name":"Bushfire preparedness and fuel management","sector":"Environment & planning","cover":"Fully covered","vago":"Follow-up: Reducing Bushfire Risks, tabled 10 June 2026. Directly on point.","note":"A strong bipartisan signal from February through July - a unanimous document-production motion in April and a government backbencher criticising his own side's recovery funding in May. It then went quiet in the final sittings, with VAGO's report already on the table."},{"name":"Police resourcing and frontline capacity","sector":"Justice & regulation","cover":"Partially covered","vago":"Two workforce and staff-allocation audits exist but neither date could be confirmed and no refresh was found.","note":"The most persistently raised service theme in the whole scan - five separate sitting weeks across eight months, always from non-government members. The specifics hardened over time: 1,500 roster vacancies in March became 1,400 vacancies and front counters closing from 4 October by September."},{"name":"Integrity agency funding, including VAGO's own","sector":"Public administration","cover":"Not applicable","vago":"This concerns VAGO itself rather than an audit topic.","note":"Raised by the Greens and the Liberals in question time and again in the appropriation debate, and never substantively answered. By September the Parliament had legislated budget-request transparency for IBAC alone, leaving VAGO outside the reform it had jointly called for."},{"name":"State debt, budget transparency and fiscal reporting","sector":"Public administration","cover":"Partially covered","vago":"The annual financial audit covers the numbers; no audit examines debt strategy, and the Treasurer's Advance work dates from November 2020.","note":"Present in almost every budget debate and three PAEC hearings. VAGO's own October financial audit closed the period by recording a first operating surplus in seven years alongside gross debt of $203.3bn, and concluding the fiscal strategy remains focused on short-term outcomes."},{"name":"Suburban Rail Loop cost and transparency","sector":"Transport & infrastructure","cover":"Recently reported","vago":"Delivering the Suburban Rail Loop, tabled 26 August 2026.","note":"The clearest case of audit impact in the period. Pressed at PAEC in May against the minister's 'on time and on budget' line, audited in August, and within two days the government had cut its own cost estimate, paused contracts and promised to abolish the fare levy the report exposed."},{"name":"Major project cost and schedule performance","sector":"Transport & infrastructure","cover":"Recently reported","vago":"Major Projects Performance Reporting 2025 (4 March) covers cost and schedule transparency, not probity.","note":"VAGO's March report set the terms: $11.31bn in cost increases across 89 projects. The probity dimension passed to a Royal Commission in August."},{"name":"Road maintenance and network condition","sector":"Transport & infrastructure","cover":"Recently reported","vago":"Maintaining State Roads, tabled 9 September 2026, closing a nine-year gap since the 2017 audit.","note":"A textbook case of a parliamentary signal being vindicated. Pressed at PAEC in May with patching volumes down from 566,000 to 70,000 square metres, raised repeatedly through August, then audited in September: 48% of the network in poor or very poor condition, up from 39% in 2021."},{"name":"Prison capacity, remand and corrections","sector":"Justice & regulation","cover":"Not covered","vago":"Prison Capacity Planning (2012) is 14 years old. Nothing addresses the post-2023 remand surge.","note":"Budget debate put $229m more into prison beds on top of $727m the year before. A July retrospective validation bill signalled a legal defect in clinical staff authorisation going back to 2024."},{"name":"Social housing waitlist and homelessness","sector":"Communities & families","cover":"Partially covered","vago":"Prioritising and Allocating Social Housing remains an uncommenced 2026-27 plan item. Victoria's Homelessness Response dates from 2020.","note":"Concentrated in the 30 July budget debate, where crossbench and government members put competing figures on the same waitlist within minutes of each other."},{"name":"Family violence system capacity","sector":"Communities & families","cover":"Partially covered","vago":"The Orange Door follow-up is in progress but not tabled. The last police first-response audit dates from 2009.","note":"Raised with specific service-failure figures - 18.6 month waits for priority housing, 40% of refuge-seekers unserved - which corroborate evidence given separately at PAEC."},{"name":"Child protection and out-of-home care","sector":"Communities & families","cover":"Recently reported","vago":"Out-of-Home Care Services tabled 3 June 2026. A broader child protection audit is in progress.","note":"VAGO's report landed mid-period and was spoken to by two Nationals members on the day it was tabled."},{"name":"School infrastructure and condition","sector":"Communities & families","cover":"Recently reported","vago":"Delivering School Upgrade Projects, tabled 17 June 2026.","note":"Tabled 17 June, listed among tabled papers on 29 July without anyone speaking to it, then used accurately by the Nationals on 30 July."},{"name":"Local government governance and intervention","sector":"Public administration","cover":"Not covered","vago":"Sector financial audits exist but nothing examines the monitor-intervention model or the state's early-warning mechanisms.","note":"Low parliamentary volume against a high underlying signal - five councils under intervention simultaneously. A Stability of Councils Bill was still moving through the Council in the final sittings, with members citing IBAC's Operation Sandon and the Whittlesea inquiry."},{"name":"Energy transition and offshore wind delivery","sector":"Environment & planning","cover":"Recently reported","vago":"Managing the Transition to Renewable Energy, tabled 3 December 2025.","note":"The only theme where a minister publicly disputed VAGO's accuracy - and then went on being quoted against her. The December report was cited in May at PAEC, and again by two members in August, including the risk rating that a disorderly transition is now almost certain."},{"name":"Planning controls and housing supply","sector":"Environment & planning","cover":"Partially covered","vago":"Fishermans Bend (2025) covers one precinct; drainage in growth areas (June 2026) covers enabling infrastructure. No statewide audit of permit processing.","note":"Raised through specific local objections to height limits and infrastructure sequencing rather than as a system question."},{"name":"Building defects and construction regulation","sector":"Environment & planning","cover":"Partially covered","vago":"Domestic Building Insurance (May 2025) covers claims handling and permit verification, not the reformed regulator.","note":"Debated on 2 April with a figure of over $675 million a year in building defect costs and a finding that half of assessed buildings had non-cladding defects."},{"name":"Waste, recycling and waste-to-energy regulation","sector":"Environment & planning","cover":"Not covered","vago":"Waste reports from 2019 and 2021 both predate the November 2023 container deposit scheme. Nothing planned on either waste stream.","note":"The single most important theme in this scan for VAGO's own programming: on 25 August a parliamentary committee formally recommended that the Auditor-General review the waste-to-energy regulatory framework. That is the only request for new VAGO work in eight months."},{"name":"Forestry transition grants administration","sector":"Environment & planning","cover":"Recently reported","vago":"Supporting the Transition from Native Timber Harvesting, tabled 1 April 2026.","note":"A demonstration of the recommendation loop working: VAGO found no evidence that work had been carried out for $1.35m of rehabilitation grants, PAEC put it to the department, and the department described its remediation."},{"name":"Emergency services funding and fleet","sector":"Justice & regulation","cover":"Recently reported","vago":"Managing Victoria's Firefighting Fleet, tabled 14 October 2026 - after Parliament rose, so never debated.","note":"The signal built steadily - 290 grounded G-Wagons in April, 35-year-old CFA vehicles in July, a 22-year-old Warrandyte pumper and a record 62 FRV trucks offline by September - and VAGO's October audit confirmed all of it. The fund that pays for the fleet remains unaudited."},{"name":"Legal assistance and court access","sector":"Justice & regulation","cover":"Partially covered","vago":"Access to Legal Aid (2014) is twelve years old and predates bail reform and post-COVID court backlogs.","note":"A single crossbench intervention in the July budget debate, but a pointed one: two clients turned away for every one a community legal centre helps."},{"name":"Gambling regulation and harm reform","sector":"Justice & regulation","cover":"Not covered","vago":"Reducing the Harm Caused by Gambling (2021) was confirmed by direct check not to address carded play or pre-commitment.","note":"Mandatory carded play commenced 1 December 2025 and Parliament never examined it. What it did examine, in August, was that PAEC's follow-up recommendations on three earlier VAGO gambling reports remain outstanding three years on - raised by a government backbencher."},{"name":"Public lottery licence and gaming revenue","sector":"Public administration","cover":"Recently reported","vago":"Public Lottery Licence Extension, a limited assurance review tabled 16 September 2026.","note":"Anticipated by the Premier on budget day and welcomed by the responsible minister at PAEC. VAGO found nothing to suggest the approach did not seek to optimise value, but noted cost assumptions were not fully cross-checked and transparency was limited."},{"name":"Free TAFE and skills delivery","sector":"Communities & families","cover":"Recently reported","vago":"Free TAFE, tabled 13 May 2026.","note":"Notable for a government member citing the Premier's media-release figures rather than the report's own, and omitting its central cost finding."},{"name":"myki modernisation and ticketing","sector":"Transport & infrastructure","cover":"Recently reported","vago":"Modernising Myki, tabled 18 March 2026.","note":"Also surfaced at PAEC through questioning about legal action to prevent release of 16 documents relating to the ticketing contract."},{"name":"Mental health service access","sector":"Communities & families","cover":"Not covered","vago":"The most recent relevant reports date from 2019. Emergency Mental Health Services is an uncommenced plan item scoped to emergency department access only.","note":"Present as investment announcements rather than scrutiny of whether the Royal Commission reform programme is delivering."},{"name":"Ambulance and hospital performance","sector":"Communities & families","cover":"Partially covered","vago":"Access to Emergency Healthcare (2024) covers handover. Ambulance response times have not been dedicated-audited since 2010.","note":"Thin in chamber debate relative to the data for most of the period, then sharper in the final sittings: a category 1 patient waiting 70 days, 150 Mildura referrals left unprocessed for 16 months, and around 65 violent incidents a day reported in hospitals."},{"name":"Data centres and digital infrastructure planning","sector":"Environment & planning","cover":"Not covered","vago":"No VAGO report and nothing in the forward plan. Delivering Public Sector ICT Projects is a plan item but covers government's own projects, not private data centre siting.","note":"An emerging theme that barely existed before August and then appeared in almost every sitting week - members statements, questions, petitions, adjournments, a production-of-documents motion and a moratorium bill. It is the fastest-growing signal in the scan."},{"name":"Early childhood and kindergarten rollout","sector":"Communities & families","cover":"Not covered","vago":"No coverage, and absent from the 2026-27, 2027-28 and 2028-29 plan lists.","note":"Recurring as a ministerial statement heading through the final sittings. In September the government put a testable claim on the record: three-year-old kinder participation moving from a little over half of eligible children to over 90 per cent."}],"signals":[{"date":"2026-02-03","theme":"Bushfire preparedness and fuel management","forum":"Council","speaker":"Jaclyn Symes","party":"Labor","relevance":"Medium","quote":"This is a journey that government understands is lengthy, and we will continue to be with those in their recovery.","gloss":"Treasurer on bushfire recovery, alongside reported relief and recovery funding shared with the Commonwealth.","url":"https://www.parliament.vic.gov.au/parliamentary-activity/hansard/hansard-details/HANSARD-974425065-33887"},{"date":"2026-02-04","theme":"Integrity agency funding, including VAGO's own","forum":"Council","speaker":"Bev McArthur","party":"Liberal","relevance":"High","quote":"The independent Auditor-General's office felt compelled to publicly correct the Premier.","gloss":"On the CFA annual report dispute - VAGO publicly rebutted the suggestion it caused the delay.","url":"https://www.parliament.vic.gov.au/498ebf/globalassets/hansard-daily-pdfs/hansard-974425065-34052/hansard-974425065-34052.pdf"},{"date":"2026-02-04","theme":"Police resourcing and frontline capacity","forum":"Assembly","speaker":"Jess Wilson","party":"Liberal","relevance":"High","quote":"Productivity Commission data shows Victoria is the only mainland state with decreased real police funding, down 3.7 per cent since 2021.","gloss":"Could not be verified against primary Productivity Commission data - treat as an attributed claim.","url":"https://www.parliament.vic.gov.au/parliamentary-activity/hansard/hansard-details/HANSARD-2145855009-34144"},{"date":"2026-02-04","theme":"Police resourcing and frontline capacity","forum":"Assembly","speaker":"Jacinta Allan","party":"Labor","relevance":"Medium","quote":"Victoria has the largest police force of any state or territory because we back the front line.","gloss":"The Premier's counter to the funding-decline claim.","url":"https://www.parliament.vic.gov.au/parliamentary-activity/hansard/hansard-details/HANSARD-2145855009-34144"},{"date":"2026-02-19","theme":"Mental health service access","forum":"Assembly","speaker":"Anthony Carbines","party":"Labor","relevance":"Medium","quote":"It is a voluntary, referral-based centre and it supports young peopl ing what she meant.","url":"https://www.parliament.vic.gov.au/49bd79/contentassets/24db3e54310b4dc3a541af9692838175/paec-2026-27-budget-estimates-18-may-energy-and-resources.pdf"},{"date":"2026-05-19","theme":"Public lottery licence and gaming revenue","forum":"PAEC","speaker":"Enver Erdogan","party":"Labor","relevance":"High","quote":"I welcome the Auditor-General looking at these matters. I think with a transaction of this nature, being so large, it is important they do their job.","gloss":"Answering questioning about Lottery Corporation donations during negotiation of the extension.","url":"https://www.parliament.vic.gov.au/49bfa0/contentassets/a25ff1c686394ee3bd473f9f6849481b/paec-2026-27-budget-estimates-19-may-casino-gaming-and-liquor-regulation.pdf"},{"date":"2026-05-20","theme":"Suburban Rail Loop cost and transparency","forum":"PAEC","speaker":"Richard Riordan","party":"Nationals","relevance":"High","quote":"Theirs was 118 kilometre long; ours is 26 kilometres. It cost the English $300.5 million per kilometre; it is costing us $1.3 billion per kilometre.","gloss":"A per-kilometre comparison used to press on cost estimation methodology, three months before VAGO audited it.","url":"https://www.parliament.vic.gov.au/49bb84/contentassets/8fb993d65658416cbfdd92d9dd03df8c/paec-2026-27-budget-estimates-20-suburban-rail-loop.pdf"},{"date":"2026-05-20","theme":"Suburban Rail Loop cost and transparency","forum":"PAEC","speaker":"Nick Staikos","party":"Labor","relevance":"High","quote":"The Suburban Rail Loop East is on time and on budget.","gloss":"Given against sustained questioning about why no total estimated investment is published. VAGO's August audit found the project more likely than not to exceed its disclosed cost.","url":"https://www.parliament.vic.gov.au/49bb84/contentassets/8fb993d65658416cbfdd92d9dd03df8c/paec-2026-27-budget-estimates-20-suburban-rail-loop.pdf"},{"date":"2026-05-20","theme":"Road maintenance and network condition","forum":"PAEC","speaker /hansard/hansard-details/HANSARD-974425065-36093"},{"date":"2026-07-30","theme":"Child protection and out-of-home care","forum":"Council","speaker":"Anasina Gray-Barberio","party":"Greens","relevance":"Medium","quote":"Aboriginal and Torres Strait Islander children are overrepresented, with prevention programs severely underfunded.","gloss":"Echoes VAGO's own June finding on higher sibling-separation rates for Aboriginal children in out-of-home care.","url":"https://www.parliament.vic.gov.au/parliamentary-activity/hansard/hansard-details/HANSARD-974425065-36093"},{"date":"2026-07-30","theme":"Ambulance and hospital performance","forum":"Council","speaker":"Ryan Batchelor","party":"Labor","relevance":"Medium","quote":"Funding an additional 250 graduate nurses and delivering faster surgery.","gloss":"The only chamber mention of hospital performance in the first six months - notably thin against sustained target misses.","url":"https://www.parliament.vic.gov.au/parliamentary-activity/hansard/hansard-details/HANSARD-974425065-36093"},{"date":"2026-07-30","theme":"Prison capacity, remand and corrections","forum":"Council","speaker":"Lizzie Blandthorn / Melina Bath","party":"Labor / Nationals","relevance":"High","quote":"Corrections Amendment Bill 2026 retrospectively validating Advanced Practitioners' actions in prisons for 29 April 2024 to 18 May 2026.","gloss":"A two-year retrospective validation points to a governance defect in clinical staff authorisation.","url":"https://www.parliament.vic.gov.au/parliamentary-activity/hansard/hansard-details/HANSARD-974425065-36095"},{"date":"2026-08-11","theme":"Energy transition and offshore wind delivery","forum":"Assembly","speaker":"Martin Cameron","party":"Nationals","relevance":"High","quote":"the planned closure of Yallourn power station in 2028, the Victorian Auditor-General has stated the risk of a disorderly energy transition is now almost certain.","gloss":"Matches VAGO's own rating of 'severe/almost certain'. The Speaker required him to rephrase; no answer is printed.","url":"https://www.parliament.vic.gov.au/4a72b6/globalassets/hansard-daily-pdfs/hansard-2145855009-36586/hansard-2145855009-36586.pdf"},{"date":"2026-08-11","theme":"Energy transition and offshore wind delivery","forum":"Council","speaker":"David Davis","party":"Liberal","relevance":"Medium","quote":"The auditor came out very clearly in December last year and said the government's targets will not be met. That is what the auditor said.","gloss":"FLAG: Davis says only 'the auditor', with no body named. The December timing and content match VAGO's renewable transition report, but this is an inference.","url":"https://www.parliament.vic.gov.au/4a82ff/globalassets/hansard-daily-pdfs/hansard-974425065-36194/hansard-974425065-36194.pdf"},{"date":"2026-08-11","theme":"Police resourcing and frontline capacity","forum":"Council","speaker":"Wendy Lovell","party":"Liberal","relevance":"Medium","quote":"Kyneton police station is now closed two days a week and will shut at 4:30 pm on the days that it is open.","gloss":"A specific, checkable instance of the station-closure pattern claimed statewide in March.","url":"https://www.parliament.vic.gov.au/4a82ff/globalassets/hansard-daily-pdfs/hansard-974425065-36194/hansard-974425065-36194.pdf"},{"date":"2026-08-11","theme":"Ambulance and hospital performance","forum":"Council","speaker":"Georgie Crozier","party":"Liberal","relevance":"High","quote":"It was not an isolated incident: around 65 violent incidents are reported in our hospitals every day.","gloss":"Raised immediately after a ministerial statement citing $47 million invested in occupational violence initiatives since 2015 - the two framings sat side by side in the same sitting.","url":"https://www.parliament.vic.gov.au/4a82ff/globalassets/hansard-daily-pdfs/hansard-974425065-36194/hansard-974425065-36194.pdf"},{"date":"2026-08-11","theme":"Data centres and digital infrastructure planning","forum":"Council","speaker":"Anasina Gray-Barberio","party":"Greens","relevance":"Medium","quote":"Victoria has around 54 data centres at the moment.","gloss":"A minister's figure, cited back. The first of many data centre items; the theme recurred in almost every subsequent sitting week.","url":"https://www.parliament.vic.gov.au/4a82ff/globalassets/hansard-daily-pdfs/hansard-974425065-36194/hansard-974425065-36194.pdf"},{"date":"2026-08-11","theme":"Road maintenance and network condition","forum":"Council","speaker":"Melina Bath","party":"Nationals","relevance":"Medium","quote":"The M1 at Traralgon East, which has only been open for 18 months, is disintegrating and riddled with potholes.","gloss":"A new-build asset deteriorating inside two years - an asset-quality point distinct from the maintenance-funding one.","url":"https://www.parliament.vic.gov.au/4a82ff/globalassets/hansard-daily-pdfs/hansard-974425065-36194/hansard-974425065-36194.pdf"},{"date":"2026-08-12","theme":"Gambling regulation and harm reform","forum":"Assembly","speaker":"Mathew Hilakari","party":"Labor","relevance":"High","quote":"These are recommendations that are outstanding from three years ago.","gloss":"A government backbencher pressing on unimplemented recommendations from PAEC's follow-up of three VAGO gambling and liquor reports - the community benefit test and the pokies tax discount.","url":"https://www.parliament.vic.gov.au/4a85ab/globalassets/hansard-daily-pdfs/hansard-2145855009-36692/hansard-2145855009-36692.pdf"},{"date":"2026-08-12","theme":"Road maintenance and network condition","forum":"Assembly","speaker":"Richard Riordan","party":"Nationals","relevance":"High","quote":"The Department of Transport and Planning's justifications for modifying performance measure targets relating to scheduled works do not provide the public or Parliament with an adequate understanding.","gloss":"Reading a PAEC committee comment. VAGO reached the same conclusion a month later, finding the department's targets say little about actual road condition.","url":"https://www.parliament.vic.gov.au/4a85ab/globalassets/hansard-daily-pdfs/hansard-2145855009-36692/hansard-2145855009-36692.pdf"},{"date":"2026-08-25","theme":"Waste, recycling and waste-to-energy regulation","forum":"Council","speaker":"David Ettershank","party":"Legalise Cannabis","relevance":"High","quote":"There are some positive recommendations, including the monitoring of emissions on a continuous basis and that there be an investigation by the Auditor-General to undertake a review of the regulatory framework.","gloss":"FLAG - SIGNIFICANT: the only call for new Auditor-General work in the entire scan. He adds that a proposal for a moratorium pending an Auditor-General finding was rejected.","url":"https://www.parliament.vic.gov.au/4a7794/globalassets/hansard-daily-pdfs/hansard-974425065-36500/hansard-974425065-36500.pdf"},{"date":"2026-08-25","theme":"Integrity agency funding, including VAGO's own","forum":"Council","speaker":"Michael Galea","party":"Labor","relevance":"Medium","quote":"ongoing financial and performance audits of the Auditor-General's office... the recommendation to reappoint the Auditor-General for a second term","gloss":"A Labor member summarising PAEC's term, including its statutory oversight of VAGO. Single-extraction fragments; surrounding sentences not captured.","url":"https://www.parliament.vic.gov.au/4a7794/globalassets/hansard-daily-pdfs/hansard-974425065-36500/hansard-974425065-36500.pdf"},{"date":"2026-08-25","theme":"Road maintenance and network condition","forum":"Assembly","speaker":"Matthew Guy","party":"Liberal","relevance":"High","quote":"Road maintenance has been cut under this government... more than a dozen cars were damaged at night from a pothole that developed within 12 hours.","gloss":"Frames road maintenance as the opportunity cost of the Suburban Rail Loop - a connection VAGO's two September audits made factually rather than politically.","url":"https://www.parliament.vic.gov.au/4aa176/globalassets/hansard-daily-pdfs/hansard-2145855009-36881/hansard-2145855009-36881.pdf"},{"date":"2026-08-25","theme":"Ambulance and hospital performance","forum":"Assembly","speaker":"Tim Bull","party":"Nationals","relevance":"Medium","quote":"The website says that payments will be made five days after approval. We have got outstanding claims going back to May.","gloss":"On the patient transport assistance scheme. He notes he has raised it a number of times.","url":"https://www.parliament.vic.gov.au/4aa176/globalassets/hansard-daily-pdfs/hansard-2145855009-36881/hansard-2145855009-36881.pdf"},{"date":"2026-08-26","theme":"Suburban Rail Loop cost and transparency","forum":"Council","speaker":"Gaelle Broad","party":"Nationals","relevance":"High","quote":"Reading it, they are just extraordinary, some of the revelations in this report.","gloss":"Spoke on the day the report was tabled. Her figures - $34.5bn disclosed cost, $6bn of an expected $11.5bn Commonwealth contribution - match VAGO's.","url":"https://www.parliament.vic.gov.au/parliamentary-activity/hansard/hansard-details/HANSARD-974425065-36567"},{"date":"2026-08-26","theme":"Suburban Rail Loop cost and transparency","forum":"Council","speaker":"Richard Welch","party":"Liberal","relevance":"High","quote":"This is a bombshell report, but it is not just a bomb; it is a series of bombshells.","gloss":"Refers to 'the briefing we had this afternoon', confirming VAGO briefed members the same day. His claim that VAGO 'revealed it has cost over $1.4 billion' is his characterisation of a deferral finding, not a VAGO figure.","url":"https://www.parliament.vic.gov.au/parliamentary-activity/hansard/hansard-details/HANSARD-974425065-36570"},{"date":"2026-09-08","theme":"Emergency services funding and fleet","forum":"Council","speaker":"Aiv Puglielli","party":"Greens","relevance":"High","quote":"the ABC has revealed that a record 62 Fire Rescue Victoria trucks were offline at the end of August.","gloss":"Five weeks before VAGO found no fire authority completes all scheduled maintenance and DEECA had removed 54.4% of its fleet from service because of cracking.","url":"https://www.parliament.vic.gov.au/4a7370/globalassets/hansard-daily-pdfs/hansard-974425065-36842/hansard-974425065-36842.pdf"},{"date":"2026-09-08","theme":"Police resourcing and frontline capacity","forum":"Council","speaker":"Georgie Crozier","party":"Liberal","relevance":"High","quote":"a number of stations will close their front counters on 4 October.","gloss":"A dated, checkable commitment - the sharpest form the station-closure claim took all year.","url":"https://www.parliament.vic.gov.au/4a7370/globalassets/hansard-daily-pdfs/hansard-974425065-36842/hansard-974425065-36842.pdf"},{"date":"2026-09-08","theme":"Ambulance and hospital performance","forum":"Council","speaker":"Georgie Crozier","party":"Liberal","relevance":"High","quote":"She was categorised at the time as an urgent category 1 patient, meaning she should be seen within 30 days... She finally had a telehealth consult on 2 September, some 70 days after her initial referral.","gloss":"A specific case more than twice the clinical standard, raised in the second-last sitting week.","url":"https://www.parliament.vic.gov.au/4a7370/globalassets/hansard-daily-pdfs/hansard-974425065-36842/hansard-974425065-36842.pdf"},{"date":"2026-09-08","theme":"Data centres and digital infrastructure planning","forum":"Council","speaker":"David Ettershank","party":"Legalise Cannabis","relevance":"Medium","quote":"a quarter of a million tonnes of e-waste generated over the next five years","gloss":"Links the data centre theme to the waste theme - the same member who moved the waste-to-energy audit referral.","url":"https://www.parliament.vic.gov.au/4a7370/globalassets/hansard-daily-pdfs/hansard-974425065-36842/hansard-974425065-36842.pdf"},{"date":"2026-09-09","theme":"Road maintenance and network condition","forum":"Assembly","speaker":"Annabelle Cleeland","party":"Nationals","relevance":"High","quote":"Concerningly, 48 per cent of Victoria's state roads are in poor or very poor condition.","gloss":"Using the VAGO report tabled that morning. The 48% figure checks out; a separate claim that conditions 'have gone up nearly 40 per cent' misstates the rate, and an 87 per cent figure she cites is from budget estimates, not VAGO.","url":"https://www.parliament.vic.gov.au/4a7fdd/globalassets/hansard-daily-pdfs/hansard-2145855009-37291/hansard-2145855009-37291.pdf"},{"date":"2026-09-09","theme":"Emergency services funding and fleet","forum":"Assembly","speaker":"Nicole Werner","party":"Liberal","relevance":"Medium","quote":"Warrandyte CFA's pumper is now 22 years old.","gloss":"A third fleet-age data point in six months, from a third member.","url":"https://www.parliament.vic.gov.au/4a7fdd/globalassets/hansard-daily-pdfs/hansard-2145855009-37291/hansard-2145855009-37291.pdf"},{"date":"2026-09-22","theme":"Police resourcing and frontline capacity","forum":"Council","speaker":"Gaelle Broad","party":"Nationals","relevance":"High","quote":"There are currently 1400 vacancies on Victoria Police rosters and over 40 police stations, including Castlemaine and Kyneton, on reduced opening hours.","gloss":"Six months after the same claim was made in the Assembly at 1,500 vacancies, with the station figure unchanged.","url":"https://www.parliament.vic.gov.au/4a7fcf/globalassets/hansard-daily-pdfs/hansard-974425065-37098/hansard-974425065-37098.pdf"},{"date":"2026-09-22","theme":"Ambulance and hospital performance","forum":"Council","speaker":"Georgie Crozier","party":"Liberal","relevance":"High","quote":"the referrals of 150 Victorians from their GPs to see a specialist in Mildura were left in a box and forgotten for 16 months.","gloss":"The minister replied that the hospital's board and executive are working with the department on a comprehensive performance improvement plan - an administrative failure conceded on the record.","url":"https://www.parliament.vic.gov.au/4a7fcf/globalassets/hansard-daily-pdfs/hansard-974425065-37098/hansard-974425065-37098.pdf"},{"date":"2026-09-22","theme":"Energy transition and offshore wind delivery","forum":"Council","speaker":"Bev McArthur","party":"Liberal","relevance":"High","quote":"described the Western Renewables Link as a A$4 billion project... your government responded in writing with only a $1.53 billion construction estimate","gloss":"A cost-disclosure discrepancy on a transmission project, pressed in the final sitting week. The minister said no review of the project exists, only a cost assessment.","url":"https://www.parliament.vic.gov.au/4a7fcf/globalassets/hansard-daily-pdfs/hansard-974425065-37098/hansard-974425065-37098.pdf"},{"date":"2026-09-22","theme":"Early childhood and kindergarten rollout","forum":"Council","speaker":"Lizzie Blandthorn","party":"Labor","relevance":"Medium","quote":"a little over a half of eligible children were accessing three-year-old kinder... Today the participation rate is over 90 per cent.","gloss":"A testable government claim on a programme VAGO has never audited and does not plan to.","url":"https://www.parliament.vic.gov.au/4a7fcf/globalassets/hansard-daily-pdfs/hansard-974425065-37098/hansard-974425065-37098.pdf"},{"date":"2026-09-24","theme":"Suburban Rail Loop cost and transparency","forum":"Council","speaker":"Renee Heath","party":"Liberal","relevance":"High","quote":"Last month the Auditor-General's report showed that there had been a secret tax on public transport.","gloss":"On the final sitting day of the 60th Parliament. Refers to the undisclosed fare levy VAGO exposed, which the government then said it would abolish.","url":"https://www.parliament.vic.gov.au/4a8a1a/globalassets/hansard-daily-pdfs/hansard-974425065-37279/hansard-974425065-37279.pdf"},{"date":"2026-09-24","theme":"Road maintenance and network condition","forum":"Council","speaker":"Melina Bath","party":"Nationals","relevance":"Medium","quote":"Our roads are in a decrepit state; they are like goat tracks.","gloss":"On the final sitting day, two weeks after VAGO put a number on it.","url":"https://www.parliament.vic.gov.au/4a8a1a/globalassets/hansard-daily-pdfs/hansard-974425065-37279/hansard-974425065-37279.pdf"}],"blindSpots":[{"theme":"Cyber security and data breach response","sector":"Public administration","rank":3,"why":"A breach of a Department of Education database exposed personal data for hundreds of thousands of Victorian government school students in January 2026, and OVIC opened a formal investigation on 22 January. Across eight months and two houses, not one chamber mention was found.","vago":"Last cyber-specific VAGO report was August 2023. Nothing in the 2026-27 plan."},{"theme":"Silver Review public sector efficiency reform","sector":"Public administration","rank":4,"why":"A whole-of-government restructure with a $4 billion savings target, 29 entities merged or abolished and around 1,000 positions in scope - running through the entire scan period without a single substantive parliamentary debate located. By September the government had added Infrastructure Victoria and Economic Growth Victoria to the closure list.","vago":"No VAGO report and nothing in the 2026-27, 2027-28 or 2028-29 plans."},{"theme":"Mandatory carded play","sector":"Justice & regulation","rank":10,"why":"Mandatory carded play on all electronic gaming machines commenced 1 December 2025. The scan window covers the first ten months of live enforcement and Parliament never examined it once. What it did raise, in August, was that recommendations from three earlier VAGO gambling reports remain unimplemented three years on.","vago":"The 2021 gambling harm report was confirmed by direct check not to address carded play or pre-commitment."},{"theme":"Victoria Police complaints and IBAC recommendation implementation","sector":"Justice & regulation","rank":11,"why":"IBAC made 51 recommendations to Victoria Police in 2025, triple the previous year, with 57 still unimplemented at 31 December. Police resourcing was debated in five separate sitting weeks; complaint handling was never raised.","vago":"No VAGO report on this was found at all."},{"theme":"Mental health royal commission reform delivery","sector":"Communities & families","rank":7,"why":"The largest social policy reform in the state, funded by a dedicated levy, half way through its ten-year implementation. Parliament discussed new facilities and investment announcements but never whether the reform programme is delivering.","vago":"The most recent relevant reports date from 2019, two years before the Royal Commission reported."},{"theme":"Reports tabled after the Parliament rose","sector":"Public administration","rank":null,"why":"Four VAGO reports were tabled between 14 and 30 October, after the final sitting day of 24 September: the firefighting fleet audit, the government advertising audit, the COVID-19 spending follow-up and the state's own annual financial report showing gross debt of $203.3bn. None can be debated by this Parliament, and the 61st will not sit until 2027.","vago":"All four are recent VAGO work. The gap is not coverage but the absence of any forum to receive it."}],"coverage":{"Bushfire preparedness and fuel management":{"did":[["Follow-up: Reducing Bushfire Risks","10 Jun 2026","https://www.audit.vic.gov.au/report/follow-reducing-bushfire-risks"]],"covers":"Fuel treatment effectiveness, statewide residual risk against the 70% target, strategic fuel breaks around Grampians National Park, and risk on private land.","open":"Firefighting capability and recovery funding - which is what members were actually raising either side of the report. The fleet half has since been answered by the October audit; recovery funding has not.","add":"Whether bushfire recovery funding is allocated consistently between events. A government backbencher described the Longwood response as 'a pittance' against the 2019 fires of comparable economic scale.","plan":["Managing Victoria's Firefighting Fleet - tabled 14 October 2026"],"stale":null},"Police resourcing and frontline capacity":{"did":[["Planning for a Capable Victoria Police Workforce","date unconfirmed","https://audit.vic.gov.au/report/planning-capable-victoria-police-workforce"],["The Effectiveness of Victoria Police's Staff Allocation","date unconfirmed","https://www.audit.vic.gov.au/report/effectiveness-victoria-polices-staff-allocation"]],"covers":"Workforce planning methodology and staff allocation. Both exist but neither date could be confirmed and no refresh was found.","open":"Everything current. Victoria Police missed almost every published target in 2024-25 while overrunning its $4,499.3m output cost by $110.1m, and no VAGO work tests why.","add":"Whether the workforce and rostering model matches demonstrated demand, and the economy and efficiency case for the 200-strong reservist scheme at $62m against accelerated recruitment or civilianisation.","plan":["Using Police Cells to Detain Prisoners (2026-27) - outstanding, and on custody not workforce"],"stale":"Neither existing report's date could be confirmed - treat currency as unknown."},"Integrity agency funding, including VAGO's own":{"did":[],"covers":"Not applicable. VAGO cannot audit its own appropriation.","open":"The question raised in Parliament sits with PAEC and the Parliament, not with VAGO's audit programme.","add":"Nothing auditable by VAGO. But the office has a direct institutional interest: the claim that it is 'already missing its own reporting timeline targets' went unrebutted, and the September annual report records 66.7% of recommendations implemented against an 80% target. The IBAC Amendment Act of 1 October now requires IBAC to publish its budget requests; no equivalent applies to VAGO.","plan":[],"stale":null},"State debt, budget transparency and fiscal reporting":{"did":[["Auditor-General's Report on the Annual Financial Report of the State of Victoria: 2025-26","30 Oct 2026","https://www.audit.vic.gov.au/report/auditor-generals-report-annual-financial-report-state-victoria-2025-26"],["Accessing Emergency Funding to Meet Urgent Claims (Treasurer's Advance)","24 Nov 2020","https://www.audit.vic.gov.au/report/accessing-emergency-funding-meet-urgent-claims"]],"covers":"The October financial audit gives a clear opinion and records the first general government operating surplus in seven years at $2.4bn, gross debt of $203.3bn, and a conclusion that the fiscal strategy remains focused on short-term outcomes. The 2020 report examined Treasurer's Advance approvals for 2019-20.","open":"The Treasurer's Advance findings - that two-thirds of advances had not followed proper process - are six years old and were being quoted in the Council in June as though current. DTF also declined to support one of the four October recommendations.","add":"A refresh of the Treasurer's Advance work. Members are using VAGO's 2020 findings as live ammunition, which raises the question whether the recommendations were ever implemented.","plan":["Administering Trust Accounts (2026-27) - outstanding","Fees and Charges for Government Services (2026-27) - outstanding"],"stale":"Treasurer's Advance: 6 years since the last look."},"Suburban Rail Loop cost and transparency":{"did":[["Delivering the Suburban Rail Loop","26 Aug 2026","https://www.audit.vic.gov.au/report/delivering-suburban-rail-loop"]],"covers":"Cost credibility, the $5.5bn funding gap at June 2026, an undisclosed 1% annual fare levy, owner's costs at about 18% against a 10.5-13% benchmark, and a sole-source adviser engagement that did not meet procurement tests.","open":"Little on the audit's own ground. What is open is follow-through: the Suburban Rail Loop Authority accepted none of the five recommendations directed to it, and is now to be merged into VIDA.","add":"A follow-up on recommendation implementation, complicated by the fact that the audited entity is being abolished. Where the recommendations land after the merger is itself worth establishing.","plan":["VicRoads Joint Venture (2026-27) - outstanding"],"stale":null},"Major project cost and schedule performance":{"did":[["Major Projects Performance Reporting 2025","4 Mar 2026","https://www.audit.vic.gov.au/report/major-projects-performance-reporting-2025"],["Assuring the Integrity of the Victorian Government's Procurement Activities","20 Jun 2024","https://www.audit.vic.gov.au/report/assuring-integrity-victorian-governments-procurement-activities"]],"covers":"Cost and schedule transparency across the portfolio - $11.31bn in cost increases across 89 projects - plus general procurement fraud and corruption controls.","open":"Probity on major project delivery. Neither report examines construction-sector integrity or the agency-side controls that should detect cost inflation through subcontracting.","add":"Very little, now. The Royal Commission's Letters Patent of 20 August name SRLA, VIDA, the Victorian School Building Authority and Development Victoria, and ask directly whether government and delivery authorities adequately discharged their oversight roles.","plan":["VicRoads Joint Venture (2026-27) - outstanding"],"stale":null},"Road maintenance and network condition":{"did":[["Maintaining State Roads","9 Sep 2026","https://www.audit.vic.gov.au/report/maintaining-state-roads"],["Maintaining State-Controlled Roadways","22 Jun 2017","https://audit.vic.gov.au/report/maintaining-state-controlled-roadways"]],"covers":"The September audit found about 48% of the network in poor or very poor condition in 2024, up from about 39% in 2021; a defects backlog rising from about 80,000 to more than 225,000; more than $3bn a year needed to maintain pavement condition; and that departmental targets say little about actual road condition. Six recommendations, all accepted.","open":"Little. The nine-year gap since 2017 is closed and the findings are two months old.","add":"Nothing pressing. Note the $352m announced on 30 August post-dates the audit, so whether it is applied to the worst-condition segments is a live follow-up question rather than a new audit.","plan":["VicRoads Joint Venture (2026-27) - the commercial arrangement, not road condition"],"stale":null},"Prison capacity, remand and corrections":{"did":[["Prison Capacity Planning","28 Nov 2012","https://www.audit.vic.gov.au/report/prison-capacity-planning"],["Ravenhall Correctional Centre Part 2","18 Feb 2026","https://www.audit.vic.gov.au/report/ravenhall-correctional-centre-rehabilitating-and-reintegrating-prisoners-part-2"],["Preventing youth crime","23 Sep 2026","https://www.audit.vic.gov.au/report/preventing-youth-crime"]],"covers":"Pre-2013 capacity dynamics; rehabilitation outcomes at one private prison; and the finding that the Youth Crime Prevention Program shows no evidence of reducing offending, with over two-thirds of matched participants reoffending within six months.","open":"Adult remand growth and the capacity expansion responding to it. The youth crime audit weakens the diversion side of the argument without touching the custodial side.","add":"Whether capacity expansion is sequenced against credible remand forecasts, and whether custodial recruitment keeps pace - beds opening understaffed is the failure mode. A July retrospective validation bill covering clinical staff authorisation back to April 2024 also suggests a control worth testing.","plan":["Using Police Cells to Detain Prisoners (2026-27) - outstanding","Educating Young People in Custody (2026-27) - outstanding"],"stale":"Prison capacity: 14 years since the last look."},"Social housing waitlist and homelessness":{"did":[["Victoria's Homelessness Response","17 Sep 2020","https://www.audit.vic.gov.au/report/victorias-homelessness-response"]],"covers":"Homelessness programme oversight and coordination, as at 2020.","open":"Allocation methodology and equity. VAGO's own plan rationale notes over 56,000 people on the Victorian Housing Register against roughly 5,110 allocations a year, but the audit that will examine it has not started.","add":"The planned audit covers the core question. The uncovered slice is the interaction with family violence priority housing - an 18.6-month wait sits at the join between two systems and can fall between two audits.","plan":["Prioritising and Allocating Social Housing (2026-27) - outstanding"],"stale":"Homelessness: 6 years since the last look."},"Family violence system capacity":{"did":[["The Orange Door: Follow-up","in progress","https://audit.vic.gov.au/report/orange-door-follow"],["Implementing Victoria Police's Code of Practice for the Investigation of Family Violence","10 Jun 2009","https://audit.vic.gov.au/report/implementing-victoria-polices-code-practice-investigation-family-violence"]],"covers":"The follow-up examines implementation of nine recommendations from the 2020 Support and Safety Hubs audit. The police first-response audit is from 2009.","open":"System-wide capacity. The follow-up is scoped to the hubs, not to refuge capacity or priority housing - which is where the two specific failure figures put on the record sit.","add":"Whether the service system has the capacity to meet the demand generated by the reforms it grew out of. Both figures were independently corroborated at PAEC, which is a strong evidence position.","plan":["The Orange Door: Follow-up - in progress"],"stale":"Police first response: 17 years."},"Child protection and out-of-home care":{"did":[["Out-of-Home Care Services","3 Jun 2026","https://www.audit.vic.gov.au/report/out-home-care-services"],["Victoria's Child Protection System","in progress","https://audit.vic.gov.au/report/victorias-child-protection-system"]],"covers":"Placement mix, kinship care, declining foster carer numbers, and higher sibling separation rates for Aboriginal and Torres Strait Islander children. The in-progress audit examines whether reforms enable the system to protect children from significant harm.","open":"Little once the in-progress audit reports. Among the best-covered themes in the scan.","add":"Nothing pressing. The crossbench point about prevention programmes being underfunded is adjacent to the in-progress audit's scope and worth checking against its final terms.","plan":["Victoria's Child Protection System - in progress"],"stale":null},"School infrastructure and condition":{"did":[["Delivering School Upgrade Projects","17 Jun 2026","https://www.audit.vic.gov.au/report/delivering-school-upgrade-projects"]],"covers":"Whether the Victorian School Building Authority's funding recommendations align with its own targeting strategy, cost estimate transparency, and progress against the 'no school in poor condition' target.","open":"Little on infrastructure. Note the VSBA is now also named as a delivery authority in the Royal Commission's Letters Patent, which puts its procurement under separate scrutiny.","add":"Nothing pressing on buildings. The planned underperforming-schools audit examines educational rather than physical performance.","plan":["Improving Underperforming Schools (2026-27) - outstanding"],"stale":null},"Local government governance and intervention":{"did":[["Financial Management of Local Councils","27 Aug 2025","https://www.audit.vic.gov.au/report/financial-management-local-councils"],["Results of 2024-25 Audits: Local Government","30 Mar 2026","https://www.audit.vic.gov.au/report/results-2024-25-audits-local-government"]],"covers":"Sector-wide financial sustainability under rate capping, and the annual audit results including that over half of councils missed draft report deadlines.","open":"Governance failure and the state's response to it. Both existing reports are financial. Neither examines the five councils under intervention or whether Local Government Victoria's early-warning mechanisms work.","add":"Whether the state detects council governance failure before ministerial intervention becomes necessary, and whether monitor appointments fix the underlying problems. Whittlesea is a repeat failure six years after a full dismissal. A Stability of Councils Bill was still before the Council in the final sittings, so there is a live reform to audit the implementation of.","plan":["Results of 2025-26 Audits: Local Government (2026-27) - outstanding, and financial"],"stale":null},"Energy transition and offshore wind delivery":{"did":[["Managing the Transition to Renewable Energy","3 Dec 2025","https://www.audit.vic.gov.au/report/managing-transition-renewable-energy"]],"covers":"Progress against the 2025 renewable target (met), the 2 GW offshore wind target for 2032 (not achievable, slipping to at least late 2033), port and auction delays, and a firm-energy gap after Yallourn of 891 MW. Four recommendations, all accepted.","open":"Transmission project cost disclosure. In the final sitting week a member put a $4bn figure for the Western Renewables Link against a $1.53bn construction estimate given in writing; the minister said no review exists, only a cost assessment.","add":"Transmission cost estimation and disclosure is the live slice. Separately, the minister's unspecified accuracy objection to the December report has never been resolved and is worth pursuing directly.","plan":["Sustainability Reporting Part 2 (2026-27) - outstanding"],"stale":null},"Planning controls and housing supply":{"did":[["Developing Fishermans Bend","26 Jun 2025","https://www.audit.vic.gov.au/report/developing-fishermans-bend"],["Planning and Managing Drainage Schemes in Melbourne's Growth Areas","24 Jun 2026","https://www.audit.vic.gov.au/report/planning-and-managing-drainage-schemes-melbournes-growth-areas"]],"covers":"One major precinct, where agencies were found not on track with projects delayed by up to 21 years; and drainage infrastructure enabling greenfield housing.","open":"The system. No statewide audit of permit processing times or Housing Statement target progress. Both existing reports look at particular places rather than the process governing all of them.","add":"Whether the planning system processes permits within statutory timeframes, and whether the state tracks and reports housing supply progress reliably.","plan":["Managing Developer Contributions (2026-27) - outstanding, $5.1bn collected with little transparency"],"stale":null},"Building defects and construction regulation":{"did":[["Domestic Building Insurance","14 May 2025","https://www.audit.vic.gov.au/report/domestic-building-insurance"]],"covers":"VMIA's underwriting and claims handling transparency, and the finding that the building regulator does not verify a valid policy exists before issuing permits.","open":"The regulator itself. The April debate put building defect costs at over $675m a year and found half of assessed buildings had non-cladding defects, and the government's response was a new enforcement body.","add":"The audit window is implementation of the new body, not the transition. A watch-list item for 2027-28 rather than now.","plan":[],"stale":null},"Waste, recycling and waste-to-energy regulation":{"did":[["Recovering and Reprocessing Resources from Waste","6 Jun 2019","https://www.audit.vic.gov.au/report/recovering-and-reprocessing-resources-waste"],["Council Waste Management Services","2021","https://www.audit.vic.gov.au/report/council-waste-management-services"]],"covers":"Waste strategy fragmentation and landfill dependence as at 2019, and council-level waste services as at 2021.","open":"Both predate the November 2023 container deposit scheme and the four-bin kerbside rollout. Neither touches waste-to-energy regulation - which a parliamentary committee has now formally asked VAGO to review.","add":"This is the strongest single lead in the scan. A standing committee of the Parliament recommended on 25 August that the Auditor-General review the waste-to-energy regulatory framework, and a further proposal for a moratorium pending that finding was rejected - which places weight on the review actually happening.","plan":[],"stale":"Waste: 7 years since the last substantive look; neither the deposit scheme nor waste-to-energy has ever been audited."},"Forestry transition grants administration":{"did":[["Supporting the Transition from Native Timber Harvesting","1 Apr 2026","https://www.audit.vic.gov.au/report/supporting-transition-native-timber-harvesting"]],"covers":"Worker and business transition outcomes, inadequate record-keeping for payment verification, and insufficient outcome monitoring.","open":"Little. The report is recent and its findings were tested at PAEC within seven weeks of tabling.","add":"Nothing pressing. A useful demonstration of the recommendation loop working end to end.","plan":[],"stale":null},"Emergency services funding and fleet":{"did":[["Managing Victoria's Firefighting Fleet","14 Oct 2026","https://www.audit.vic.gov.au/report/managing-victorias-firefighting-fleet"]],"covers":"Fire authorities need an estimated $1.5bn over 2024-25 to 2033-34 but received 12.1% of it from three budgets. No authority completes all scheduled maintenance, and DEECA removed 54.4% of its fleet from service because of cracking.","open":"The fund that pays for it. The Emergency Services and Volunteers Fund replaced the Fire Services Property Levy and raises substantially more revenue, with the farm component frozen to mid-2030 at roughly $86m a year in forgone revenue. It has never been audited.","add":"How fund revenue is allocated across CFA, FRV and VicSES, whether that split matches operational risk and the renewal need VAGO has now quantified, and the net fiscal effect of repeated farm levy freezes.","plan":["Managing Victoria's Firefighting Fleet - tabled 14 October 2026, after Parliament rose"],"stale":null},"Legal assistance and court access":{"did":[["Access to Legal Aid","20 Aug 2014","https://www.audit.vic.gov.au/report/access-legal-aid"]],"covers":"Demand against funding, thoroughly examined - for a 2014 snapshot.","open":"Twelve years of change. Bail law reform, family violence system growth and post-COVID court backlogs have all landed since.","add":"Whether the funding model keeps pace with bail and remand-driven demand. This connects directly to the prison capacity theme - the same policy change drives demand in both.","plan":[],"stale":"12 years since the last look."},"Gambling regulation and harm reform":{"did":[["Reducing the Harm Caused by Gambling","18 Mar 2021","https://www.audit.vic.gov.au/report/reducing-harm-caused-gambling"]],"covers":"Foundation-level harm reduction programme effectiveness as at 2021. Confirmed by direct check not to address carded play or pre-commitment.","open":"Mandatory carded play, now ten months into live enforcement and never examined by Parliament or VAGO. Separately, PAEC's follow-up recommendations on three earlier VAGO gambling reports remain unimplemented three years on.","add":"Whether carded play is being implemented, monitored and enforced across all venues, and what harm-reduction outcome data the regulator is collecting. The unimplemented-recommendations angle is a cheaper alternative entry point.","plan":[],"stale":"Carded play commenced December 2025 and has never been audited."},"Public lottery licence and gaming revenue":{"did":[["Public Lottery Licence Extension","16 Sep 2026","https://www.audit.vic.gov.au/report/public-lottery-licence-extension"]],"covers":"A limited assurance review finding nothing to suggest the licence approach did not seek to optimise value. The $1.145bn upfront premium exceeded the reserve price and no significant probity issues were found.","open":"Little. The review noted cost assumptions were not fully cross-checked and public transparency was limited, with three recommendations.","add":"Nothing further. Worth noting the political arc: the Premier invoked the forthcoming review as a shield on budget day in May, and the review ultimately supported the government's position.","plan":["Public Lottery Licence Extension - tabled 16 September 2026"],"stale":null},"Free TAFE and skills delivery":{"did":[["Free TAFE","13 May 2026","https://www.audit.vic.gov.au/report/free-tafe"],["Results of 2025 Audits: TAFEs and Universities","4 Jun 2026","https://www.audit.vic.gov.au/report/results-2025-audits-tafes-and-universities"]],"covers":"Participation and fee-saving benefits against cost - Free TAFE costs 33-94% more per enrolment than comparable subsidised training - plus TAFE sector financial results.","open":"Little on the programme. The open issue is how the report was used: a government member spoke to it citing a media release rather than the report, and omitted the cost finding.","add":"Nothing on the topic. The clearest case in the scan of a VAGO finding being publicly restated inaccurately - worth considering whether the office wants a standing practice for correcting the record.","plan":["Results of 2026 Audits: TAFEs and Universities (2026-27) - outstanding"],"stale":null},"myki modernisation and ticketing":{"did":[["Modernising Myki","18 Mar 2026","https://www.audit.vic.gov.au/report/modernising-myki"]],"covers":"Delivery against the reset timeline, benefits management maturity, and the conclusion that value for money is uncertain. The reset added 18 months and $136.8m.","open":"Future delivery phases, which the report flags as carrying significant risk. Separately, PAEC heard that external lawyers had been engaged to resist release of 16 documents relating to the ticketing contract.","add":"A follow-up once the next delivery phase completes, and potentially the contract transparency question, which could sit inside a broader procurement engagement.","plan":["Reliable Service Information for Public Transport Users (2026-27) - outstanding"],"stale":null},"Mental health service access":{"did":[["Access to Mental Health Services","21 Mar 2019","https://www.audit.vic.gov.au/report/access-mental-health-services"],["Child and Youth Mental Health","5 Jun 2019","https://www.audit.vic.gov.au/report/child-and-youth-mental-health"]],"covers":"Access and funding gaps as at 2019, two years before the Royal Commission reported.","open":"The entire reform programme. No VAGO report has assessed implementation of the largest social policy reform in the state, funded by a dedicated levy. Only 40% of metropolitan emergency department inpatients access a mental health bed within 8 hours.","add":"Whether the reform is delivering the service capacity it promised, and whether levy revenue is applied as intended. The planned emergency mental health audit covers one slice - scope around it.","plan":["Emergency Mental Health Services (2026-27) - outstanding, scoped to ED access"],"stale":"7 years since the last look, and the policy world changed in between."},"Ambulance and hospital performance":{"did":[["Access to Emergency Healthcare","25 Jun 2024","https://www.audit.vic.gov.au/report/access-emergency-healthcare"],["Planned Surgery in Victoria","13 Aug 2025","https://www.audit.vic.gov.au/report/planned-surgery-victoria"],["Access to Ambulance Services","6 Oct 2010","https://www.audit.vic.gov.au/report/access-ambulance-services"]],"covers":"Ambulance-to-emergency-department handover and ED length of stay (2024); the COVID Catch-up Plan's surgery performance (2025); ambulance service access (2010).","open":"Ambulance response time performance itself. Code 1 responses met the 15-minute benchmark in only 65.1% of cases in the December 2025 quarter against an 85% target, flat across five quarters. The final sittings added administrative failures: a category 1 patient waiting 70 days and 150 Mildura referrals unprocessed for 16 months.","add":"Why Code 1 performance has plateaued 20 points below target, and whether referral and administrative processes at regional hospitals are reliable. The Mildura case is a discrete, checkable failure with a ministerial concession attached.","plan":["Performance of Victoria's Health Services (2026-27) - outstanding","Resilience of the Triple Zero Service (2026-27) - outstanding"],"stale":"Ambulance services specifically: 16 years."},"Data centres and digital infrastructure planning":{"did":[],"covers":"No VAGO report and nothing in the forward plan on data centre siting, energy or water draw, or planning approvals.","open":"Everything. The theme went from almost nothing before August to appearing in nearly every subsequent sitting week - members statements, questions, petitions, adjournments, a production-of-documents motion and a moratorium bill.","add":"Whether the planning and approvals framework for data centres accounts for their energy, water and e-waste footprint. This is the fastest-growing parliamentary signal in the scan and has no coverage at all.","plan":["Delivering Public Sector ICT Projects (2026-27) - outstanding, but covers government's own projects"],"stale":"Never audited."},"Early childhood and kindergarten rollout":{"did":[],"covers":"No coverage. Absent from the 2026-27, 2027-28 and 2028-29 plan lists.","open":"A multi-billion dollar, decade-long universal commitment delivered through mixed public, council and private providers, with no audit at all.","add":"Whether the rollout is on track against enrolment, workforce and infrastructure commitments. The government's September claim that three-year-old participation has moved from a little over half to over 90 per cent is precisely the kind of testable assertion an audit exists to check.","plan":[],"stale":"Never audited; the nearest relevant report dates from 2007."}},"corrections":[{"what":"Bev McArthur, 1 April 2026, on VAGO's Results of 2024-25 Audits: Local Government","found":"No statement exists. A full-document search of the 1 April Council Hansard found only two references to the Auditor-General - a tabling entry at page 1279 and the report's appearance in a routine tabled-papers list at page 1361.","action":"Removed. The report is now recorded as tabled but never debated.","src":"https://www.parliament.vic.gov.au/4a1b8c/globalassets/hansard-daily-pdfs/hansard-974425065-35051/hansard-974425065-35051.pdf"},{"what":"Sonja Terpstra, 29 July 2026, on VAGO's Delivering School Upgrade Projects","found":"No statement exists. The report appears only in a routine list of tabled Auditor-General reports at page 91. Terpstra did speak that day, but on the Summer Fires inquiry, at pages 92-93.","action":"Removed. The report was still raised by Gaelle Broad on 30 July, so it remains a debated report.","src":"https://www.parliament.vic.gov.au/4a1c36/globalassets/hansard-daily-pdfs/hansard-974425065-36036/hansard-974425065-36036.pdf"},{"what":"Sonja Terpstra, 30 July 2026, on drivers being 'happy to drive over potholes'","found":"Not in the cited document. The confirmed speaking order for the 30 July Budget papers debate is Batchelor, Payne, Broad, Ermacora, Gray-Barberio, then Lovell moving the adjournment. Terpstra does not appear.","action":"Removed. It was already flagged as media-only; attaching it to a Hansard URL that does not contain it was wrong.","src":"https://www.parliament.vic.gov.au/parliamentary-activity/hansard/hansard-details/HANSARD-974425065-36093"},{"what":"Police Reservists Bill second reading debate, 4 June 2026","found":"No second reading debate occurred that day. The bill was introduced and first read at about page 2122, and a procedural motion at page 2124 deferred the second reading.","action":"Signal rewritten to describe introduction and first reading, then removed from the theme set as non-substantive.","src":"https://www.parliament.vic.gov.au/4a1fbf/globalassets/hansard-daily-pdfs/hansard-974425065-35593/hansard-974425065-35593.pdf"},{"what":"The published 2026 sitting calendar was wrong","found":"The calendar listed nine sitting days after 4 August. Parliament actually sat fourteen days in the Council and thirteen in the Assembly, including an entirely unscheduled week from 22 to 24 September and extra Fridays on 14 and 28 August. The final sitting day of the 60th Parliament was Thursday 24 September 2026.","action":"The scan period was extended from 10 September to 24 September. Three of the five August and September VAGO mentions fall in days the original calendar did not predict.","src":"https://www.parliament.vic.gov.au/4a8a1a/globalassets/hansard-daily-pdfs/hansard-974425065-37279/hansard-974425065-37279.pdf"},{"what":"Wendy Lovell, 26 August 2026, on the Suburban Rail Loop report","found":"The day's item index lists her as the third speaker on the report, at page 3656. The item page could not be opened and the body was never read.","action":"Not recorded as a statement. Applying the same rule that caught the three errors above - an index entry is not a speech until the body confirms it.","src":"https://www.parliament.vic.gov.au/parliamentary-activity/hansard/hansard-details/HANSARD-974425065-36571"},{"what":"A VAGO report was missing from the original scan","found":"Responses to Performance Engagement Recommendations: Annual Status Update 2026 was tabled on 13 May 2026 and was absent from the record. Its finding that 334 recommendations remain unresolved across 55 agencies is directly relevant to the recommendation-implementation theme.","action":"Added to the tabled-reports register.","src":"https://www.audit.vic.gov.au/report/responses-performance-engagement-recommendations-annual-status-update-2026"},{"what":"Proof and final Hansard editions number pages differently","found":"Proof editions restart page numbering at 1 each sitting day; final editions number continuously across the year. Some page references from the first half of this scan were taken from proof editions. For 24 September the confirmed offset is proof page plus 4,548.","action":"Every page reference now records which edition it came from.","src":"https://www.parliament.vic.gov.au/4a7fcf/globalassets/hansard-daily-pdfs/hansard-974425065-37098/hansard-974425065-37098.pdf"}],"days":[{"date":"2026-09-08","chamber":"VIC-LA","house":"Legislative Assembly","status":"final","title":"Hansard LEGISLATIVE // ---------------------------------------------------------------- helpers
function norm(s) { return String(s || '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }

function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : null; }
function parse(iso) { return new Date(iso + 'T00:00:00Z'); }
function addDays(iso, n) { const d = parse(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function fmtShort(iso) { const d = parse(iso); return `${d.getUTCDate()} ${MO[d.getUTCMonth()]}`; }
function fmtLong(iso) { const d = parse(iso); return `${d.getUTCDate()} ${['January','February','March','April','May','June','July','August','September','October','November','December'][d.getUTCMonth()]} ${d.getUTCFullYear()}`; }
function fmtRange(a, b) { const x = parse(a), y = parse(b); return x.getUTCMonth() === y.getUTCMonth() ? `${x.getUTCDate()}–${fmtShort(b)}` : `${fmtShort(a)} – ${fmtShort(b)}`; }
function plural(n, one, many) { return `${n.toLocaleString('en-AU')} ${n === 1 ? one : (many || one + 's')}`; }
function pct(a, t) { return (t ? Math.round(a / t * 100) : 0) + '%'; }

const VIEW_DEFAULTS = () => ({ limit: 20, tab: 'brief', period: '2w', sector: null, mapMode: 'mentions', mTab: 'ag', agSel: null, side: 'all', repOff: null, notYet: false, devType: 'All', q: '', expJur: null, expSide: 'all', newOnly: false, drawer: null });
let S = Object.assign({ stage: 'onboard', jur: null, menu: null, share: null, toast: '', shared: false, sharedHidden: false, ob: { jur: null, start: 'brief' } }, VIEW_DEFAULTS());

const HASH_VIEW = { brief: 'brief', compare: 'compare', mentions: 'mentions', developments: 'dev', gaps: 'gaps', explore: 'explore' };
function fromHash() {
  const p = new URLSearchParams(location.hash.replace(/^#/, '')), o = {};
  const jur = (p.get('jur') || '').toUpperCase();
  if (!CODES.includes(jur) && jur !== 'ALL') return null;
  o.jur = jur;
  if (HASH_VIEW[p.get('view')]) o.tab = HASH_VIEW[p.get('view')];
  if (PERIODS[p.get('period')]) o.period = p.get('period');
  if (SECT[p.get('sector')]) o.sector = p.get('sector');
  if (['mentions', 'rate', 'status'].includes(p.get('map'))) o.mapMode = p.get('map');
  if (p.get('tab') === 'reports') o.mTab = 'reports';
  const off = (p.get('office') || '').toUpperCase(); if (CODES.includes(off)) { if (o.mTab === 'reports') o.repOff = off; else o.agSel = off; }
  if (['government', 'opposition', 'crossbench', 'witness'].includes(p.get('side'))) o.side = p.get('side');
  if (p.get('unmentioned') === '1') o.notYet = true;
  const t = DEV_TYPES.find(x => x.toLowerCase() === (p.get('type') || '').toLowerCase()); if (t) o.devType = t;
  if (p.get('q')) o.q = p.get('q').slice(0, 200);
  const ej = (p.get('in') || '').toUpperCase(); if (CODES.includes(ej) || ej === 'ALL') o.expJur = ej;
  if (['government', 'opposition', 'crossbench'].includes(p.get('speaker'))) o.expSide = p.get('speaker');
  if (p.get('new') === '1') o.newOnly = true;
  for (const k of ['item', 'report', 'topic', 'theme']) if (p.get(k)) o.drawer = { k, id: p.get(k) };
  return o;
}
function toHash(withDrawer) {
  const p = new URLSearchParams();
  p.set('view', S.tab === 'dev' ? 'developments' : S.tab); p.set('jur', S.jur);
  if (S.period !== '2w') p.set('period', S.period);
  if (S.sector) p.set('sector', S.sector);
  if (S.tab === 'brief' && S.mapMode !== 'mentions') p.set('map', S.mapMode);
  if (S.tab === 'mentions') {
    if (S.mTab === 'reports') { p.set('tab', 'reports'); if (S.repOff) p.set('office', S.repOff); if (S.notYet) p.set('unmentioned', '1'); }
    else { if (S.agSel) p.set('office', S.agSel); if (S.side !== 'all') p.set('side', S.side); }
  }
  if (S.tab === 'dev' && S.devType !== 'All') p.set('type', S.devType.toLowerCase());
  if (S.tab === 'explore') { if (S.q) p.set('q', S.q); if (S.expJur && S.expJur !== S.jur) p.set('in', S.expJur); if (S.expSide !== 'all') p.set('speaker', S.expSide); if (S.newOnly) p.set('new', '1'); }
  if (withDrawer && S.drawer) p.set(S.drawer.k, S.drawer.id);

}
let lastHash = '';
function syncHash() {
  if (S.stage !== 'app') return;
  const h = '#' + (ARTIFACT ? (S.tab === 'dev' ? 'developments' : S.tab) : toHash(true));
  if (h === lastHash) return;

}

// ---------------------------------------------------------------- model
function model() {
  const isAll = S.jur === 'ALL', cur = isAll ? null : BY[S.jur];
  const per = PERIODS[S.period];
  const to = AS_OF, from = per.days ? addDays(AS_OF, -per.days) : per.from;
  const prevFrom = per.days ? addDays(from, -per.days) : null;
  const range = fmtRange(from, to);
  const secOk = m => !S.sector || m.sectors.includes(S.sector);
  const inP = m => m.date >= from && m.date <= to;
  const inPrev = m => !!prevFrom && m.date >= prevFrom && m.date < from;
  const mine = m => isAll || m.jur === S.jur;
  const subst = m => m.kind !== 'procedural' && m.kind !== 'presiding';
  const isNew = m => m.date >= NEW_FROM && !PR.seen.includes(m.id);
  const ms = D.mentions.filter(secOk);
  const pool = ms.filter(m => mine(m) && inP(m));
  const lastSat = c => c === 'VIC' ? VIC_LAST : (BY[c].read ? BY[c].read.to : null);
  const readInPeriod = c => { const r = BY[c].read; return !!r && r.to >= from && r.from <= to; };
  const isRead = c => !!BY[c].read;
  const countFor = c => ms.filter(m => m.jur === c && inP(m)).length;
  const speechesFor = c => D.days.filter(d => d.code === c && d.date >= from && d.date <= to).reduce((a, d) => a + d.speeches, 0);
  const daysFor = c => c === 'VIC' ? null : new Set(D.days.filter(d => d.code === c && d.date >= from && d.date <= to).map(d => d.date)).size;
  const sideCounts = list => { const c = {}; for (const m of list) c[m.side] = (c[m.side] || 0) + 1; return c; };
  const sectorMatch = vs => !S.sector || (VSEC[vs] || []).includes(S.sector);
  const devs = D.developments.filter(d => d.date >= from && d.date <= to);
  return { isAll, cur, per, from, to, prevFrom, range, secOk, inP, inPrev, mine, subst, isNew, ms, pool, lastSat, readInPeriod, isRead, countFor, speechesFor, daysFor, sideCounts, sectorMatch, devs };
}

// ---------------------------------------------------------------- small views
const pill = (t, cls = '') => `<span class="pill ${cls}">${esc(t)}</span>`;
const sidePill = m => { const s = SIDES[m.side] || SIDES.unknown; return `<span class="pill thin plain"><span class="dot" style="background:${s[1]};width:6px;height:6px;margin-right:4px;vertical-align:1px"></span>${esc(s[0])}</span>`; };
const stancePill = m => { const s = STANCE[m.stance]; return s ? pill(s[0], s[1] + ' thin') : ''; };
function sideBar(c, thin) {
  const keys = ['government', 'opposition', 'crossbench', 'witness', 'chair', 'unknown'], t = keys.reduce((a, k) => a + (c[k] || 0), 0);
  if (!t) return `<div class="sbar${thin ? ' thin' : ''}" aria-hidden="true"></div>`;
  return `<div class="sbar${thin ? ' thin' : ''}" aria-hidden="true">${keys.map(k => c[k] ? `<span style="width:${c[k] / t * 100}%;background:${SIDES[k][1]}"></span>` : '').join('')}</div>`;
}
function sideText(c) { const parts = [['government', 'government'], ['opposition', 'opposition'], ['crossbench', 'crossbench'], ['witness', 'witness'], ['chair', 'chair or procedural'], ['unknown', 'side unknown']].filter(([k]) => c[k]).map(([k, l]) => `${c[k]} ${l}`); return parts.length ? parts.join(' · ') : 'No mentions'; }

function srcBtn(m) { const u = safeUrl(m.url); return u ? `<a class="btn primary" href="${esc(u)}" target="_blank" rel="noopener" data-act="seen" data-v="${esc(m.id)}">Open in Hansard ↗</a>` : ''; }

  const ok = /^(Verified|Quote verified)/.test(m.verified || '');

}

// ---------------------------------------------------------------- pages
