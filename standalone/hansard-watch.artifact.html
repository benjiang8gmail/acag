      ? { act: 'tab', v: 'gaps', label: 'Potential program gaps', n: vicTopics.length, d: '', sub: `${vicTopics.filter(t => t.gap === 'Not covered').length} not covered · ${vicTopics.filter(t => t.gap !== 'Not covered').length} partly`, cmp: isAll ? 'VAGO only so far' : 'From the VAGO scan, 1 Nov' }
      : { act: 'tab', v: 'gaps', label: 'Potential program gaps', n: '—', d: '', sub: cur.program.name ? 'Not compared yet' : 'No published program', cmp: '' },
  ];
  const tilesHtml = tiles.map(t => `<button class="tile" data-act="${t.act}" data-v="${esc(t.v)}">
      <span class="s13 muted">${esc(t.label)}</span>
      <span style="display:flex;align-items:baseline;gap:8px"><span class="tile-n">${esc(t.n)}</span><span class="note nowrap fg2">${esc(t.d)}</span></span>
      ${t.bar || ''}<span class="note">${esc(t.sub)}</span>${t.cmp ? `<span class="cmp">${esc(t.cmp)}</span>` : ''}
    </button>`).join('');

  // Map or 9-office table
  let mapHtml;
  if (!isAll) {
    const maxM = Math.max(1, ...CODES.map(M.countFor));
    const HEAT = ['var(--heat0)', 'var(--heat1)', 'var(--heat2)', 'var(--heat3)', 'var(--heat4)'];
    const cells = CODES.map(c => {
      const j = BY[c], read = M.readInPeriod(c), n = M.countFor(c), sp = M.speechesFor(c);
      let val, bg = 'var(--heat0)';
      if (S.mapMode === 'mentions') { val = read ? String(n) : '—'; if (read) bg = HEAT[Math.ceil(n / maxM * 4)]; }
      else if (S.mapMode === 'rate') { val = read && sp ? (n / sp * 1000).toFixed(1) : (c === 'VIC' && read ? 'n/a' : '—'); if (read && sp) bg = HEAT[Math.min(4, Math.ceil(n / sp * 1000 / 2))]; }
      else { val = { live: 'Read', blocked: 'Blocked', empty: 'Empty' }[j.status] || j.status; if (c === 'VIC') val = 'Own scan'; bg = j.status === 'live' ? 'var(--ok-bg)' : c === 'VIC' ? 'var(--brand-tint)' : j.status === 'blocked' ? 'var(--bad-bg)' : 'var(--warn-bg)'; }
      const note = !j.read ? (j.status === 'empty' ? 'Empty pages' : 'Not read') : (M.lastSat(c) < M.from ? 'Not sitting' : (c === 'VIC' ? 'Separate scan' : ''));
      return `<button class="${c === S.jur ? 'you' : ''}" style="grid-row:${j.tilePos[0]};grid-column:${j.tilePos[1]};background:${bg}" data-act="jur" data-v="${c}" aria-label="${esc(j.name)}: ${esc(val)}${note ? ', ' + esc(note) : ''}"><span class="t1">${esc(j.short)}</span><span class="t2">${esc(val)}</span><span class="t3">${esc(note)}</span></button>`;
    }).join('');
    const legend = { mentions: 'Darker = more mentions of that Auditor-General in the period. — = not read.', rate: 'Mentions per 1,000 speeches read. Victoria’s scan didn’t count speeches.', status: 'Whether Hansard Watch can read each parliament today.' }[S.mapMode];
    mapHtml = `<div class="row" style="gap:8px"><h2 class="card-title nowrap">Across Australia</h2>
        <div class="seg" role="radiogroup" aria-label="Map shows">${[['mentions', 'Mentions'], ['rate', 'Per 1,000 speeches'], ['status', 'Coverage']].map(([k, l]) => `<button role="radio" aria-checked="${S.mapMode === k}" data-act="map" data-v="${k}">${l}</button>`).join('')}</div></div>
      <div class="ausmap">${cells}</div>
      <div class="note">${legend} Your jurisdiction is outlined. Tap another to switch.</div>`;
  } else {
    mapHtml = `<h2 class="card-title">All 9 offices</h2>
      <div class="tablewrap"><table class="data"><thead><tr><th>Office</th><th class="num">Mentions</th><th class="num">Speeches read</th><th>Coverage</th></tr></thead><tbody>
      ${CODES.map(c => { const j = BY[c], read = M.readInPeriod(c); return `<tr><td><button class="linkbtn" style="font-size:13px;font-weight:600;color:var(--fg)" data-act="jur" data-v="${c}">${esc(j.office)}</button></td><td class="num">${read ? M.countFor(c) : '—'}</td><td class="num">${c === 'VIC' ? 'n/a' : read ? M.speechesFor(c).toLocaleString('en-AU') : '—'}</td><td class="note">${esc(c === 'VIC' ? 'Separate scan' : j.read ? (M.lastSat(c) < M.from ? 'Not sitting' : 'Read') : j.status === 'empty' ? 'Empty pages' : 'Blocked')}</td></tr>`; }).join('')}
      </tbody></table></div>`;
  }
  const else3 = isAll ? null : M.ms.filter(m => m.jur !== cur.code && M.inP(m) && M.subst(m)).slice(0, 3);
  const elseHtml = isAll ? (() => {
    const counts = CODES.map(c => [c, M.countFor(c)]).filter(([c]) => M.readInPeriod(c)).sort((a, b) => b[1] - a[1]), mx = Math.max(1, ...counts.map(x => x[1]));
    return `<div class="card-head"><h2 class="card-title">By parliament</h2><button class="btn subtle" data-act="tab" data-v="compare">Compare ›</button></div><div class="note" style="margin-bottom:4px">Auditor-General mentions in the period, parliaments read</div>
      ${counts.map(([c, n]) => `<button class="trow s13" style="grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 32px" data-act="jur" data-v="${c}"><span style="font-weight:600">${esc(BY[c].name)}</span><span class="meter"><span style="width:${n / mx * 100}%;background:${BY[c].color}"></span></span><span style="text-align:right;font-weight:600">${n}</span></button>`).join('')}`;
  })() : `<div class="card-head"><h2 class="card-title">Meanwhile in other parliaments</h2><button class="btn subtle" data-act="tab" data-v="compare">Compare ›</button></div>
      <div class="note" style="margin-bottom:4px">The latest Auditor-General mentions elsewhere in the period</div>
      ${else3.map(m => `<button class="list-btn" data-act="item" data-v="${esc(m.id)}"><span class="top"><span>${esc(headlineFor(m))}</span><span class="note nowrap">${esc(BY[m.jur].short)} · ${esc(fmtDay(m.date))}</span></span><span class="note">${esc(speakerLine(m))}</span></button>`).join('') || '<div class="s13 muted">No mentions elsewhere in this period.</div>'}`;

  // Sectors
  const secRows = D.sectors.map(s => {
    const here = D.mentions.filter(m => M.mine(m) && M.inP(m) && m.sectors.includes(s.id)).length;
    const all = D.mentions.filter(m => M.inP(m) && m.sectors.includes(s.id)).length;
    return { s, here, oth: all - here, all };
  }).filter(o => o.all > 0).sort((a, b) => isAll ? b.all - a.all : (b.here - a.here) || (b.oth - a.oth)).slice(0, 6);
  const secMax = Math.max(1, ...secRows.map(o => isAll ? o.all : o.here));
  const secHtml = `<div class="card-head"><h2 class="card-title">By sector</h2><button class="btn subtle" data-act="tab" data-v="compare">All sectors ›</button></div>
    <div class="note" style="margin-bottom:6px">${isAll ? 'Mentions across the parliaments read' : `Mentions in ${esc(cur.parl)}, and elsewhere`}</div>
    ${secRows.map(o => `<button class="trow s13" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 92px;${S.sector === o.s.id ? 'background:var(--brand-tint2)' : ''}" aria-pressed="${S.sector === o.s.id}" data-act="sector" data-v="${S.sector === o.s.id ? '' : o.s.id}">
      <span style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.s.label)}</span>
      <span style="display:flex;align-items:center;gap:6px"><span class="meter"><span style="width:${(isAll ? o.all : o.here) / secMax * 100}%"></span></span><span style="font-weight:600;min-width:18px;text-align:right">${isAll ? o.all : o.here}</span></span>
      <span class="note nowrap">${isAll ? '' : '+' + o.oth + ' elsewhere'}</span></button>`).join('') || '<div class="s13 muted">No sector terms matched in this period.</div>'}
    <div class="note" style="margin-top:6px">Sectors come from a keyword match on the debate title and text. Select one to filter every page; select it again to clear.</div>`;
  const evHtml = `<h2 class="card-title">Coming up</h2>${D.events.filter(e => e.date >= AS_OF).map(e => `<div class="s13" style="display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line2)"><div style="width:96px;flex:none;font-weight:600">${esc(fmtDay(e.date))}</div><div class="fg2" style="flex:1">${esc(BY[e.jur].short)} · ${esc(e.text)}</div></div>`).join('')}<div class="note">Dates from the government records and the VAGO scan, 1 Nov 2026.</div>`;
  const adds = PR.adds.map(id => D.mentions.find(m => m.id === id)).filter(Boolean);
  const addsHtml = adds.length ? `<div class="card"><h2 class="card-title">Added to your brief</h2>${adds.map(m => `<button class="list-btn" data-act="item" data-v="${esc(m.id)}"><span class="top"><span>${esc(headlineFor(m))}</span><span class="note nowrap">${esc(BY[m.jur].short)} · ${esc(fmtDay(m.date))}</span></span></button>`).join('')}</div>` : '';

  return `<div class="grid g-hero">${heroHtml}${quiet}${gapHtml}</div>
    <div class="ai" style="margin-top:-8px">✦ Notes on Victorian mentions were written by an AI-assisted scan — check the source. Other parliaments show the Hansard text as stored; AI summaries and sentiment come later.</div>
    <div class="grid g-tiles">${tilesHtml}</div>
    <div class="grid g-2"><div class="card" style="gap:12px">${mapHtml}</div><div class="card">${elseHtml}</div></div>
    <div class="grid g-2"><div class="card" style="gap:2px">${secHtml}</div><div class="card">${evHtml}</div>${addsHtml}</div>`;
}

function pageCompare(M) {
  const { isAll, cur } = M;
  const rows = CODES.map(c => {
    const j = BY[c], read = M.readInPeriod(c), list = M.ms.filter(m => m.jur === c && M.inP(m)), sp = M.speechesFor(c);
    return { c, j, read, n: list.length, sp, days: M.daysFor(c), rate: read && sp ? list.length / sp * 1000 : null, sc: M.sideCounts(list) };
  });
  const tableHtml = `<div class="tablewrap"><table class="data"><caption class="sr">Auditor-General mentions by parliament, ${esc(M.range)}</caption>
    <thead><tr><th>Parliament</th><th>What was read</th><th class="num">Sitting days</th><th class="num">Speeches</th><th class="num">Mentions</th><th class="num">Per 1,000</th><th style="min-width:140px">Who mentions</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="${r.c === S.jur ? 'you' : ''}">
      <td><button class="linkbtn" style="font-size:13px;font-weight:600;color:var(--fg)" data-act="jur" data-v="${r.c}"><span class="dot" style="background:${r.j.color};margin-right:6px"></span>${esc(r.j.name)}</button>${r.c === S.jur ? ' <span class="cmp">You</span>' : ''}</td>
      <td class="note">${esc(r.c === 'VIC' ? 'VAGO scan, 3 Feb – 24 Sep' : r.j.read ? 'Scanner, ' + fmtShort(r.j.read.from) + ' – ' + fmtShort(r.j.read.to) : (r.j.status === 'empty' ? 'Not read: empty pages' : 'Not read: blocked'))}</td>
      <td class="num">${r.c === 'VIC' ? '—' : r.read ? r.days : '—'}</td><td class="num">${r.read && r.sp ? r.sp.toLocaleString('en-AU') : '—'}</td>
      <td class="num" style="font-weight:600">${r.read ? r.n : '—'}</td><td class="num">${r.rate != null ? r.rate.toFixed(1) : '—'}</td>
      <td>${r.read && r.n ? sideBar(r.sc, true) : '<span class="note">—</span>'}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="legend">${['government', 'opposition', 'crossbench', 'witness', 'chair'].map(k => `<span><i style="background:${SIDES[k][1]}"></i>${SIDES[k][0]}</span>`).join('')}</div>
    <div class="note">Victoria’s figures come from a separate reading scan of the transcripts, so they aren’t directly comparable with the text-search counts for other parliaments.</div>`;

  // Who mentions vs who speaks
  const scanCodes = CODES.filter(c => BY[c].read && BY[c].read.by === 'scan' && M.readInPeriod(c));
  const focus = !isAll && scanCodes.includes(cur.code) ? [cur.code] : scanCodes;
  const turns = { government: 0, opposition: 0, crossbench: 0 }, ment = { government: 0, opposition: 0, crossbench: 0 };
  for (const s of D.sides) if (focus.includes(s.code) && s.date >= M.from && s.date <= M.to && turns[s.side] != null) turns[s.side] += s.turns;
  for (const m of M.ms) if (focus.includes(m.jur) && M.inP(m) && ment[m.side] != null) ment[m.side]++;
  const tT = turns.government + turns.opposition + turns.crossbench, tM = ment.government + ment.opposition + ment.crossbench;
  const share = (o, t) => ['government', 'opposition', 'crossbench'].map(k => `<span style="width:${t ? o[k] / t * 100 : 0}%;background:${SIDES[k][1]}"></span>`).join('');
  const insight = tT && tM ? (() => { const k = ['opposition', 'crossbench', 'government'].sort((a, b) => (ment[b] / tM - turns[b] / tT) - (ment[a] / tM - turns[a] / tT))[0]; return `${cap(SIDES[k][0])} members give ${pct(turns[k], tT)} of speaking turns but ${pct(ment[k], tM)} of Auditor-General mentions.`; })() : 'Not enough data in this period.';
  const whoHtml = `<h2 class="card-title">Who mentions the Auditor-General</h2>
    <div class="note">${esc(focus.length === 1 ? BY[focus[0]].parl : 'The ' + focus.length + ' parliaments the scanner reads')} · ${esc(M.range)} · members with a known side</div>
    <div class="stack" style="gap:8px;margin-top:6px">
      <div class="s13" style="display:grid;grid-template-columns:120px 1fr 64px;gap:8px;align-items:center"><span class="muted">Speaking turns</span><div class="sbar">${share(turns, tT)}</div><span class="note" style="text-align:right">${tT.toLocaleString('en-AU')}</span></div>
      <div class="s13" style="display:grid;grid-template-columns:120px 1fr 64px;gap:8px;align-items:center"><span class="muted">AG mentions</span><div class="sbar">${share(ment, tM)}</div><span class="note" style="text-align:right">${tM}</span></div>
    </div>
    <div class="legend">${['government', 'opposition', 'crossbench'].map(k => `<span><i style="background:${SIDES[k][1]}"></i>${SIDES[k][0]}</span>`).join('')}</div>
    <div class="s13 fg2">${esc(insight)}</div>`;

  // Weekly chart
  const weekStart = iso => { const d = parse(iso); const wd = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - wd); return d.toISOString().slice(0, 10); };
  const weeks = []; for (let w = weekStart(M.from); w <= M.to; w = addDays(w, 7)) weeks.push(w);
  const series = CODES.filter(c => M.readInPeriod(c));
  const cnt = {}; for (const m of M.ms) if (M.inP(m)) { const k = weekStart(m.date) + '|' + m.jur; cnt[k] = (cnt[k] || 0) + 1; }
  const tot = weeks.map(w => series.reduce((a, c) => a + (cnt[w + '|' + c] || 0), 0)), yMax = Math.max(4, ...tot);
  const W = 640, H = 200, padL = 28, padB = 22, padT = 8, bw = (W - padL - 8) / weeks.length;
  const y = v => H - padB - (v / yMax) * (H - padB - padT);
  const ticks = [0, Math.round(yMax / 2), yMax];
  let bars = '';
  weeks.forEach((w, i) => {
    let acc = 0; const x = padL + i * bw + bw * 0.15, wd = Math.max(2, bw * 0.7);
    for (const c of series) { const v = cnt[w + '|' + c] || 0; if (!v) continue; const y0 = y(acc), y1 = y(acc + v); acc += v; bars += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${wd.toFixed(1)}" height="${(y0 - y1).toFixed(1)}" fill="${BY[c].color}" data-tip="${esc(BY[c].short)} · week of ${esc(fmtShort(w))}: ${v} ${v === 1 ? 'mention' : 'mentions'}" tabindex="-1"></rect>`; }
  });
  const every = Math.ceil(weeks.length / 8);
  const xl = weeks.map((w, i) => i % every === 0 ? `<text x="${(padL + i * bw + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--fg3)">${esc(fmtShort(w))}</text>` : '').join('');
  const chartHtml = `<h2 class="card-title">Mentions by week</h2><div class="note">Auditor-General mentions per week, by parliament read</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mentions by week, ${esc(M.range)}" style="max-height:240px">
      ${ticks.map(t => `<line x1="${padL}" x2="${W - 4}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"></line><text x="${padL - 6}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--fg3)">${t}</text>`).join('')}
      ${bars}${xl}</svg>
    <div class="legend">${series.map(c => `<span><i style="background:${BY[c].color}"></i>${esc(BY[c].short)}</span>`).join('')}</div>`;

  // Sector heatmap
  const heatCols = `minmax(${mob ? '96px' : '190px'},1.6fr) repeat(9,minmax(0,1fr))`;
  const HB = ['var(--heat0)', 'var(--heat1)', 'var(--heat2)', 'var(--heat3)', 'var(--heat4)'];
  const heatRows = D.sectors.map(s => ({ s, cells: CODES.map(c => ({ c, n: D.mentions.filter(m => m.jur === c && M.inP(m) && m.sectors.includes(s.id)).length, read: M.readInPeriod(c) })) })).filter(r => r.cells.some(x => x.n));
  const heatHtml = `<h2 class="card-title">Sectors across parliaments</h2>
    <div class="note">Your column is outlined. Select a sector to filter every page, or a cell to see those mentions in Explore. Sectors are a keyword match.</div>
    <div class="tablewrap"><div style="display:flex;flex-direction:column;gap:3px;margin-top:4px;min-width:${mob ? 340 : 0}px">
      <div class="heat" style="grid-template-columns:${heatCols};font-size:11px"><span></span>${CODES.map(c => `<span style="text-align:center;font-weight:${c === S.jur ? 700 : 600};color:${c === S.jur ? 'var(--brand)' : 'var(--fg2)'}">${esc(BY[c].short)}</span>`).join('')}</div>
      ${heatRows.map(r => `<div class="heat" style="grid-template-columns:${heatCols}"><button class="lbl${S.sector === r.s.id ? ' on' : ''}" title="${esc(r.s.label)}" aria-pressed="${S.sector === r.s.id}" data-act="sector" data-v="${S.sector === r.s.id ? '' : r.s.id}">${esc(r.s.label)}</button>
        ${r.cells.map(x => `<button class="cell${x.c === S.jur ? ' you' : ''}" style="background:${x.read ? HB[Math.min(4, Math.ceil(x.n / 2))] : 'var(--soft)'};color:var(--fg)" ${x.n ? `data-act="heat" data-v="${x.c}|${r.s.id}"` : 'disabled'} aria-label="${esc(r.s.label)} in ${esc(BY[x.c].name)}: ${x.read ? x.n : 'not read'}">${x.read ? (x.n || '') : '·'}</button>`).join('')}</div>`).join('') || '<div class="s13 muted">No sector terms matched in this period.</div>'}
    </div></div>
    <div class="note">Blank = not mentioned. · = not read. Victoria uses the VAGO scan’s quotes only.</div>`;

  return `<div class="card">${tableHtml}</div>
    <div class="grid g-2"><div class="card">${whoHtml}</div><div class="card">${chartHtml}</div></div>
    <div class="card" style="gap:8px">${heatHtml}</div>`;
}

function pageMentions(M) {
  const { isAll, cur } = M;
  const tabsHtml = `<div role="tablist" aria-label="Mentions" class="tabs" style="padding:0;border-bottom:1px solid var(--line);height:auto">
    ${[['ag', 'Auditors-General'], ['reports', 'Reports']].map(([k, l]) => `<button role="tab" aria-selected="${S.mTab === k}" style="min-height:var(--btn-h)" data-act="mtab" data-v="${k}">${l}</button>`).join('')}</div>`;
  if (S.mTab === 'reports') return tabsHtml + reportsTab(M);
  const sel = S.agSel || (isAll ? 'VIC' : cur.code);
  const rowsHtml = CODES.map(c => {
    const j = BY[c], list = M.ms.filter(m => m.jur === c && M.inP(m)), sc = M.sideCounts(list), read = M.readInPeriod(c);
    const note = !j.read ? (j.status === 'empty' ? 'Not read: empty pages' : 'Not read: blocked') : (M.lastSat(c) < M.from ? 'Not sitting' : c === 'VIC' ? 'VAGO scan' : '');
    return `<button class="agrow${c === sel ? ' sel' : ''}" aria-pressed="${c === sel}" data-act="agsel" data-v="${c}">
      <span style="flex:1 1 230px;display:flex;gap:6px;align-items:baseline;min-width:0"><b style="font-weight:600">${esc(j.officeName)}</b>${c === S.jur ? '<span class="cmp" style="font-size:11px">You</span>' : ''}<span class="note" style="font-size:11px">${esc(note)}</span></span>
      <span style="flex:0 0 64px;font-weight:600">${read ? list.length : '—'}</span>
      <span style="flex:1 1 150px">${read && list.length ? sideBar(sc) : ''}</span>
      <span class="note" style="flex:0 0 280px">${read ? esc(sideText(sc)) : esc(j.route)}</span></button>`;
  }).join('');
  const j = BY[sel], read = M.readInPeriod(sel);
  const sideOpts = ['all', 'government', 'opposition', 'crossbench'].concat(sel === 'VIC' ? ['witness'] : []);
  const list = M.ms.filter(m => m.jur === sel && M.inP(m) && (S.side === 'all' || m.side === S.side));
  let body;
  if (!j.read) body = quietCard(`${j.parl} isn’t read yet`, `${j.route}.${j.needs ? ' Needs: ' + lc(j.needs) + '.' : ''}`, 'See coverage', 'menu', 'status');
  else if (!read) body = quietCard(`Nothing read for ${j.parl} in this period.`, `Hansard Watch holds ${j.parl} from ${fmtDay(j.read.from)} to ${fmtDay(j.read.to)}.`, S.period === 'all' ? '' : 'Show everything stored', 'period', 'all');
  else body = list.slice(0, S.limit).map(m => mentionEntry(m, M, false)).join('') + (list.length > S.limit ? `<div><button class="btn" data-act="more">Show ${Math.min(20, list.length - S.limit)} more of ${list.length - S.limit}</button></div>` : '') || `<div class="s13 muted" style="padding:8px 0">No mentions${S.side !== 'all' ? ' from ' + SIDES[S.side][0].toLowerCase() + ' members' : ''} in this period.</div>`;
  return `${tabsHtml}
    <div class="card" style="padding:8px;gap:0">
      ${!mob ? `<div class="note" style="display:flex;gap:12px;padding:6px 10px"><span style="flex:1 1 230px">Office</span><span style="flex:0 0 64px">Mentions</span><span style="flex:1 1 150px">By side</span><span style="flex:0 0 280px"></span></div>` : ''}
      ${rowsHtml}
    </div>
    <div class="card" style="gap:10px">
      <div class="row" style="gap:8px"><h2 class="card-title" style="flex:1 1 220px">Mentions of the ${esc(j.officeName)}</h2>
        <div class="row">${sideOpts.map(k => `<button class="chip${S.side === k ? ' on' : ''}" aria-pressed="${S.side === k}" data-act="side" data-v="${k}">${k === 'all' ? 'All' : esc(SIDES[k][0])}</button>`).join('')}</div></div>
      <div class="note">${sel === 'VIC' ? 'Each quote was checked against the transcript by the VAGO scan. Stance is the scan’s reading of how the member used VAGO’s work.' : 'Every speech in the store whose text names an Auditor-General or audit office. Side comes from the speaker’s party and the government of the day.'}</div>
      ${body}
    </div>`;
}

function reportsTab(M) {
  const off = S.repOff || (M.isAll ? 'VIC' : M.cur.code);
  const chips = `<div class="row">${CODES.map(c => `<button class="chip${c === off ? ' on' : ''}" aria-pressed="${c === off}" data-act="repoff" data-v="${c}">${esc(BY[c].short)}</button>`).join('')}<span class="grow"></span>
    ${off === 'VIC' ? `<button class="chip sq${S.notYet ? ' on' : ''}" aria-pressed="${S.notYet}" data-act="notyet">${S.notYet ? '✓ ' : ''}Not yet mentioned only</button>` : ''}</div>`;
  if (off !== 'VIC') {
    const j = BY[off], named = M.ms.filter(m => m.jur === off && m.report);
    const groups = {}; for (const m of named) (groups[m.report] = groups[m.report] || []).push(m);
    return chips + `<div class="card"><div style="font-weight:600">${esc(j.officeName)} · report register</div>
      <div class="s13 muted">The register isn’t loaded yet (spec Phase 3).${safeUrl(j.reportsUrl) ? ` The office lists its reports at <a href="${esc(j.reportsUrl)}" target="_blank" rel="noopener">${esc(j.reportsUrl.replace(/^https?:\/\//, ''))}</a>.` : ''}</div>
      ${Object.keys(groups).length ? `<div class="d-sec">Reports named in Hansard, stored window</div>${Object.entries(groups).map(([t, ms]) => `<button class="list-btn" data-act="item" data-v="${esc(ms[0].id)}"><span class="top"><span>${esc(t)}</span><span class="note nowrap">${plural(ms.length, 'mention')}</span></span><span class="note">Last ${esc(fmtDay(ms[0].date))} · matched by the report number in the text</span></button>`).join('')}` : ''}</div>`;
  }
  const rows = VIC.tabled.filter(t => M.sectorMatch(t.sector)).map(t => {
    const ms = D.mentions.filter(m => m.tabled === t);
    return { t, ms };
  }).filter(r => !S.notYet || r.t.raised !== 'Yes').sort((a, b) => b.t.date.localeCompare(a.t.date));
  const RAISED = { Yes: ['Raised in Parliament', 'ok'], No: ['Not yet mentioned in Parliament', ''], 'Post-rising': ['Tabled after Parliament rose', 'warn'] };
  return chips + `<div class="card" style="padding:8px 16px;gap:0">
    <div class="s13 muted" style="padding:8px 0">Victorian Auditor-General’s Office · reports tabled 3 Feb – 30 Oct 2026 · ${VIC.tabled.filter(t => t.raised === 'Yes').length} of ${VIC.tabled.length} raised in Parliament</div>
    ${rows.map(r => `<button class="list-btn" style="flex-direction:row;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:12px 0" data-act="report" data-v="${esc(r.t.url)}">
      <span style="flex:1 1 280px;display:flex;flex-direction:column;gap:2px;min-width:0"><b style="font-weight:600">${esc(r.t.title)}</b><span class="note">Tabled ${esc(fmtDay(r.t.date))} · ${esc(r.t.sector)}</span></span>
      <span class="s13" style="flex:0 0 96px">${plural(r.ms.length, 'mention')}</span>
      <span style="flex:1 1 200px">${pill(RAISED[r.t.raised][0], RAISED[r.t.raised][1])}</span></button>`).join('') || '<div class="s13 muted" style="padding:12px 0">No reports match.</div>'}
  </div>`;
}

function pageDev(M) {
  const { isAll, cur } = M;
  const mine = M.devs.filter(d => isAll || d.jur === cur.code);
  const types = ['All'].concat(DEV_TYPES).map(t => ({ t, n: t === 'All' ? mine.length : mine.filter(d => d.type === t).length })).filter(o => o.t === 'All' || o.n > 0);
  const list = mine.filter(d => S.devType === 'All' || d.type === S.devType);
  const card = d => `<div class="card" style="padding:14px 16px">
      <div class="row" style="font-size:12px">${pill(d.type, 'brand')}${pill(d.source, d.source === 'Office website' ? 'warn' : '')}<span class="muted nowrap">${esc(BY[d.jur].short)} · ${esc(fmtDay(d.date))}</span></div>
      <h3 style="margin:0;font-size:16px;font-weight:600;line-height:1.3">${esc(d.headline)}</h3>
      <div class="s13 fg2">${esc(d.body)}</div>
      ${d.why ? `<div class="s13 fg2"><b style="font-weight:600">Why it matters:</b> ${esc(d.why)}</div>` : ''}
      <div class="row" style="gap:8px;padding-top:2px">${safeUrl(d.url) ? `<a class="btn primary" href="${esc(d.url)}" target="_blank" rel="noopener">${d.source === 'Hansard' ? 'Open in Hansard ↗' : 'Open source ↗'}</a>` : '<span class="note">Source: the VAGO scan’s notes on the public record</span>'}</div>
    </div>`;
  const elsewhere = isAll ? [] : M.devs.filter(d => d.jur !== cur.code).slice(0, 4);
  const quiet = !list.length ? quietCard('No developments in this period.', D.developments.some(d => (isAll || d.jur === cur.code)) ? 'Earlier developments are stored. Widen the period to see them.' : 'Nothing recorded for this office yet.', S.period === 'all' ? '' : 'Show since February', 'period', 'all') : '';
  return `<div class="row">${types.map(o => `<button class="chip${S.devType === o.t ? ' on' : ''}" aria-pressed="${S.devType === o.t}" data-act="devtype" data-v="${esc(o.t)}">${esc(o.t)} ${o.n}</button>`).join('')}</div>
    <div class="stack">${list.map(card).join('')}${quiet}</div>
    ${elsewhere.length ? `<div class="card" style="gap:4px"><h2 class="card-title">Meanwhile, at other audit offices</h2><div class="note" style="margin-bottom:6px">Changes elsewhere in the period</div>
      ${elsewhere.map(d => `<div class="list-btn" style="cursor:default;flex-direction:row;flex-wrap:wrap;gap:4px 10px;align-items:baseline">${pill(d.type, 'brand thin')}<span style="flex:1 1 240px;font-weight:600">${esc(d.headline)}</span><span class="note nowrap">${esc(BY[d.jur].short)} · ${esc(fmtDay(d.date))}</span></div>`).join('')}</div>` : ''}
    <div class="note">Developments come from the VAGO scan (Victoria) and the Phase 0 source check (other offices). Hansard-based developments for other parliaments arrive with AI analysis.</div>`;
}

function pageGaps(M) {
  const { isAll, cur } = M;
  const indep = `<div class="info"><span style="color:var(--brand)" aria-hidden="true">ⓘ</span><span>Prepared from public sources. Each Auditor-General sets their own program; parliamentary attention is one input among many.</span></div>`;
  if (!isAll && cur.code !== 'VIC') {
    const p = cur.program;
    return indep + `<div class="card"><h2 class="card-title">Not compared yet</h2>
      <div class="s13 fg2">${p.name ? `${esc(cur.officeName)}’s program is <b style="font-weight:600">${esc(p.name)}</b>${safeUrl(p.url) ? ` (<a href="${esc(p.url)}" target="_blank" rel="noopener">open ↗</a>)` : ''}. Comparing it with what ${esc(cur.parl)} raises is spec Phase 5.` : `${esc(cur.officeName)} has no published forward program. When gap analysis runs, issues will be compared with its recent reports only.`}</div>
      <div class="s13 muted">Victoria has a full comparison from the VAGO scan. <button class="linkbtn" style="font-size:13px" data-act="jur" data-v="VIC">See Victoria’s potential gaps</button></div></div>`;
  }
  const tabledN = VIC.plan.filter(p => p.status !== 'Outstanding').length;
  const progHtml = `<div class="card" style="padding:14px 16px;flex-direction:row;flex-wrap:wrap;gap:8px 16px;align-items:center">
    <div style="flex:1 1 240px;display:flex;flex-direction:column;gap:2px"><div style="font-weight:600">${isAll ? 'VAGO · ' : ''}Annual Plan 2026–27</div><div class="note">${VIC.plan.length} audits: ${VIC.plan.length - tabledN} outstanding · ${tabledN} tabled by 30 Oct 2026 · compared with Victorian Hansard 3 Feb – 24 Sep 2026</div></div>
    ${pill('From the VAGO scan', 'brand')}</div>`;
  const topics = VIC.topics.filter(t => M.sectorMatch(t.sector)).sort((a, b) => a.rank - b.rank);
  const topicsHtml = topics.map(t => `<div class="card" style="flex-direction:row;gap:12px;align-items:flex-start">
      <div style="flex:none;width:28px;height:28px;border-radius:50%;background:var(--line2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px">${t.rank}</div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px">
        <button class="headline" data-act="topic" data-v="${t.rank}">${esc(t.topic)}</button>
        <div class="row" style="font-size:12px">${pill(t.gap, t.gap === 'Not covered' ? 'bad' : 'warn')}<span class="muted">${esc(t.sector)} · ${esc(t.agencies)}</span></div>
        <div class="row">${t.lanes.map(l => pill(l, 'thin plain')).join('')}<span class="note">signal lanes</span></div>
        <div class="s13 clamp3"><b style="font-weight:600">VAGO coverage.</b> ${esc(t.vago)}</div>
        ${t.changed ? `<div class="note clamp3"><b style="font-weight:600;color:var(--fg2)">Changed since August:</b> ${esc(t.changed)}</div>` : ''}
        <div><button class="btn" data-act="topic" data-v="${t.rank}">Evidence and detail</button></div>
      </div></div>`).join('') || quietCard('No ranked topics in this sector.', 'Try another sector.', 'Show all sectors', 'sector', '');
  const COVER = ['Not covered', 'Partially covered', 'Recently reported', 'Fully covered', 'Not applicable'];
  const COVER_CLS = { 'Not covered': 'bad', 'Partially covered': 'warn', 'Recently reported': 'ok', 'Fully covered': 'ok', 'Not applicable': '' };
  const themes = VIC.themes.filter(t => M.sectorMatch(t.sector));
  const sigN = name => VIC.signals.filter(s => s.theme === name).length;
  const MONTHS = ['2026-02', '2026-03', '2026-04', '2026-05', '2026-06', '2026-07', '2026-08', '2026-09'];
  const spark = name => { const c = MONTHS.map(mo => VIC.signals.filter(s => s.theme === name && s.date.startsWith(mo)).length), mx = Math.max(1, ...c); return `<svg viewBox="0 0 80 18" width="80" height="18" aria-hidden="true">${c.map((v, i) => `<rect x="${i * 10 + 1}" y="${18 - Math.max(v ? 3 : 1, v / mx * 18)}" width="8" height="${Math.max(v ? 3 : 1, v / mx * 18)}" fill="${v ? 'var(--gap)' : 'var(--line)'}"></rect>`).join('')}</svg>`; };
  const themeHtml = COVER.map(cv => { const ts = themes.filter(t => t.cover === cv); if (!ts.length) return ''; return `<div class="d-sec" style="margin-top:8px">${pill(cv, COVER_CLS[cv])} <span class="note">${ts.length}</span></div>
      ${ts.map(t => `<button class="trow s13" style="grid-template-columns:minmax(0,1fr) 84px 72px" data-act="theme" data-v="${esc(t.name)}"><span style="font-weight:600;min-width:0">${esc(t.name)}</span>${spark(t.name)}<span class="note" style="text-align:right">${plural(sigN(t.name), 'signal')}</span></button>`).join('')}`; }).join('');
  const blind = VIC.blindSpots.filter(b => M.sectorMatch(b.sector));
  return indep + progHtml + `<div class="stack">${topicsHtml}</div>
    <div class="grid g-2">
      <div class="card" style="gap:2px"><h2 class="card-title">Coverage by theme</h2><div class="note">28 themes from Victorian Hansard against VAGO’s plan and recent reports. Bars show signals by month, Feb – Sep.</div>${themeHtml}</div>
      <div class="stack">
        <div class="card"><h2 class="card-title">Blind spots</h2><div class="note">Issues with clear audit risk that Parliament didn’t raise</div>
          ${blind.map(b => `<div style="padding:10px 0;border-top:1px solid var(--line2)"><div style="font-weight:600">${esc(b.theme)}</div><div class="s13 fg2">${esc(b.why)}</div><div class="note" style="margin-top:4px">${esc(b.vago)}</div></div>`).join('') || '<div class="s13 muted">None in this sector.</div>'}</div>
        <div class="card"><details><summary>What the Victorian scan couldn’t see (${VIC.limitations.length})</summary>
          ${VIC.limitations.map(l => `<div style="padding:8px 0;border-top:1px solid var(--line2)"><div class="s13" style="font-weight:600">${esc(l.title)}</div><div class="note">${esc(l.text)}</div></div>`).join('')}</details></div>
        <div class="card"><details><summary>Corrections made during the scan (${VIC.corrections.length})</summary>
          ${VIC.corrections.map(c => `<div style="padding:8px 0;border-top:1px solid var(--line2)"><div class="s13" style="font-weight:600">${esc(c.what)}</div><div class="note">${esc(c.found)}</div><div class="note"><b>Action:</b> ${esc(c.action)}${safeUrl(c.src) ? ` · <a href="${esc(c.src)}" target="_blank" rel="noopener">Source ↗</a>` : ''}</div></div>`).join('')}</details></div>
      </div>
    </div>`;
}

function pageExplore(M) {
  const scope = S.expJur || S.jur;
  const q = S.q.trim().toLowerCase();
  let list = M.ms.filter(m => M.inP(m));
  if (scope !== 'ALL') list = list.filter(m => m.jur === scope);
  if (S.expSide !== 'all') list = list.filter(m => m.side === S.expSide);
  if (S.newOnly) list = list.filter(M.isNew);
  if (q) list = list.filter(m => [m.text, m.debate, m.speaker, m.party, m.report, m.note, m.house, BY[m.jur].name, m.topic].join(' ').toLowerCase().includes(q));
  const hl = t => { const s = String(t || ''); if (!q) return esc(s); let out = '', k = 0, low = s.toLowerCase(); for (let i = 0; i < 30; i++) { const f = low.indexOf(q, k); if (f < 0) break; out += esc(s.slice(k, f)) + '<mark>' + esc(s.slice(f, f + q.length)) + '</mark>'; k = f + q.length; } return out + esc(s.slice(k)); };
  const scopeLabel = scope === 'ALL' ? 'All parliaments' : 'Only ' + BY[scope].name;
  M.exploreList = list;
  return `<div style="display:flex;gap:8px"><div class="search">${ICON.search}<label class="sr" for="q">Search Hansard</label><input id="q" class="field" type="search" value="${esc(S.q)}" placeholder="Search Hansard — try “waitlist”, “procurement” or a member’s name" data-input="q" autocomplete="off"></div>${S.q ? '<button class="btn" data-act="clearq">Clear</button>' : ''}</div>
    <div class="row">
      <button class="chip${scope !== 'ALL' ? ' on' : ''}" aria-pressed="${scope !== 'ALL'}" data-act="expscope">${esc(scopeLabel)}</button>
      <button class="chip${S.newOnly ? ' on' : ''}" aria-pressed="${S.newOnly}" data-act="newonly">New this week</button>
      ${['all', 'government', 'opposition', 'crossbench'].map(k => `<button class="chip${S.expSide === k ? ' on' : ''}" aria-pressed="${S.expSide === k}" data-act="expside" data-v="${k}">${k === 'all' ? 'Any side' : esc(SIDES[k][0])}</button>`).join('')}
    </div>
    <div class="s13" style="font-weight:600" role="status">${plural(list.length, 'result')}${scope === 'ALL' ? ' across the parliaments read' : ' in ' + esc(BY[scope].name)}</div>
    <div class="stack" style="gap:8px">
      ${list.slice(0, 60).map(m => `<button class="tile" style="gap:5px" data-act="item" data-v="${esc(m.id)}">
        <span class="row" style="font-size:12px"><span class="dot" style="background:${BY[m.jur].color}"></span><span class="muted nowrap">${esc(where(m, true))}</span><span class="muted">· ${hl(m.debate || '')}</span>${sidePill(m)}${M.isNew(m) ? pill('New', 'new thin') : ''}</span>
        <span style="font-size:15px;font-weight:600">${esc(m.speaker || 'Unnamed')}${m.party ? ' · ' + esc(m.party) : ''}</span>
        <span class="s13 fg2 clamp4">${hl(m.text)}</span>
        ${m.report ? `<span class="note">Report: ${hl(m.report)}</span>` : ''}
      </button>`).join('')}
      ${list.length > 60 ? `<div class="note">Showing the newest 60. Export the results for all ${list.length}.</div>` : ''}
      ${list.length ? '' : '<div class="card dashed s13 muted">No matches. Try fewer words, widen the period, or include all parliaments.</div>'}
    </div>`;
}

// ---------------------------------------------------------------- drawers
function drawerItem(M, id) {
  const m = D.mentions.find(x => x.id === id);
  if (!m) return { title: 'Details', body: '<div class="s13 muted">This mention isn’t in the snapshot.</div>' };
  const j = BY[m.jur], inBrief = PR.adds.includes(m.id);
  const related = D.mentions.filter(o => o.id !== m.id && ((m.src === 'scan' && o.jur === m.jur && o.date === m.date && o.debate === m.debate) || (m.report && o.report && norm(o.report) === norm(m.report)))).slice(0, 5);
  const st = STANCE[m.stance];
  return { title: 'Details', body: `
    <div class="row">${[m.report ? 'Report mention' : 'Auditor-General mention', KIND[m.kind]].concat(m.sectors.map(s => SECT[s].label)).filter(Boolean).map(t => pill(t, 'plain')).join('')}</div>
    <h3 class="d-title">${esc(headlineFor(m))}</h3>
    <div class="s13 muted">${esc(j.parl)} · ${esc(m.house)} · ${esc(fmtDay(m.date))}${m.page ? ' · page ' + esc(m.page) : ''}</div>
    ${st ? `<div class="row s13">${stancePill(m)}<span class="fg2">${esc(st[2])}</span></div>` : ''}
    <blockquote class="bq">“${esc(m.text)}”</blockquote>
    ${verifiedLine(m)}
    ${m.note ? `<div class="aibox"><div class="ai" style="font-size:11px">✦ Note from the VAGO scan (AI-assisted) — check the source</div><div>${esc(m.note)}</div></div>` : ''}
    ${m.report ? `<div class="s13"><b style="font-weight:600">Report:</b> ${m.tabled ? `<button class="linkbtn" style="font-size:13px" data-act="report" data-v="${esc(m.tabled.url)}">${esc(m.report)}</button>` : esc(m.report)}${m.reportHow === 'pattern' ? ' <span class="note">(report number found in the text)</span>' : ''}</div>` : (m.topic ? `<div class="s13"><b style="font-weight:600">About:</b> ${esc(m.topic)}</div>` : '')}
    <div class="s13 fg2" style="border-top:1px solid var(--line);padding-top:10px">${esc(speakerLine(m))}${m.side ? ' · ' + esc(SIDES[m.side][0]) : ''}<br>${esc(m.debate || '')}</div>
    <div class="row" style="gap:8px">${srcBtn(m)}<button class="btn" data-act="cite" data-v="${esc(m.id)}">Copy citation</button><button class="btn" data-act="add" data-v="${esc(m.id)}">${inBrief ? '✓ In your brief' : 'Add to brief'}</button>${ARTIFACT ? '' : `<button class="btn" data-act="share" data-v="1">${ICON.share} Share</button>`}</div>
    ${related.length ? `<div class="d-sec">${m.report ? 'Other mentions of this report' : 'Also in this debate'}</div>${related.map(o => `<button class="rel" data-act="item" data-v="${esc(o.id)}"><span class="note">${esc(where(o, o.jur !== m.jur))}</span><span>${esc(speakerLine(o))}</span></button>`).join('')}` : ''}` };
}
function drawerReport(M, id) {

  const RAISED = { Yes: ['Raised in Parliament', 'ok'], No: ['Not yet mentioned in Parliament', ''], 'Post-rising': ['Tabled after Parliament rose', 'warn'] };
  return { title: 'Report', body: `
    <h3 class="d-title">${esc(t.title)}</h3>
    <div class="s13 muted">Victorian Auditor-General’s Office · tabled ${esc(fmtDay(t.date))} · ${esc(t.sector)}</div>
    <div class="row">${pill(RAISED[t.raised][0], RAISED[t.raised][1])}</div>
    <div class="aibox"><div class="ai" style="font-size:11px">✦ Finding as summarised by the VAGO scan — check the report</div><div>${esc(t.finding)}</div></div>
    <div class="s13"><b style="font-weight:600">Debated:</b> ${esc(t.debated)}</div>
    ${ms.length ? `<div class="d-sec">Mentions in Parliament</div>${ms.map(m => mentionEntry(m, M, false)).join('')}` : `<div class="s13" style="padding:12px;border:1px dashed var(--stroke);border-radius:4px">${t.raised === 'Post-rising' ? 'Tabled after Parliament rose, so this Parliament can’t debate it.' : 'No member spoke to this report in the transcripts the scan read.'}</div>`}
    ${safeUrl(t.url) ? `<div><a class="btn" href="${esc(t.url)}" target="_blank" rel="noopener">Open on the VAGO website ↗</a></div>` : ''}` };
}
function drawerTopic(M, id) {

    <div class="s13 fg2">${esc(t.agencies)}</div>

    <div class="s13"><b style="font-weight:600">Audit question:</b> ${esc(t.question)}</div>
    <dl class="kv"><dt>Severity</dt><dd>${esc(t.severity)}</dd><dt>Scale</dt><dd>${esc(t.scale)}</dd><dt>Breadth</dt><dd>${esc(t.breadth)}</dd><dt>Urgency</dt><dd>${esc(t.urgency)}</dd><dt>Signals</dt><dd>${esc(t.lanes.join(' · '))}</dd></dl>
    <div class="s13"><b style="font-weight:600">VAGO coverage:</b> ${esc(t.vago)}</div>
    ${t.changed ? `<div class="s13 fg2" style="padding:10px 12px;background:var(--brand-tint2);border-radius:4px"><b style="font-weight:600">Changed since August:</b> ${esc(t.changed)}</div>` : ''}
    ${t.caution ? `<div class="info warn"><span aria-hidden="true">⚠</span><span>${esc(t.caution)}</span></div>` : ''}
    <div class="note">Prepared from public sources. Each Auditor-General sets their own program; parliamentary attention is one input among many.</div>` };

function drawerTheme(M, id) {
  const t = VIC.themes.find(x => x.name === id), cv = VIC.coverage[id];
  if (!t) return { title: 'Theme', body: '<div class="s13 muted">This theme isn’t in the snapshot.</div>' };

// ---------------------------------------------------------------- render
let lastMob = null, lastTab = null, opener = null, lastOverlay = '';
function render() {
  const app = document.getElementById('app');
  const ae = document.activeElement, fsig = ae && ae !== document.body ? { id: ae.id, act: ae.dataset && ae.dataset.act, v: ae.dataset && ae.dataset.v, ss: ae.selectionStart, se: ae.selectionEnd } : null;
  if (S.stage === 'onboard') {
    app.className = 'shell' + (mob ? ' mob' : '');
    app.innerHTML = viewOnboard();
    lastMob = null;
  } else {
    if (lastMob !== mob || !document.getElementById('main')) {
      app.className = 'shell' + (mob ? ' mob' : '');
      app.innerHTML = `<header class="hdr" id="hdr"></header><main id="main"><div class="page" id="page"></div></main>${mob ? '<nav class="bnav" id="bnav" aria-label="Pages"></nav>' : ''}<div id="ovl"></div><div id="toastbox"></div>`;
      lastMob = mob;
    }
    const M = model();
    document.getElementById('hdr').innerHTML = viewHeader(M);
    const pg = { brief: pageBrief, compare: pageCompare, mentions: pageMentions, dev: pageDev, gaps: pageGaps, explore: pageExplore }[S.tab](M);
    document.getElementById('page').innerHTML = viewPageHead(M) + pg;
    if (mob) document.getElementById('bnav').innerHTML = viewBottomNav();
    const ovl = viewOverlays(M);
    document.getElementById('ovl').innerHTML = ovl;
    if (lastTab !== S.tab) { document.getElementById('main').scrollTop = 0; lastTab = S.tab; }
    window.__M = M;
    // Move focus into a newly opened drawer or dialog; give it back when it closes.
    const kind = S.share ? 'share' : S.drawer ? 'drawer:' + S.drawer.k + S.drawer.id : '';
    if (kind !== lastOverlay) {
      if (kind) { const el = document.getElementById(S.share ? 'sclose' : 'dclose'); if (el) { el.focus(); renderToast(); syncHash(); lastOverlay = kind; return; } }
      else if (opener) { const el = findSig(opener); opener = null; if (el) { el.focus(); renderToast(); syncHash(); lastOverlay = kind; return; } }
      lastOverlay = kind;
    }
  }
  if (fsig) { const el = findSig(fsig); if (el && el !== document.activeElement) { el.focus(); if (fsig.ss != null && el.setSelectionRange) try { el.setSelectionRange(fsig.ss, fsig.se); } catch (e) { /* not a text field */ } } }
  renderToast();
  syncHash();
}
function findSig(f) {
  if (f.id) return document.getElementById(f.id);
  if (!f.act) return null;
  const all = document.querySelectorAll(`[data-act="${CSS.escape(f.act)}"]`);
  for (const el of all) if ((el.dataset.v || '') === (f.v || '')) return el;
  return null;
}
function renderToast() {
  const box = document.getElementById('toastbox');
  if (box) box.innerHTML = S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '';
}

// ---------------------------------------------------------------- actions
function markSeen(id) { if (!PR.seen.includes(id)) { PR.seen.push(id); savePrefs(); } }
function copyText(text, msg) {
  const done = () => toast(msg);
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; } ta.remove(); toast(ok ? msg : 'Couldn’t copy here. Select the text and copy it yourself.'); };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}
function csv(rows, cols) {
  const q = v => { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [cols.map(c => q(c[0])).join(',')].concat(rows.map(r => cols.map(c => q(c[1](r))).join(','))).join('\r\n');
}
function download(name, text) {
  if (ARTIFACT) { copyText(text, `${name} copied as CSV — paste it into a spreadsheet`); return; }
  try {
    const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Downloaded ' + name);
  } catch (e) { copyText(text, 'Downloads are blocked here, so the CSV was copied instead'); }
}
const MENTION_COLS = [['date', m => m.date], ['parliament', m => m.jur], ['chamber', m => m.house], ['speaker', m => m.speaker], ['party', m => m.party], ['side', m => m.side], ['debate', m => m.debate], ['kind', m => KIND[m.kind] || m.kind], ['report', m => m.report], ['stance', m => m.stance], ['verified', m => m.verified], ['text', m => m.text], ['page', m => m.page], ['source', m => m.url]];
function doExport(kind) {
  const M = window.__M, tag = (M.isAll ? 'all' : S.jur.toLowerCase()) + '-' + S.period;
  if (kind === 'copybrief') {
    const lines = M.pool.filter(M.subst).slice(0, 5).map(m => `• ${headlineFor(m)} — ${m.speaker}${m.party ? ' (' + m.party + ')' : ''}, ${BY[m.jur].short}, ${fmtDay(m.date)}. ${m.url}`);
    copyText(`${M.per.title} — ${M.isAll ? 'ACAG' : M.cur.office} (${M.range})\n${lines.join('\n') || 'No mentions in this period.'}${ARTIFACT ? '' : '\n' + location.href.split('#')[0] + '#' + toHash(false)}`, 'Brief copied — paste it into email or Teams');
  } else if (kind === 'csv-mentions') {
    const list = S.tab === 'mentions' ? M.ms.filter(m => m.jur === (S.agSel || (M.isAll ? 'VIC' : M.cur.code)) && M.inP(m) && (S.side === 'all' || m.side === S.side)) : M.pool;
    download(`mentions-${tag}.csv`, csv(list, MENTION_COLS));
  } else if (kind === 'csv-explore') download(`explore-${tag}.csv`, csv(M.exploreList || [], MENTION_COLS));
  else if (kind === 'csv-compare') download(`compare-${S.period}.csv`, csv(CODES.map(c => ({ c, read: M.readInPeriod(c), n: M.countFor(c), sp: M.speechesFor(c) })), [['parliament', r => BY[r.c].name], ['read', r => r.read ? 'yes' : 'no'], ['mentions', r => r.read ? r.n : ''], ['speeches', r => r.read && r.sp ? r.sp : ''], ['per_1000', r => r.read && r.sp ? (r.n / r.sp * 1000).toFixed(2) : '']]));
  else if (kind === 'csv-reports') download('vago-report-register.csv', csv(VIC.tabled, [['tabled', t => t.date], ['title', t => t.title], ['sector', t => t.sector], ['raised_in_parliament', t => t.raised], ['debated', t => t.debated], ['finding', t => t.finding], ['url', t => t.url]]));
  else if (kind === 'csv-dev') download(`developments-${tag}.csv`, csv(M.devs.filter(d => M.isAll || d.jur === M.cur.code), [['date', d => d.date], ['office', d => BY[d.jur].office], ['type', d => d.type], ['source', d => d.source], ['headline', d => d.headline], ['detail', d => d.body], ['why_it_matters', d => d.why], ['url', d => d.url]]));
  else if (kind === 'csv-gaps') download('vago-gap-longlist.csv', csv(VIC.topics, [['rank', t => t.rank], ['topic', t => t.topic], ['coverage', t => t.gap], ['sector', t => t.sector], ['agencies', t => t.agencies], ['signal_lanes', t => t.lanes.join('; ')], ['why', t => t.why], ['audit_question', t => t.question], ['vago_coverage', t => t.vago], ['changed_since_august', t => t.changed], ['caution', t => t.caution]]));
}
const ACT = {
  tab: v => { opener = null; setState({ tab: v, drawer: null, menu: null, limit: 20 }); },
  menu: (v, el) => setState({ menu: S.menu === v ? null : v }),
  closemenu: () => setState({ menu: null }),
  jur: v => { PR.jur = v; savePrefs(); setState({ jur: v, agSel: null, repOff: null, expJur: null, menu: null, shared: false, drawer: S.drawer && S.drawer.k === 'about' ? S.drawer : null }); toast('Now viewing ' + (v === 'ALL' ? 'all jurisdictions' : BY[v].name)); },
  period: v => setState({ period: v, menu: null }),
  sector: v => { setState({ sector: v || null, menu: null, devType: 'All' }); toast(v ? 'Showing ' + SECT[v].label : 'Showing all sectors'); },
  map: v => setState({ mapMode: v }),
  mtab: v => setState({ mTab: v }),
  reports: () => setState({ tab: 'mentions', mTab: 'reports', drawer: null, menu: null }),
  agsel: v => setState({ agSel: v, side: 'all', limit: 20 }),
  side: v => setState({ side: v, limit: 20 }),
  more: () => setState({ limit: S.limit + 20 }),
  repoff: v => setState({ repOff: v }),
  notyet: () => setState({ notYet: !S.notYet }),
  devtype: v => setState({ devType: v }),
  expscope: () => { const cur = S.expJur || S.jur; setState({ expJur: cur === 'ALL' ? (S.jur === 'ALL' ? 'VIC' : S.jur) : 'ALL' }); },
  expside: v => setState({ expSide: v }),
  newonly: () => setState({ newOnly: !S.newOnly }),
  clearq: () => { setState({ q: '' }); const el = document.getElementById('q'); if (el) el.focus(); },
  heat: v => { const [c, s] = v.split('|'); setState({ tab: 'explore', expJur: c, sector: s, q: '', drawer: null, menu: null }); },
  shownew: () => setState({ tab: 'explore', newOnly: true, q: '', expJur: S.jur, expSide: 'all', drawer: null, menu: null }),
  item: (v, el) => { if (!S.drawer) opener = sigOf(el); markSeen(v); setState({ drawer: { k: 'item', id: v }, menu: null }); },
  report: (v, el) => { if (!S.drawer) opener = sigOf(el); setState({ drawer: { k: 'report', id: v }, menu: null }); },
  topic: (v, el) => { if (!S.drawer) opener = sigOf(el); setState({ drawer: { k: 'topic', id: v }, menu: null }); },
  theme: (v, el) => { if (!S.drawer) opener = sigOf(el); setState({ drawer: { k: 'theme', id: v }, menu: null }); },
  about: (v, el) => { if (!S.drawer) opener = sigOf(el); setState({ drawer: { k: 'about', id: '1' }, menu: null }); },
  closedrawer: () => setState({ drawer: null }),
  seen: v => { markSeen(v); setTimeout(render, 0); },
  cite: v => { const m = D.mentions.find(x => x.id === v); if (m) copyText(`${m.speaker}${m.party ? ' (' + m.party + ')' : ''}, ${m.debate || KIND[m.kind]}, ${m.house}, ${BY[m.jur].parl}, ${fmtLong(m.date)}${m.page ? ', p. ' + m.page : ''}. ${m.url}`, 'Citation copied'); },
  add: v => { const i = PR.adds.indexOf(v); if (i >= 0) PR.adds.splice(i, 1); else PR.adds.push(v); savePrefs(); render(); toast(i >= 0 ? 'Removed from your brief' : 'Added to your brief'); },
  share: v => setState({ share: { withDrawer: v === '1' }, menu: null }),
  closeshare: () => setState({ share: null }),
  copylink: () => { const el = document.getElementById('sharelink'); copyText(el ? el.value : location.href, 'Link copied — paste it anywhere'); },
  unshare: () => setState({ sharedHidden: true }),
  restart: () => setState({ stage: 'onboard', menu: null, drawer: null, share: null, ob: { jur: PR.jur || (S.shared ? S.jur : null), start: PR.start || 'brief' } }),
  objur: v => { S.ob.jur = v; render(); },
  obstart: v => { S.ob.start = v; render(); },
  obgo: () => { if (!S.ob.jur) return; PR.jur = S.ob.jur; PR.start = S.ob.start; savePrefs(); Object.assign(S, VIEW_DEFAULTS(), { stage: 'app', jur: S.ob.jur, tab: S.ob.start, shared: false }); lastHash = ''; render(); },
};
for (const k of ['copybrief', 'csv-mentions', 'csv-explore', 'csv-compare', 'csv-reports', 'csv-dev', 'csv-gaps']) ACT[k] = () => { setState({ menu: null }); doExport(k); };
function sigOf(el) { return el ? { id: el.id, act: el.dataset.act, v: el.dataset.v } : null; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (S.menu && !e.target.closest('.popmenu, .sheet') && !(el && el.dataset.act === 'menu')) { S.menu = null; if (!el) { render(); return; } }
  if (!el || el.hasAttribute('disabled')) return;

});

// Chart tooltips
let tipEl = null;

  if (!t) { if (tipEl) { tipEl.remove(); tipEl = null; } return; }
  if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl); }
  tipEl.textContent = t.getAttribute('data-tip');
  const r = t.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;

matchMedia('(max-width: 767px)').addEventListener('change', e => { mob = e.matches; S.menu = null; render(); });
addEventListener('hashchange', () => {
  if (location.hash === lastHash) return;
  if (ARTIFACT) { const v = HASH_VIEW[location.hash.slice(1)]; lastHash = location.hash; if (v && S.stage === 'app') setState({ tab: v, drawer: null, menu: null }); return; }
  const h = fromHash(); if (!h) return;
  Object.assign(S, VIEW_DEFAULTS(), h, { stage: 'app', menu: null, share: null, shared: !PR.jur || PR.jur !== h.jur, sharedHidden: false });
  lastHash = location.hash; render();
});

// ---------------------------------------------------------------- start
const h = ARTIFACT ? null : fromHash();
if (ARTIFACT) { const v = HASH_VIEW[location.hash.slice(1)]; lastHash = location.hash; if (PR.jur) Object.assign(S, { stage: 'app', jur: PR.jur, tab: v || PR.start }); else S.ob = { jur: null, start: v || 'brief' }; }
else if (h) { Object.assign(S, h, { stage: 'app', shared: !PR.jur || PR.jur !== h.jur }); lastHash = location.hash; }
else if (PR.jur) Object.assign(S, { stage: 'app', jur: PR.jur, tab: PR.start });
else S.ob = { jur: null, start: 'brief' };
render();
})();
