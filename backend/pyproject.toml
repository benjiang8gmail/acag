[project]
name = "hansard-watch-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.1",
    "bcrypt==5.0.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
