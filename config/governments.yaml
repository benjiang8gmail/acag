        government: [ALP]
        government_type: majority  # House 94 of 150
        opposition: [LIB, NAT, LNP, CLP]   # LNP and CLP members sit in the Liberal or Nationals party rooms
        leader_of_opposition: {name: Angus Taylor, party: LIB, since: 2026-02-13}
        notes: >
          The Nationals left the Coalition on 22 Jan 2026 and rejoined on 8 Feb 2026, so
          they count as opposition throughout the backfill window. Matt Canavan has
          led the Nationals since about Mar 2026. Crossbench: GRN, PHON (One Nation;
          Barnaby Joyce from Dec 2025, David Farley from the 9 May 2026 Farrer by-election),
          Community Strong Australia (Spender, Steggall; launched 25 Jun 2026), KAP, CA,
          JLN, UAP, AV (Australia's Voice), independents.
        confidence: high
    party_codes:
      ALP: {party: Australian Labor Party, verified: true}
      LP: {party: Liberal Party of Australia, verified: true, note: older House files}
      LIB: {party: Liberal Party of Australia, verified: false}
      NATS: {party: The Nationals, verified: true}
      NAT: {party: The Nationals, verified: false}
      LNP: {party: Liberal National Party of Queensland, verified: true}
      CLP: {party: Country Liberal Party, verified: true}
      AG: {party: Australian Greens, verified: true, note: older House files}
      GRN: {party: Australian Greens, verified: false}
      IND: {party: Independent, verified: true}
      PHON: {party: Pauline Hanson's One Nation, verified: false}
      JLN: {party: Jacqui Lambie Network, verified: false}
