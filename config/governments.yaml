# Governing parties per parliament (spec §9.4, §14). Code uses this to set
# `speaker_side` (government / opposition / crossbench / unknown); the model never does.
#
# Rules applied in code:
#   - A member of a party listed under `government` is government. So is any
#     minister, parliamentary secretary or assistant minister, whatever their party.
#   - A member of a party listed under `opposition` is opposition.
#   - Any other party, or an independent, is crossbench. That includes presiding
#     officers who are independents (e.g. NSW Speaker Greg Piper).
#   - If the speaker's party is not known, the side is `unknown`. Never guess.
#   - A speech's side is set by the `periods` entry in force on the sitting date.
#
# Parties are matched by `party_codes`, which hold the abbreviations each
# parliament's Hansard uses. Codes differ between parliaments: in Victorian Hansard
# "LP" is the Libertarian Party, but in older Commonwealth files it is the Liberal
# Party. Codes are therefore scoped to each parliament. Codes marked `verified: false`
# must be confirmed against the Phase 0 fixtures before Phase 2 relies on them.
#
# Verified 31 Oct 2026 by web search only. Direct fetches from the cloud container
# were refused, so see docs/sources.md §0. Confidence: high = official or
# dated-2026 reputable source; medium = consistent secondary sources.
# Re-verify after any election, change of leader or new agreement.
# Victoria goes to the polls on 28 Nov 2026, so update VIC straight after.

as_of: 2026-10-31

