  - Auditor General
  - Auditors-General
  - Auditor-General's report
  - audit report
  - performance audit
  - financial audit
  - audit office
  - Audit Act
  - audit recommendations
  - recommendations of the Auditor-General

# How tabling is recorded in each parliament's Hansard. `verified: true` means the
# wording was seen in a 2026 Hansard or Votes and Proceedings snippet. The rest
# must be confirmed from the Phase 0 fixtures.
tabling_phrases:
  VIC:
    verified: true
    patterns:
      - "Auditor-General – {title} – Ordered to be published"
      - "Auditor-General — {title} — Ordered to be published"
      - "Auditor-General – {title}, {Month YYYY} (Ordered to be published)"   # Legislative Council
    section_headings: [Documents, Papers, Documents tabled under Acts of Parliament]
  NSW:
    verified: partly   # "Auditor-General" heading seen in the LA proof of 15 Sep 2026
    patterns:
      - "Financial Audit Report of the Auditor-General entitled {title}"
      - "Performance Audit Report of the Auditor-General entitled {title}"
      - "report of the Auditor-General entitled {title}"
    section_headings: [Auditor-General]
  CTH:
    verified: false
    patterns:
      - "Auditor-General's reports"
      - "Auditor-General Report No. {n} {YYYY–YY}"
      - "Report No. {n} of {YYYY–YY}"
  QLD:
    verified: false
    patterns:
      - "Auditor-General Report {n}: {YYYY–YY} – {title}"
      - "Report to Parliament {n}: {YYYY–YY}"
  SA:
    verified: false
    patterns:
      - "Auditor-General's Report {n} of {YYYY}"
      - "Report of the Auditor-General"
  WA:
    verified: false
    patterns:
      - "Auditor General's report"
      - "Report {n}: {YYYY-YY}"
  TAS:
    verified: false
    patterns:
      - "Report of the Auditor-General No. {n} of {YYYY-YY}"
  ACT:
    verified: true   # seen in ACT Hansard, 22 Oct 2026 (proof), page 3542
    patterns:
      - "Auditor-General Act, pursuant to section 17—Auditor-General’s Report No {n}/{YYYY}—{title}, dated {date}"
    section_headings: [Papers]
  NT:
    verified: false
    patterns:
      - "Report to the Legislative Assembly {n}: {YYYY-YY}"
      - "Auditor-General's report to the Legislative Assembly"

request_phrases:
  - call on the Auditor-General
  - calls on the Auditor-General
  - refer * to the Auditor-General
  - referred to the Auditor-General
  - ask the Auditor-General to
  - asked the Auditor-General to
  - request the Auditor-General
  - requested the Auditor-General
  - wrote to the Auditor-General
  - Auditor-General should investigate
  - Auditor-General to investigate
  - Auditor-General to audit
  - an audit of
  - independent audit

# Public accounts and audit oversight committees (verified Oct 2026)
committees:
  CTH: [Joint Committee of Public Accounts and Audit, JCPAA]
  NSW: [Public Accounts Committee, Public Accountability and Works Committee]
  VIC: [Public Accounts and Estimates Committee, PAEC]
  QLD: [Governance, Energy and Finance Committee]   # oversees the Auditor-General since 28 Nov 2024; Queensland has had no PAC since 2011
  SA: [Economic and Finance Committee, Budget and Finance Committee]   # SA has no Public Accounts Committee
  WA: [Public Accounts Committee, Estimates and Financial Operations Committee]
  TAS: [Parliamentary Standing Committee of Public Accounts, Public Accounts Committee]
  ACT: [Standing Committee on Public Accounts and Administration, Standing Committee on Public Accounts]   # renamed 3 Dec 2024; the old name is kept as an alias
  NT: [Public Accounts Committee]
committee_generic: [Public Accounts Committee, PAC, Estimates, Senate Estimates, budget estimates]

