# Audit lexicon for the pre-filter (spec §9.2, stage B). Any hit on these lists
# always sends a speech to LLM triage, and the reason is recorded.
#
# Matching is case-insensitive and whitespace-normalised, and it treats hyphen,
# en dash and space as the same in "Auditor-General", "Auditor General" and
# "Auditor–General". WA writes "Auditor General" with no hyphen.
#
# Verified 31 Oct 2026 by web search of official sources (appointment notices,
# office "about" pages, signed 2026 reports). Direct page fetches from the cloud
# container were refused, so see docs/sources.md §0. Re-check Auditor-General names
# whenever a register refresh shows a new signatory.

as_of: 2026-10-31
version: 1

# Attribution rule (§9.2): an unqualified "the Auditor-General" refers to the
# Auditor-General of the speaking parliament's own jurisdiction.
attribution:
  CTH: ANAO
  NSW: AONSW
  VIC: VAGO
  QLD: QAO
  SA: SAAGD
  WA: OAGWA
  TAS: AUDTAS
  ACT: ACTAO
  NT: NTAGO

offices:
  ANAO:
    names: [Australian National Audit Office, ANAO, National Audit Office]
    office_holder_titles: [Auditor-General for Australia, Commonwealth Auditor-General, federal Auditor-General]
  AONSW:
    names: [Audit Office of New South Wales, Audit Office of NSW, NSW Audit Office, New South Wales Audit Office, AONSW]
    office_holder_titles: [NSW Auditor-General, New South Wales Auditor-General, Auditor-General of New South Wales]
  VAGO:
    names: [Victorian Auditor-General's Office, VAGO, Auditor-General's Office]
    office_holder_titles: [Victorian Auditor-General, Auditor-General of Victoria]
  QAO:
    names: [Queensland Audit Office, QAO]
    office_holder_titles: [Queensland Auditor-General, Auditor-General of Queensland]
  SAAGD:
    # Renamed on 1 Jul 2024 by the Public Sector (Machinery of Government) Proclamation 2024.
    names: [Audit Office of South Australia, Auditor-General's Department, Auditor-General's Department of South Australia, AGD]
    office_holder_titles: [South Australian Auditor-General, Auditor-General of South Australia, SA Auditor-General]
    ambiguous: [AGD]   # count only near audit context: "AGD" is also the Commonwealth Attorney-General's Department
  OAGWA:
    names: [Office of the Auditor General, Office of the Auditor General for Western Australia, Office of the Auditor General Western Australia, OAG, OAG WA]
    office_holder_titles: [Western Australian Auditor General, WA Auditor General, Auditor General for Western Australia]
    ambiguous: [OAG, Office of the Auditor General]   # attribute to WA only in WA Hansard, or when "Western Australia" is nearby
  AUDTAS:
    names: [Audit Tasmania, Tasmanian Audit Office, TAO]
    office_holder_titles: [Tasmanian Auditor-General, Auditor-General of Tasmania]
    ambiguous: [TAO]
  ACTAO:
    names: [ACT Audit Office, Audit Office of the ACT]
    office_holder_titles: [ACT Auditor-General, Auditor-General of the ACT]
  NTAGO:
    names: [Northern Territory Auditor-General's Office, NT Auditor-General's Office, NTAGO, Auditor-General's Office]
    office_holder_titles: [Northern Territory Auditor-General, NT Auditor-General, Auditor-General for the Northern Territory]
    ambiguous: [Auditor-General's Office]   # VAGO uses the same phrase; apply the attribution rule

