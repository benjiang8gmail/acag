# The 15 Hansard chambers (spec §5.1, §14). One row per chamber; seeds the
# `sources` table. Details and evidence are in docs/sources.md.
#
# status values (spec §7): ok | no_sittings | blocked | error, plus `unverified`.
# Set from the live check of 31 Oct 2026 (docs/sources.md §0a), made from a US
# cloud network: re-test the blocked ones from the pilot's Australian network.
# `enabled` is true only once the connector passes its real-fixture tests (Phase 2).
# Enabled: NSW (31 Oct 2026; live checks 21–22 Oct 2026), ACT (1 Nov 2026; live check 22–31 Oct 2026),
# QLD (1 Nov 2026; live check 14–31 Oct 2026), CTH via the OpenAustralia mirror (1 Nov 2026; live check 12–31 Oct 2026),
# NT via Territory Stories text pages (1 Nov 2026; 22 Oct 2026 captured live),
# TAS via the Parliament's document search (1 Nov 2026; 10 Sep 2026 captured live).

as_of: 2026-10-31

sources:
  - id: CTH-SEN
    parliament: CTH
    chamber: Senate
    connector: cth
    enabled: true
    status: ok
    live_check: "aph.gov.au blocks scripts (Azure WAF); APH's own Hansard XML read from the OpenAustralia mirror instead (data.openaustralia.org.au/origxml)"
    approach: openaustralia_mirror   # APH's official XML, republished by OpenAustralia; ~1 day behind APH
    risk: "third-party reports of an Azure WAF answering 403 to scripts on aph.gov.au and parlinfo.aph.gov.au"
    timezone: Australia/Sydney
  - id: CTH-HOR
    parliament: CTH
    chamber: House of Representatives   # includes the Federation Chamber (<fedchamb.xscript>)
    connector: cth
    enabled: true
    status: ok
