# The 15 Hansard chambers (spec §5.1, §14). One row per chamber; seeds the
# `sources` table. Details and evidence are in docs/sources.md.
#
# status values (spec §7): ok | no_sittings | blocked | error, plus `unverified`.
# Set from the live check of 31 Oct 2026 (docs/sources.md §0a), made from a US
# cloud network: re-test the blocked ones from the pilot's Australian network.
# `enabled` stays false until the connector passes its real-fixture tests (Phase 2).

